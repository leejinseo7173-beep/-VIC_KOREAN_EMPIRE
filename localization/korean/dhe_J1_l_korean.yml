 dhe_button_imperial_navy_admiralty:0 "해군성 설치"
 dhe_button_imperial_navy_admiralty_desc:0 "해군 행정과 함대 운용을 통합할 해군성을 설치합니다. #n 권위 50#! 소모, 720일 쿨다운."
 dhe_button_imperial_navy_dockyard:0 "제국 조선소 확장"
 dhe_button_imperial_navy_dockyard_desc:0 "철갑함과 순양함을 건조할 수 있도록 조선소와 군항 설비에 국고를 투입합니다. #n 국고 6만#! 소모, 720일 쿨다운."
 dhe_button_imperial_navy_fleet_exercises:0 "연합함대 기동훈련"
 dhe_button_imperial_navy_fleet_exercises_desc:0 "함대 기동훈련을 실시해 연안 방어 함대를 실제 작전 가능한 연합함대로 끌어올립니다. #n 국고 3만#! 소모, 720일 쿨다운."
 dhe_button_imperial_navy_design_bureau:0 "함선 설계국 설치"
 dhe_button_imperial_navy_design_bureau_desc:0 "대한제국 고유의 #v 광무급 초노급함#!과 #v 광무식 함선 모듈#!을 개발할 별도 일지를 시작합니다. 이 버튼은 기술을 즉시 연구하지 않습니다. #v 초노급함 기술#!, #v 5단계 이상 조선소#!, #n 국고 3만#! 필요."
 dhe_requires_early_dreadnought_tech_tt:0 "#v 초노급함#! 설계를 시작할 수 있는 기반 기술을 보유함"

 je_dhe_naval_design_bureau:0 "#gold 대한식 함선 설계국#!"
 je_dhe_naval_design_bureau_desc:0 "대한제국 해군 설계국은 외국 도면을 그대로 모방하는 대신, 조선소의 실제 능력과 대한제국의 해역 조건에 맞춘 #gold 광무급 초노급함#!과 #gold 광무식 모듈#!을 따로 개발합니다.\n\n#v 월간 선체 설계점수#!\n기본: #p +2#! - #v 초노급함 기술#!과 #v 5단계 이상 조선소#!\n대형 조선소: #p +2#! - #v 10단계 이상 조선소#!\n강철 공급: #p +1#! - #v 5단계 이상 제철소#!\n해군 행정: #p +1#! - #v 2단계 이상 해군 행정#!\n병기 산업: #p +1#! - #v 3단계 이상 포병 공장#! 및 #v 탄약 공장#!"
 je_dhe_naval_design_bureau_goal:0 "#v 광무급 선체 설계 점수 100#!을 자동으로 축적한 뒤 #v 광무급 설계 완료#! 버튼으로 광무급을 해금하고, 이벤트 선택으로 #v 광무식 모듈 4종#!을 각각 연구한 뒤 #v 4단계 이상 해군 행정#!을 갖추십시오."
 je_dhe_naval_design_bureau_reason:0 "강철 함대는 기술 하나로 완성되지 않습니다. 용골, 장갑, 포탑, 기관, 보급창, 피해통제 체계가 각각 검증되어야 비로소 제국의 주력함이 됩니다."
 dhe_progress_bar_naval_design_bureau:0 "광무급 선체 설계 점수"
 dhe_progress_bar_naval_design_bureau_desc:0 "설계 점수 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_naval_design_bureau_progress_max_tt:0 "광무급 선체 설계 점수 #v 100#! 달성"
 dhe_naval_design_bureau_progress_max_desc_tt:0 "해군 설계국은 매달 조건에 따라 선체 설계 점수를 자동으로 축적합니다. 점수 100에 도달하면 #v 광무급 설계 완료#! 버튼을 눌러 #v 대한식 초노급 설계 I#!과 #v 광무급 초노급함#!을 해금할 수 있습니다."
 dhe_button_gwangmu_hull_design_project:0 "광무급 설계 완료"
 dhe_button_gwangmu_hull_design_project_desc:0 "#v 선체 설계 점수 100#!이 쌓이면 최종 도면을 승인해 #v 대한식 초노급 설계 I#!과 #v 광무급 초노급함#!을 해금합니다. #v 5단계 이상 조선소#!, #v 5단계 이상 제철소#!, #v 2단계 이상 해군 행정#!, #n 국고 2만 5천#! 필요."
 dhe_button_gwangmu_module_design_project:0 "광무식 모듈 실험"
 dhe_button_gwangmu_module_design_project_desc:0 "이벤트를 열어 #v 장갑#!, #v 주포#!, #v 기관#!, #v 보급#! 모듈 중 하나를 선택해 연구합니다. 한 번 연구하면 #v 365일#! 뒤 다시 실행할 수 있습니다. #n 국고 3만#!, #v 포병 공장#! 및 #v 탄약 공장#! 필요."

 dhe_navy_event.1.t:0 "대한제국 연합함대 창설"
 dhe_navy_event.1.d:0 "해군성과 조선소, 항만과 함대가 하나의 체계로 묶였습니다. 이제 대한제국의 깃발은 연안만이 아니라 동아시아의 바다 위에서도 제국의 권위를 드러낼 것입니다."
 dhe_navy_event.1.f:0 "한성의 칙령은 궁궐 담장을 넘어, 부산의 독, 서해의 항로, 동해의 파도 위로 뻗어나간다."
 dhe_navy_event.1.a:0 "바다에도 제국의 길을 열어라."

 dhe_navy_event.2.t:0 "외국 해군고문단"
 dhe_navy_event.2.d:0 "외국 해군 장교들이 함대 운용, 포술, 항해술을 지도하겠다고 제안했습니다. 이들을 적극적으로 받아들이면 빠르게 배울 수 있지만, 비용과 체면 문제도 따릅니다."
 dhe_navy_event.2.f:0 "파도 위의 전쟁은 육지의 교범과 다르다. 바람, 연료, 항로, 포문, 그 모든 것이 계산되어야 한다."
 dhe_navy_event.2.a:0 "고문단을 적극 활용하라."
 dhe_navy_event.2.b:0 "핵심 기술만 조심스럽게 들여와라."

 dhe_navy_event.3.t:0 "조선소의 병목"
 dhe_navy_event.3.d:0 "대형 함선을 건조하려는 계획이 강철, 엔진, 숙련 노동자 부족으로 지연되고 있습니다. 국가가 직접 조선소 확장을 밀어붙이면 문제를 빠르게 해결할 수 있습니다."
 dhe_navy_event.3.f:0 "배는 설계도 위에서 태어나지만, 결국 독의 쇳소리 속에서 완성된다."
 dhe_navy_event.3.a:0 "국고를 풀어 조선소를 확장하라."
 dhe_navy_event.3.b:0 "현재 설비에 맞춰 단계적으로 건조하라."

 dhe_navy_event.4.t:0 "함대 훈련 중 사고"
 dhe_navy_event.4.d:0 "연합함대 기동훈련 중 충돌과 기관 고장이 잇따랐습니다. 사고를 은폐하면 명예는 지킬 수 있지만, 원인을 고치지 못하면 같은 문제가 반복될 것입니다."
 dhe_navy_event.4.f:0 "바다는 변명을 듣지 않는다. 작은 실수도 곧바로 강철과 생명을 삼킨다."
 dhe_navy_event.4.a:0 "비용을 들여 즉시 수리하고 원인을 조사하라."
 dhe_navy_event.4.b:0 "문책은 하되 훈련 일정은 유지하라."

 dhe_navy_event.5.t:0 "해군성 설치"
 dhe_navy_event.5.d:0 "분산된 함대 행정과 항만 관리를 하나로 묶을 해군성을 설치할 수 있습니다. 해군성은 연합함대의 두뇌가 되겠지만, 상공업계는 조선 계약과 항만 투자를 요구하고 있습니다."
 dhe_navy_event.5.f:0 "바다를 지배하려면 먼저 서류와 예산, 항로와 군항을 지배해야 한다."
 dhe_navy_event.5.a:0 "황제 직속 해군성을 세워라."
 dhe_navy_event.5.b:0 "상공업계와 조선 계약을 병행하라."

 dhe_navy_event.6.t:0 "제국 조선소 확장"
 dhe_navy_event.6.d:0 "철갑함을 건조하려면 기존 조선소만으로는 부족합니다. 대형 독과 크레인, 강철 공급망을 확충해야 합니다."
 dhe_navy_event.6.f:0 "나무배의 시대는 저물고, 이제 강철의 용골이 제국의 야망을 떠받친다."
 dhe_navy_event.6.a:0 "대형함 건조 능력을 우선하라."
 dhe_navy_event.6.b:0 "민간 조선 역량까지 함께 키워라."

 dhe_navy_event.7.t:0 "연합함대 기동훈련"
 dhe_navy_event.7.d:0 "동해와 남해를 잇는 대규모 기동훈련이 계획되었습니다. 실전처럼 강하게 밀어붙이면 함대 운용 능력이 빠르게 향상되지만, 비용과 사고 위험도 커집니다."
 dhe_navy_event.7.f:0 "함대는 항구에 정박해 있을 때가 아니라, 파도 위에서 함께 움직일 때 비로소 함대가 된다."
 dhe_navy_event.7.a:0 "실전형 기동훈련을 실시하라."
 dhe_navy_event.7.b:0 "안전한 연안 훈련으로 경험을 쌓아라."

 dhe_navy_event.8.t:0 "대한식 초노급 설계국"
 dhe_navy_event.8.d:0 "영국식 도면과 일본·청국의 함대 운용 사례를 검토한 해군 장교들은 제국의 바다에 맞는 #v 초노급함#! 표준을 제안했습니다. 조선소는 모든 방향을 한꺼번에 추구할 수 없습니다. 이제 광무급을 어떤 함선으로 완성할지 정해야 합니다."
 dhe_navy_event.8.f:0 "쇳덩어리 하나가 함선이 되는 순간은 용골을 놓을 때가 아니라, 그 배가 어떤 바다를 지킬지 정해지는 순간이다."
 dhe_navy_event.8.a:0 "1차 개량: 제물포식 연안 보급 체계를 세워라."
 dhe_navy_event.8.b:0 "2차 개량: 초노급 장갑 배치를 채택하라."
 dhe_navy_event.8.c:0 "3차 개량: 광무급 고속 기동 표준을 완성하라."
 dhe_navy_event.9.t:0 "광무식 모듈 연구"
 dhe_navy_event.9.desc:0 "해군 설계국은 한 번에 모든 함선 모듈을 완성할 수 없습니다. 조선소와 포병 공장, 탄약 공장의 역량을 한 분야에 집중해야 합니다. 어느 모듈을 먼저 연구하겠습니까?"
 dhe_navy_event.9.f:0 "도면 위의 선 하나가 장갑판이 되고, 포탑이 되고, 기관실의 압력이 된다. 문제는 언제나 하나씩 풀어야 한다."
 dhe_navy_event.9.a:0 "귀갑식 장갑대와 손상통제반을 우선하라."
 dhe_navy_event.9.b:0 "광무식 중주포대를 시험하라."
 dhe_navy_event.9.c:0 "한강식 고압 기관을 완성하라."
 dhe_navy_event.9.d:0 "제물포식 보급창을 표준화하라."

