l_korean:
 dhe_decision_start_hermit_kingdom: "조용한 은자의 나라"
 dhe_decision_start_hermit_kingdom_desc: "기나긴 쇄국의 잠에서 깨어나, 도탄에 빠진 조선을 구원할 개혁의 첫걸음을 내딛습니다."
 dhe_decision_start_hermit_kingdom_tooltip: "프롤로그 일지가 시작됩니다."

 dhe_event.2.t:0 "천하통일(天下統一): 대동아의 진정한 주인"
 dhe_event.2.d:0 "북으로는 광활한 만주 벌판의 옛 고토를 수복하여 고구려와 발해의 기상을 되찾았고, 남으로는 현해탄을 건너 일본 열도와 대만까지 우리의 강역으로 복속시켰다.\n\n이것은 단순한 영토 확장이 아니다. 단군 이래 최대의 과업이자, 서구 열강의 침탈로부터 아시아를 지켜낼 새로운 질서가 우리 손에 의해 확립되었음을 알리는 역사적 순간이다.\n\n이제 아시아의 태양은 도쿄가 아닌 서울에서 떠오를 것이며, 황제의 칙령이 동방의 모든 바다와 땅을 다스리게 될 것이다. 우리가 곧 아시아의 질서이자 법이다!"
 dhe_event.2.a:0 "동방의 절대 패자(覇者)여, 영원하라!"

 dhe_event.3.t:0 "광무개혁(光武改革): 구본신참의 기치 아래"
 dhe_event.3.d:0 "제국을 선포했으나 내실이 없다면 그것은 모래 위에 지은 성(砂上樓閣)과 다를 바 없다. 서세동점(西勢東漸)의 거센 파도 속에서 살아남기 위해서는 뼈를 깎는 개혁이 필요하다.\n\n'옛것을 근본으로 삼고 새것을 참고한다'는 구본신참(舊本新參)의 원칙 아래, 우리는 산업, 군사, 교육, 행정, 사회 전반에 걸친 대대적인 개혁을 단행할 것이다.\n\n이제 낡은 인습을 타파하고 부국강병의 기틀을 마련하여, 세계 만국과 당당히 경쟁하는 근대 제국으로 거듭나야 한다."
 dhe_event.3.a:0 "개혁 없이는 미래도 없다! 전진하라!"

 dhe_event.4.t:0 "광무개혁 완수: 근대 제국의 완성"
 dhe_event.4.d:0 "피와 땀으로 얼룩진 고난의 시간이 지났다. 우리의 끊임없는 노력은 결코 헛되지 않았다.\n\n전국 방방곡곡에 철마가 달리고, 최신식 무기로 무장한 황군이 국경을 철통같이 지키며, 신식 학교에서 배운 깨어있는 백성들이 제국의 미래를 밝히고 있다.\n\n우리는 이제 그 누구도 무시할 수 없는 명실상부한 열강의 반열에 올랐다.\n\n오늘 우리는 전 세계에 선언한다. 대한제국은 영원할 것이며, 우리의 번영은 끝이 없을 것이다!"
 dhe_event.4.a:0 "제국의 영광은 영원하리라!"
 
 dhe_event.hangeul_complete.t:0 "한글의 보급"
 dhe_event.hangeul_complete.d:0 "체계적인 교육 덕분에 백성들이 글을 깨우치고 있습니다. 국력이 크게 신장될 것입니다."
 dhe_event.hangeul_complete.a:0 "훌륭하구나."

 dhe_event_1_tt: "대한제국 선포 보상"
 dhe_event_1_desc_tt: "만주족이 #gold 수용 문화(주 문화)#!로 편입되며, 막대한 제국 위신을 얻고 곧이어 #gold 광무개혁#!이 시작됩니다."
 
 dhe_event_2_tt: "대통합 달성 보상"
 dhe_event_2_desc_tt: "만주 및 일본 전역이 #gold 한국인 본토(Homeland)#!로 편입되며, 전체 인구의 #p 20%#!가 충성파로 전환되고 강력한 통합 버프를 얻습니다."
 
 dhe_event_3_tt: "광무개혁 일지 활성화"
 dhe_event_3_desc_tt: "국정 전반에 걸친 #v 광무개혁 미션(일지)#!과 #gold 수신사/보빙사#! 일지가 새롭게 시작됩니다."
 
 dhe_event_4_tt: "광무개혁 최종 보상"
 dhe_event_4_desc_tt: "광무개혁의 모든 미션을 달성한 보상으로 국가 전반에 압도적인 #gold 영구 모디파이어#!가 적용됩니다."
 
 dhe_event_5_tt: "한글 보급 완료 보상"
 dhe_event_5_desc_tt: "문맹 퇴치의 훌륭한 성과로 전체 인구의 #p 10%#!가 새롭게 #p 충성파#!로 전환됩니다."
 
 dhe_gyeongbokgung_tt: "경복궁 중건 잠금 해제"
 dhe_gyeongbokgung_desc_tt: "이제 한성(서울)의 건설 탭에서 직접 #gold 경복궁#!을 건설할 수 있게 됩니다."
 
 dhe_university_1_tt: "제국대학 미션 활성화"
 dhe_university_1_desc_tt: "일지 탭에 #gold 서울대학교(제국대학) 설립#! 미션이 새롭게 추가됩니다."
 
 dhe_university_2_tt: "서울대학교 설립 보상"
 dhe_university_2_desc_tt: "한성(서울) 지역에 강력한 #gold 국립 대학 효율 버프#!가 영구적으로 적용되며, #p 5만 명#!의 충성파를 즉시 얻습니다."

 # 이벤트 텍스트
 dhe_military_event.1.t: "기초 군제 개혁 완료"
 dhe_military_event.1.d: "우리의 군대가 마침내 구식 무기를 버리고 근대적인 전열보병과 대포로 무장했습니다! 군의 뼈대가 세워졌으니, 이제 황제 폐하의 권위를 세우고 열강의 침탈을 막아낼 '진정한 대제국군'으로 거듭날 때입니다."
 dhe_military_event.1.f: "원수부를 창설하여 군 통수권을 확립하라!"
 dhe_military_event.1.a: "강력한 자주국방을 위하여!"
 
 dhe_military_event_1_tt: "심화 군사 개혁 시작"
 dhe_military_event_1_desc_tt: "일지 탭에 #gold [원수부와 제국군 개편]#! 및 #gold [대한제국 연합함대]#! 심화 미션이 새롭게 추가됩니다."

 je_dhe_gwangmu_military_advanced:0 "#gold 원수부와 제국군 개편#!"
 je_dhe_gwangmu_military_advanced_desc:0 "#gold 원수부#!를 중심으로 황제의 통수권을 제도화하고, 참모본부·군사고문단·군수공업을 엮어 대한제국군을 실전형 근대군으로 재편합니다."
 je_dhe_gwangmu_military_advanced_goal:0 "제국군 개편 진척도 #v 100#! 달성, #v 참모본부#!와 #v 후장포#! 기술 확보, 군수공업과 신식 보병 비중 확보"
 je_dhe_gwangmu_military_advanced_reason:0 "이제 단순히 서양식 제복을 입히는 것으로는 충분하지 않습니다. 전쟁을 계획하는 참모, 포탄을 공급하는 공장, 명령을 집행하는 장교단, 황제에게 충성하는 상비군이 하나의 제도로 묶여야 합니다."

 dhe_progress_bar_imperial_army_reform:0 "제국군 개편 진척도"
 dhe_progress_bar_imperial_army_reform_desc:0 "개편 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_imperial_army_progress_max_tt:0 "제국군 개편 진척도 #v 100#! 달성"
 dhe_imperial_army_progress_max_desc_tt:0 "법률·기술·군수공업·신식 보병 비중·군부 신뢰가 충분히 갖춰져야 합니다."

 dhe_imperial_army_base_decay:0 "구식 군제의 관성"
 dhe_imperial_army_professional_army:0 "직업 군인제"
 dhe_imperial_army_mass_conscription:0 "대규모 징병 체계"
 dhe_imperial_army_peasant_levies:0 "농민 징집제의 잔재"
 dhe_imperial_army_general_staff_tech:0 "참모본부 기술"
 dhe_imperial_army_artillery_tech:0 "후장포 기술"
 dhe_imperial_army_machine_guns:0 "기관총 기술"
 dhe_imperial_army_field_force:0 "충분한 야전군 규모"
 dhe_imperial_army_large_force:0 "대규모 제국군"
 dhe_imperial_army_arms_industry:0 "소화기 공업 기반"
 dhe_imperial_army_artillery_foundry:0 "포병 공업 기반"
 dhe_imperial_army_munitions:0 "탄약 공업 기반"
 dhe_imperial_army_modern_infantry:0 "신식 보병 편제"
 dhe_imperial_army_armed_forces_support:0 "군부의 지지"
 dhe_imperial_army_armed_forces_resist:0 "군부의 반발"

 dhe_button_imperial_army_general_staff:0 "원수부 참모국 설치"
 dhe_button_imperial_army_general_staff_desc:0 "황제 직속 원수부 아래 참모국을 설치해 작전계획과 장교 인사를 중앙에서 통제합니다. #n 권위 50#! 소모, 720일 쿨다운."
 dhe_button_imperial_army_training_mission:0 "외국 군사고문단 초빙"
 dhe_button_imperial_army_training_mission_desc:0 "군사고문단을 초빙해 장교 교육과 훈련 교범을 재정비합니다. #n 국고 4만#! 소모, 720일 쿨다운."
 dhe_button_imperial_army_guard_division:0 "시위대와 진위대 재편"
 dhe_button_imperial_army_guard_division_desc:0 "수도 시위대와 지방 진위대를 제국군의 핵심 상비 전력으로 재편합니다. #n 국고 6만#! 소모, 720일 쿨다운."

 dhe_military_event.2.t:0 "제국군 개편 완수"
 dhe_military_event.2.d:0 "원수부의 명령 체계와 참모국의 작전 계획, 그리고 군수공업의 보급망이 하나로 이어졌습니다. 대한제국군은 더 이상 임시로 모은 병정의 무리가 아니라, 황제의 칙령 아래 움직이는 근대적 군사 조직입니다."
 dhe_military_event.2.f:0 "군기는 새로워졌고, 명령은 더 빠르게 전달되며, 장교들은 지도를 펼쳐 전쟁을 계산한다."
 dhe_military_event.2.a:0 "이제 제국은 스스로를 지킬 것이다."

 dhe_military_event.3.t:0 "구식 장교단과 신식 장교단"
 dhe_military_event.3.d:0 "구식 군영 출신 장교들과 신식 학교를 거친 젊은 장교들이 인사권을 두고 충돌하고 있습니다. 어느 쪽도 완전히 배제하면 군 내부의 균열이 깊어질 것입니다."
 dhe_military_event.3.f:0 "군복의 단추는 같아졌지만, 머릿속의 전쟁은 아직 서로 다르다."
 dhe_military_event.3.a:0 "신식 장교단을 중심으로 밀어붙여라."
 dhe_military_event.3.b:0 "구식 장교 일부를 타협적으로 흡수하라."

 dhe_military_event.4.t:0 "군수 조달의 병목"
 dhe_military_event.4.d:0 "소총과 포, 탄약의 규격이 뒤섞이면서 보급 장교들이 골머리를 앓고 있습니다. 통일 규격을 강제하려면 비용이 들지만, 미루면 훈련 성과가 흩어집니다."
 dhe_military_event.4.f:0 "전쟁은 용기로 시작될지 몰라도, 결국 탄약상자 위에서 끝난다."
 dhe_military_event.4.a:0 "국고를 풀어 규격화를 강제하라."
 dhe_military_event.4.b:0 "당장은 있는 물자를 맞춰 써라."

 dhe_military_event.5.t:0 "무관학교의 열기"
 dhe_military_event.5.d:0 "무관학교의 젊은 생도들이 신식 교범과 지형 측량, 포병 계산을 익히며 자신들이 제국군의 미래라고 믿고 있습니다. 이들의 열정은 개혁의 좋은 연료가 될 수 있습니다."
 dhe_military_event.5.f:0 "청년들은 낡은 군영보다 지도를, 관습보다 교범을 더 믿기 시작했다."
 dhe_military_event.5.a:0 "그들에게 제국군의 미래를 맡겨보자."

 dhe_military_event.6.t:0 "군납 비리 의혹"
 dhe_military_event.6.d:0 "새 군복과 탄약 납품 과정에서 비리 의혹이 터졌습니다. 군제개혁의 명분이 흔들리기 전에 엄정하게 처리해야 합니다."
 dhe_military_event.6.f:0 "칼날을 세우는 데 쓴 돈이 누군가의 주머니로 흘러간다면, 그 칼은 전장에 닿기도 전에 무뎌진다."
 dhe_military_event.6.a:0 "책임자를 처벌하고 군 내부를 숙정하라."
 dhe_military_event.6.b:0 "추가 예산으로 사태를 봉합하라."

 dhe_military_event.7.t:0 "원수부 참모국 설치"
 dhe_military_event.7.d:0 "원수부 아래 작전·동원·정보를 담당할 참모국을 둘 수 있습니다. 황제의 통수권을 강하게 세울 수도 있고, 장교 교육을 중심으로 비교적 완만하게 제도화할 수도 있습니다."
 dhe_military_event.7.f:0 "전쟁은 전장에서만 결정되지 않는다. 지도 위에 놓인 작은 말 하나가 군단의 운명을 바꾼다."
 dhe_military_event.7.a:0 "황제 직할 작전참모 체계를 세워라."
 dhe_military_event.7.b:0 "장교 교육과 참모 순환을 우선하라."

 dhe_military_event.8.t:0 "외국 군사고문단"
 dhe_military_event.8.d:0 "서구식 장교 교육과 전술 교범을 들여올 기회가 생겼습니다. 독일식 참모제와 프랑스식 포병 교육, 일본식 훈련 체계가 모두 참고 대상입니다."
 dhe_military_event.8.f:0 "남의 칼을 그대로 들 수는 없다. 그러나 그 칼을 벼린 방법은 배울 수 있다."
 dhe_military_event.8.a:0 "참모제와 동원계획을 중점적으로 배워라."
 dhe_military_event.8.b:0 "훈련 교범과 포병 교육을 우선하라."

 dhe_military_event.9.t:0 "시위대와 진위대 재편"
 dhe_military_event.9.d:0 "수도를 호위하는 시위대와 지방을 지키는 진위대를 새 편제로 묶을 수 있습니다. 수도 방위에 집중하면 황권은 강화되지만, 지방 병력을 균형 있게 키우면 장기적 동원 기반이 넓어집니다."
 dhe_military_event.9.f:0 "한성의 궁궐문과 지방의 병영은 서로 다른 곳에 서 있지만, 같은 제국을 지켜야 한다."
 dhe_military_event.9.a:0 "수도 시위대를 정예화하라."
 dhe_military_event.9.b:0 "지방 진위대까지 함께 재편하라."

 je_dhe_imperial_combined_fleet:0 "#gold 대한제국 연합함대#!"
 je_dhe_imperial_combined_fleet_desc:0 "#gold 부산#!과 서해의 항구를 중심으로 조선소, 해군 행정, 철갑함 전력을 하나로 묶어 대한제국의 독자적 연합함대를 창설합니다."
 je_dhe_imperial_combined_fleet_goal:0 "연합함대 진척도 #v 100#! 달성, #v 전문 해군#! 법률, #v 철갑함#! 및 #v 갠트리 크레인#! 기술, 조선소·해군 행정·항만 기반 확보, 그리고 #gold 대한식 함선 설계#! 확립"
 je_dhe_imperial_combined_fleet_reason:0 "육군이 국경을 지킨다면, 해군은 제국의 숨통을 지킵니다. 일본과 청, 러시아가 바다에서 힘을 겨루는 시대에 대한제국도 더 이상 연안 방어에 머물 수 없습니다."

