 dhe_button_mission_send_susinsa_japan:0 "일본 수신사 파견"
 dhe_button_mission_send_susinsa_japan_desc:0 "일본에 수신사를 보내 관제, 군제, 학교와 공장 제도를 살피게 합니다.\n필요 조건: 금 보유고 #v 10,000#! 이상\n효과: 사절단 보고 #p +25#!, 일본 시찰 이벤트 발생"
 dhe_button_mission_send_qing_observers:0 "청국 외교 시찰"
 dhe_button_mission_send_qing_observers_desc:0 "청국에 사절을 보내 외교 관문, 변경 행정, 열강과의 교섭 방식을 조사하게 합니다.\n필요 조건: 금 보유고 #v 10,000#! 이상\n효과: 사절단 보고 #p +20#!, 청국 시찰 이벤트 발생"
 dhe_button_mission_send_bobingsa_west:0 "서구 보빙사 파견"
 dhe_button_mission_send_bobingsa_west_desc:0 "미국과 유럽으로 보빙사를 보내 산업, 교육, 의회, 외교 관행을 직접 보고하게 합니다.\n필요 조건: 금 보유고 #v 20,000#! 이상\n효과: 사절단 보고 #p +30#!, 서구 시찰 이벤트 발생"
 dhe_mission_event.1.t:0 "사절 대표의 선발"
 dhe_mission_event.1.desc:0 "광무개혁이 시작되자 조정은 외국의 제도를 직접 살필 사절단을 조직했습니다. 이번 사행은 단순한 친선 방문이 아닙니다. 대표로 뽑힌 인물은 일본의 관제, 청국의 외교 관문, 서구 열강의 산업과 의회를 차례로 살피고 돌아와 제국의 개혁안을 보고해야 합니다."
 dhe_mission_event.1.f:0 "\"눈으로 보지 않은 제도는 글 속의 그림일 뿐이다.\""
 dhe_mission_event.1.a:0 "[SCOPE.sCharacter('dhe_mission_leader_1').GetFullName](을)를 사절 대표로 삼아라."
 dhe_mission_event.1.b:0 "[SCOPE.sCharacter('dhe_mission_leader_2').GetFullName](을)를 사절 대표로 삼아라."
 dhe_mission_event.1.c:0 "[SCOPE.sCharacter('dhe_mission_leader_3').GetFullName](을)를 사절 대표로 삼아라."
 dhe_mission_event.1.d:0 "적임자가 없다. 임시 실무 사절단으로 출발시켜라."
 dhe_mission_event.2.t:0 "동경의 관제와 병영"
 dhe_mission_event.2.d:0 "일본에 도착한 사절단은 관청, 학교, 병영, 조선소를 둘러보기 시작했습니다. 빠른 답사를 끝내고 다음 목적지로 향할 수도 있지만, 더 오래 머무르면 제도 운용의 세부까지 보고서에 담을 수 있습니다."
 dhe_mission_event.2.f:0 "\"그들이 배운 것은 서양의 옷차림이 아니라, 명령이 문서로 흐르고 문서가 예산으로 이어지는 방식이었다.\""
 dhe_mission_event.2.a:0 "관제 개편을 중점적으로 배워라."
 dhe_mission_event.2.b:0 "군제와 병영 체계를 우선하라."
 dhe_mission_event.3.t:0 "청국의 외교 관문"
 dhe_mission_event.3.d:0 "청국에 파견된 사절은 열강과의 교섭, 조계와 세관 문제, 변경 지역의 행정 방식이 얼마나 복잡하게 얽혀 있는지 보고했습니다. 낡은 조공 질서와 근대 외교가 한 궁궐 안에서 충돌하고 있었습니다."
 dhe_mission_event.3.f:0 "\"대국의 체면은 문서 위에서는 크나, 항구에서는 관세표 한 장보다 가벼울 때가 있었다.\""
 dhe_mission_event.3.a:0 "외교 의전과 교섭술을 정리하라."
 dhe_mission_event.3.b:0 "변경 행정과 정보망을 중시하라."
 dhe_mission_event.4.t:0 "서구 보빙사의 보고"
 dhe_mission_event.4.d:0 "서구로 떠난 보빙사는 공장과 철도, 의회와 대학을 둘러본 뒤 수많은 보고서를 보내왔습니다. 그들의 기록은 제국의 산업과 헌정 논의에 새로운 언어를 제공했습니다."
 dhe_mission_event.4.f:0 "\"그들의 강함은 높은 굴뚝에만 있지 않았다. 회의록, 회계장부, 학교의 시간표가 모두 제국의 엔진처럼 맞물려 있었다.\""
 dhe_mission_event.4.a:0 "산업과 기술을 우선하라."
 dhe_mission_event.4.b:0 "헌정과 교육 제도를 중시하라."
 dhe_mission_event.7.t:0 "포츠머스의 해군 자문"
 dhe_mission_event.7.d:0 "영국에 머무는 보빙사는 항만과 조선소, 해군성 문서를 살핀 뒤 한 가지 결론에 도달했습니다. 연합함대는 군함 몇 척을 모으는 사업이 아니라, 해군 행정과 조선 계약, 장교 교육과 항만 운용이 함께 맞물리는 제도입니다. 영국 측은 제한적이나마 자문단과 도면, 훈련 관찰 기회를 제공할 수 있다고 밝혔습니다."
 dhe_mission_event.7.f:0 "\"함대는 바다 위에서 보이지만, 그 뿌리는 해군성의 장부와 조선소의 쇳가루 속에 박혀 있었다.\""
 dhe_mission_event.7.a:0 "영국 해군 자문단을 초빙하라."
 dhe_mission_event.7.b:0 "조선소 도면과 항만 장비 계약을 우선하라."
 dhe_mission_event.7.c:0 "기동훈련 관찰단만 받아들여라."
 dhe_mission_event.6.t:0 "사절단의 귀국"
 dhe_mission_event.6.d:0 "긴 항해 끝에 사절단이 제물포로 돌아왔습니다. 일본의 관제, 청국의 외교 관문, 서구의 산업과 의회에 대한 기록은 아직 거칠지만, 조정은 이제 이 보고서를 광무개혁의 실제 도면으로 바꿔야 합니다."
 dhe_mission_event.6.f:0 "\"밖에서 본 것은 남의 제도였으나, 돌아와 세워야 할 것은 우리의 나라다.\""
 dhe_mission_event.6.a:0 "보고서를 중추와 각 아문에 배포하라."
 dhe_mission_event.5.t:0 "사절단 종합 보고"
 dhe_mission_event.5.d:0 "수신사와 보빙사의 보고서가 조정에 모였습니다. 이제 대한제국은 외국에서 본 제도를 그대로 모방하는 대신, 황권과 개혁, 산업과 외교를 함께 묶는 광무식 개혁 노선을 선택해야 합니다."
 dhe_mission_event.5.f:0 "\"밖에서 본 것은 남의 나라였으나, 돌아와 써야 할 것은 우리의 법이다.\""
 dhe_mission_event.5.a:0 "산업 진흥안을 채택하라."
 dhe_mission_event.5.b:0 "국정 운영안을 채택하라."
 dhe_mission_event.5.c:0 "외교 확장안을 채택하라."
