 je_dhe_susinsa_bobingsa_mission:0 "#gold 수신사와 보빙사#!"
 je_dhe_susinsa_bobingsa_mission_desc:0 "광무개혁은 궁궐 안의 조칙만으로 완성되지 않습니다. 일본의 관제 개혁, 청국의 외교와 변경 행정, 서구 열강의 산업과 의회를 직접 관찰한 사절단의 보고서가 새 제국의 설계도가 될 것입니다."
 je_dhe_susinsa_bobingsa_mission_goal:0 "#v 일본 수신사#!, #v 청국 시찰#!, #v 서구 보빙사#! 보고서를 모두 확보하고 사절단 진척도를 #v 100#!까지 올리십시오."
 je_dhe_susinsa_bobingsa_mission_reason:0 "닫힌 조정은 세계를 이해할 수 없습니다. 사절단은 외국의 제도를 모방하기 위해서가 아니라, 대한제국에 맞게 고쳐 쓸 지식을 얻기 위해 떠납니다."
