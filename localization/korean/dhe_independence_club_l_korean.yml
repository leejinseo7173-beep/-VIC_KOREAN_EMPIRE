 je_dhe_constitutional_reform:0 "#v 만민공동회#!와 #gold 헌정 개혁#!"
 je_dhe_constitutional_reform_desc:0 "#v 만민공동회#!의 요구를 완전히 외면할 수 없게 된 조정은 중추원 개편과 황제권의 경계를 두고 논의를 시작했습니다. 대한제국은 황권의 질서 안에서 헌정을 받아들일지, 제한된 입헌군주제의 길을 열지 결정해야 합니다."
 je_dhe_constitutional_reform_goal:0 "헌정 정착도를 #v 100#!까지 높이거나, #gold 황제 자문 중추원#! 또는 #p 제한 의회 실험#! 중 하나를 선택하십시오."
 je_dhe_constitutional_reform_reason:0 "사회 개혁이 백성의 목소리를 제도 밖으로 불러냈다면, #gold 헌정 개혁#!은 그 목소리를 제국의 정치 안에 어떻게 담을지 정하는 일입니다."

 dhe_progress_bar_constitutional_settlement:0 "헌정 정착도"
 dhe_progress_bar_constitutional_settlement_desc:0 "헌정 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
