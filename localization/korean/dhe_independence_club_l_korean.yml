 dhe_button_jungchuwon_convene_session:0 "정례 회의 소집"
 dhe_button_jungchuwon_convene_session_desc:0 "#gold 중추원 정례 회의#!를 열어 국정 현안을 공개적으로 논의합니다.\n필요 조건: 정부 정통성 #v 40#! 이상, 그리고 행정력 #v 100#! 이상 또는 지식인 영향력 #v 10%#! 이상 또는 지주가 정부에 참여 중\n추가 조건: 국정 신뢰 #v 85#! 미만, 진행 중인 중추원 5년 의제가 없어야 함\n효과: 정례 회의 이벤트가 발생합니다. 선택한 의제에 따라 #p 경제성장#!, #n 궁정 행정#!, #v 지방 조정#! 중 하나의 5년 국정 의제가 열릴 수 있습니다.\n비용: 권위 #n 50#!\n현재 소집 횟수: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_session_counter').GetValue|v0]회#!"
 dhe_button_jungchuwon_imperial_budget:0 "예산안 회기 소집"
 dhe_button_jungchuwon_imperial_budget_desc:0 "#gold 중추원 예산안 회기#!를 열어 향후 몇 년의 국정 예산 방향을 정합니다.\n필요 조건: 정부 정통성 #v 40#! 이상, 그리고 행정력 #v 100#! 이상 또는 주요 정치세력의 정부 참여, 국정 신뢰 #v 20#! 이상\n효과: 예산 토론 이벤트가 발생하고 선택에 따라 #n 황실#!, #p 개화파#!, #v 지방 대표#!의 의석 구도가 바뀝니다.\n비용: 권위 #n 75#!\n현재 소집 횟수: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_budget_counter').GetValue|v0]회#!"
 dhe_button_jungchuwon_emergency_session:0 "#n 비상 중추원#!"
 dhe_button_jungchuwon_emergency_session_desc:0 "#n 전쟁, 재정난, 낮은 정통성, 행정력 부족, 국내 혼란, 낮은 국정 신뢰#! 중 하나가 발생했을 때 비상 회의를 소집합니다.\n효과: 비상 대응 이벤트가 발생합니다.\n비용: 권위 #n 50#!\n현재 소집 횟수: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_emergency_counter').GetValue|v0]회#!"
 dhe_button_jungchuwon_public_petitions:0 "공개 청원 접수"
 dhe_button_jungchuwon_public_petitions_desc:0 "#p 독립협회#!와 지방 유생, 상공업자의 청원을 중추원 안건으로 접수합니다.\n필요 조건: 지식인 영향력 #v 10%#! 이상 또는 독립협회 운동 지지 #v 5%#! 이상, 언론 보호 또는 검열 없음, 국정 신뢰 #v 30#! 이상, 황실 의석 #v 240#!석 미만\n효과: 공개 청원 이벤트가 발생합니다.\n비용: 권위 #n 50#!\n현재 접수 횟수: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_petition_counter').GetValue|v0]회#!"
 dhe_button_jungchuwon_provincial_delegates:0 "지방 대표 확대"
 dhe_button_jungchuwon_provincial_delegates_desc:0 "#v 각 도의 유력자와 관료#!를 중추원 자문 대표로 확대합니다.\n필요 조건: 행정력 #v 150#! 이상, 금 보유고 #v 15,000#! 이상, 임명직 관료제 또는 선출직 관료제, 국정 신뢰 #v 35#! 이상, 지방 대표 의석 #v 225#!석 미만\n효과: 지방 대표 확대 이벤트가 발생합니다.\n현재 확대 횟수: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_delegate_counter').GetValue|v0]회#!"
 dhe_button_jungchuwon_pass_reform_bill:0 "개혁안 통과"
 dhe_button_jungchuwon_pass_reform_bill_desc:0 "중추원 다수의 지지와 #p 국정 신뢰#!를 바탕으로 #p 행정 개혁안#!을 통과시킵니다.\n필요 조건: 행정력 #v 150#! 이상, 정부 정통성 #v 50#! 이상, 개화파 의석 #v 150#!석 이상, 지방 대표 의석 #v 105#!석 이상, 국정 신뢰 #v 50#! 이상, 황실 의석 #v 225#!석 미만\n효과: 개혁안 통과 이벤트가 발생합니다.\n현재 통과 횟수: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_reform_bill_counter').GetValue|v0]회#!"

 dhe_jungchuwon.1.t:0 "중추원의 문이 열리다"
 dhe_jungchuwon.1.d:0 "헌정 개혁의 여파 속에서 중추원은 더 이상 의례적인 자문 기구로 남을 수 없게 되었습니다. 황실은 권위를 지키려 하고, 개화파는 제도 개혁을 요구하며, 지방 대표들은 자신들의 목소리를 중앙 정치에 들이밀기 시작했습니다."
 dhe_jungchuwon.1.f:0 "\"말이 제도 안으로 들어오면, 그 말은 곧 권력이 된다.\""
 dhe_jungchuwon.1.a:0 "중추원을 열어라."
 dhe_jungchuwon.2.t:0 "중추원 개혁안 통과"
 dhe_jungchuwon.2.d:0 "오랜 논쟁 끝에 중추원은 행정 절차와 자문 권한을 정비하는 개혁안을 통과시킬 준비를 마쳤습니다. 이제 문제는 중추원이 누구의 권위를 더 강하게 제도화하느냐입니다."
 dhe_jungchuwon.2.f:0 "\"법안은 종이 위의 글이지만, 그 글이 향하는 곳은 곧 권력의 자리다.\""
 dhe_jungchuwon.2.a:0 "행정 절차를 정비한다."
 dhe_jungchuwon.2.b:0 "황실 재가권을 명문화한다."
 dhe_jungchuwon.2.c:0 "회의록 공개와 공론 절차를 보장한다."
 dhe_jungchuwon.3.t:0 "#n 예산안 교착#!"
 dhe_jungchuwon.3.d:0 "#n 황실파#!와 #p 개화파#!의 세력이 동시에 커지자, 중추원은 예산안 처리를 두고 #n 교착 상태#!에 빠졌습니다. 회의장은 웅성거렸고, 백성들은 새 제도가 실제로 작동하는지 의심하기 시작했습니다."
 dhe_jungchuwon.3.a:0 "의견을 다시 모아야 한다."
 dhe_jungchuwon.4.t:0 "#gold 중추원 예산 토론#!"
 dhe_jungchuwon.4.d:0 "#gold 예산안 회기#!가 열리자 대신과 대표들은 #gold 제국의 다음 몇 년#!을 어디에 집중해야 하는지 격렬하게 다투기 시작했습니다. 어떤 예산을 통과시키느냐에 따라 국정 운영의 색깔도 달라질 것입니다."
 dhe_jungchuwon.4.f:0 "\"돈이 향하는 곳에 조정의 뜻이 있고, 조정의 뜻이 향하는 곳에 나라의 앞날이 있다.\""
 dhe_jungchuwon.4.a:0 "황실 직할 예산을 강화한다."
 dhe_jungchuwon.4.b:0 "산업 진흥 예산을 편성한다."
 dhe_jungchuwon.4.c:0 "농상공 균형 예산을 편성한다."
 dhe_jungchuwon.4.e:0 "철도와 전신 예산을 우선한다."
 dhe_jungchuwon.4.h:0 "학무와 민생 예산을 늘린다."
 dhe_jungchuwon.4.g:0 "군제 정비 예산을 승인한다."
 dhe_jungchuwon.5.t:0 "#gold 중추원 정례 회의#!"
 dhe_jungchuwon.5.d:0 "중추원의 회의장이 다시 열렸습니다. 대신과 대표들은 이번 회의에서 무엇을 우선 논의해야 하는지를 두고 서로 다른 의제를 내밀었습니다."
 dhe_jungchuwon.5.f:0 "\"문을 여는 것보다 어려운 일은, 열린 문 안에서 질서를 세우는 일이다.\""
 dhe_jungchuwon.5.a:0 "개혁 안건을 우선 상정한다."
 dhe_jungchuwon.5.b:0 "황실 자문 안건을 먼저 다룬다."
 dhe_jungchuwon.5.c:0 "각 파벌의 절충안을 만든다."
 dhe_jungchuwon.6.t:0 "#p 공개 청원의 물결#!"
 dhe_jungchuwon.6.d:0 "#p 독립협회#!, 지방 유생, 상공업자, 신식 학교 출신 청년들의 청원이 중추원으로 밀려들었습니다. 이 청원을 어떻게 다루느냐에 따라 중추원의 성격도 달라질 것입니다."
 dhe_jungchuwon.6.f:0 "\"백성의 말은 바람처럼 가볍지만, 모이면 문을 흔든다.\""
 dhe_jungchuwon.6.a:0 "공개 청문회를 연다."
 dhe_jungchuwon.6.b:0 "청원을 선별해 접수한다."
 dhe_jungchuwon.6.c:0 "청원 백서를 발간한다."
 dhe_jungchuwon.7.t:0 "#v 지방 대표 확대#!"
 dhe_jungchuwon.7.d:0 "각 도의 대표를 중추원에 들이는 문제는 단순한 인원 조정이 아닙니다. 누구를 대표로 삼느냐가 중앙과 지방의 관계를 다시 정의할 것입니다."
 dhe_jungchuwon.7.f:0 "\"한성의 말만으로 나라를 다스릴 수는 없다. 그러나 지방의 목소리를 들이는 순간, 조정도 바뀌어야 한다.\""
 dhe_jungchuwon.7.a:0 "관찰사와 지방 관료를 중심으로 임명한다."
 dhe_jungchuwon.7.b:0 "상공업자와 신흥 유력자를 받아들인다."
 dhe_jungchuwon.7.c:0 "더 넓은 지방 대표를 허용한다."
 dhe_jungchuwon.8.t:0 "#gold 중추원 선거운동#!"
 dhe_jungchuwon.8.d:0 "선거운동이 시작되자 중추원 밖의 정치적 열기가 의석 배분 문제로 번지기 시작했습니다. #n 황실#!, #p 개화파#!, #v 지방 대표#!는 저마다 선거를 자신들의 명분으로 끌어들이려 합니다.\n\n#bold 이번 선택은 즉시 중추원 내 선거운동의 분위기에 영향을 줍니다. 최종 의석 반영은 선거 뒤의 정치 균형을 따릅니다.#!"
 dhe_jungchuwon.8.f:0 "\"선거는 표를 세는 절차이지만, 그 표가 어디에 앉을지는 또 다른 정치다.\""
 dhe_jungchuwon.8.a:0 "#p 개화파#!의 유세 공간을 보장한다."
 dhe_jungchuwon.8.b:0 "#n 궁정 후보#!와 친황실 인사를 지원한다."
 dhe_jungchuwon.8.c:0 "#v 지방 선거인단#!의 목소리를 키운다."
 dhe_jungchuwon.9.t:0 "#gold 선거 결과의 중추원 반영#!"
 dhe_jungchuwon.9.d:0 "선거가 끝나자 새로 드러난 정치적 균형을 중추원 의석에 어떻게 반영할지를 두고 논쟁이 벌어졌습니다. 중추원은 선거 뒤 각 이해집단의 #v 정치력#!과 지도자의 #v 이념#!을 의석 배분의 근거로 삼으려 합니다.\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('DHE_JUNGCHUWON_ELECTION_RESULT_TEXT')]"
 dhe_jungchuwon.9.f:0 "\"민심은 거리에서 외쳐지고, 조정에서는 의석으로 번역된다.\""
 dhe_jungchuwon.9.a:0 "#p 개화파#!가 선거의 수혜를 얻었다."
 dhe_jungchuwon.9.b:0 "#n 보수 세력#!이 중추원 의석을 지켰다."
 dhe_jungchuwon.9.c:0 "#v 지방 대표#!의 조정 요구를 인정한다."
 dhe_jungchuwon.10.t:0 "#n 옥좌 앞의 침묵#!"
 dhe_jungchuwon.10.d:0 "#n 황실파#!가 중추원의 의석 대부분을 장악하자 회의장의 분위기는 눈에 띄게 달라졌습니다. 대신들은 황제의 뜻을 먼저 헤아리고, #p 개화파 대표#!들은 발언 순서를 얻기 위해 오래 기다려야 했습니다."
 dhe_jungchuwon.10.f:0 "\"폐하의 뜻이 곧 회의의 방향이라면, 반대 토론은 어디에 앉아야 한단 말인가?\""
 dhe_jungchuwon.10.a:0 "황실의 질서를 확립한다."
 dhe_jungchuwon.10.b:0 "제한적 반론은 허용한다."
 dhe_jungchuwon.11.t:0 "#p 개혁 의제의 물결#!"
 dhe_jungchuwon.11.d:0 "#p 개화파#!가 중추원의 강력한 세력으로 떠오르자 회의장 밖의 신문과 학회가 일제히 #p 개혁 의제#!를 받아 적기 시작했습니다. 이제 중추원은 단순히 칙령을 해석하는 곳이 아니라, 새 제도를 설계하는 곳으로 보이기 시작했습니다."
 dhe_jungchuwon.11.f:0 "\"회의록이 인쇄되어 거리에 붙는 순간, 정치는 더 이상 궁궐 담장 안에만 머물지 않는다.\""
 dhe_jungchuwon.11.a:0 "공개 개혁 의제를 채택한다."
 dhe_jungchuwon.11.b:0 "의제 상정을 늦춘다."
 dhe_jungchuwon.12.t:0 "#v 각 도 대표의 합의안#!"
 dhe_jungchuwon.12.d:0 "#v 지방 대표#!들이 의석의 큰 축을 차지하자, 각 도의 관찰사와 유력자들은 세금, 도로, 학교, 시장 문제를 하나의 합의안으로 묶어 올렸습니다. 중앙은 더 이상 한성의 시선만으로 나라를 볼 수 없게 되었습니다."
 dhe_jungchuwon.12.f:0 "\"나라의 길은 경운궁에서만 뻗지 않는다. 강과 고개와 장터를 지나 백성의 집 앞까지 닿아야 한다.\""
 dhe_jungchuwon.12.a:0 "지방 합의안을 받아들인다."
 dhe_jungchuwon.12.b:0 "중앙의 임명권을 앞세운다."
 dhe_jungchuwon.13.t:0 "#n 무너지는 회의장의 신뢰#!"
 dhe_jungchuwon.13.d:0 "중추원에 대한 #n 신뢰#!가 바닥을 치자, 회의장 밖에서는 새 제도가 결국 대신들의 말잔치에 불과하다는 비난이 터져 나왔습니다. 일부 대표들은 회의 참석을 거부했고, #n 예산안#!은 다시 멈춰 섰습니다."
 dhe_jungchuwon.13.f:0 "\"백성의 말을 듣겠다더니, 들은 말은 어디로 갔는가?\""
 dhe_jungchuwon.13.a:0 "소요를 무시하고 질서를 명한다."
 dhe_jungchuwon.13.b:0 "긴급 공개 회의를 연다."
 dhe_jungchuwon.14.t:0 "#gold 제국의 회의장#!"
 dhe_jungchuwon.14.d:0 "중추원이 안정적으로 회의를 이어가자 한성의 관료와 상인, 지방 대표들은 이 제도를 #p 실제 국정 운영의 통로#!로 인정하기 시작했습니다. #gold 황제의 권위#!와 #p 공론의 절차#!가 잠시나마 같은 회의장 안에 서게 되었습니다."
 dhe_jungchuwon.14.f:0 "\"칙서가 내려오고, 의안이 낭독되고, 대표들이 답한다. 이것이 새 제국의 소리다.\""
 dhe_jungchuwon.14.a:0 "중추원을 제국 국정의 얼굴로 삼는다."
 dhe_jungchuwon.15.t:0 "회의록을 둘러싼 소동"
 dhe_jungchuwon.15.d:0 "중추원의 회의가 길어지자 회의록을 어떻게 정리하고 공개할지를 두고 작은 소동이 벌어졌습니다. 황실은 품격과 절차를, 개화파는 투명성을, 지방 대표들은 자신들의 발언이 빠지지 않기를 요구하고 있습니다."
 dhe_jungchuwon.15.f:0 "\"회의장에서 말이 끝났다고 정치가 끝나는 것은 아니다. 기록되는 순간, 말은 제도가 된다.\""
 dhe_jungchuwon.15.a:0 "회의록을 정리해 공개한다."
 dhe_jungchuwon.15.b:0 "의례와 체면을 우선한다."
 dhe_jungchuwon.15.c:0 "지방 대표의 발언을 보강한다."
 dhe_jungchuwon.16.t:0 "#p 성장 의제의 결실#!"
 dhe_jungchuwon.16.d:0 "중추원이 채택한 #p 경제성장 의제#!는 회의장 안의 구호로 끝나지 않았습니다. 공장과 항구, 철도와 장부의 숫자가 움직였고, 대한제국의 경제는 약속한 목표를 넘어섰습니다. 이제 개화파는 중추원이 실제 정책 기관으로 기능할 수 있음을 주장하고 있습니다."
 dhe_jungchuwon.16.f:0 "\"말이 공장 굴뚝의 연기로 바뀌었으니, 회의장은 더 이상 빈방이 아니다.\""
 dhe_jungchuwon.16.a:0 "중추원의 경제 의제를 공식 성과로 선포한다."
 dhe_jungchuwon.17.t:0 "#n 성장 의제의 좌초#!"
 dhe_jungchuwon.17.d:0 "5년 전 중추원은 경제성장을 약속했지만, 장부의 숫자는 그만큼 따라오지 못했습니다. 황실파는 개화파가 허황된 목표로 국정을 흔들었다고 비판하고, 지방 대표들은 중앙의 계획이 현장을 제대로 보지 못했다고 불평합니다."
 dhe_jungchuwon.17.f:0 "\"정책은 박수로 완성되지 않는다. 세월이 지나면 장부가 대답한다.\""
 dhe_jungchuwon.17.a:0 "실패를 인정하고 의제를 재검토한다."
 dhe_jungchuwon.18.t:0 "#n 궁정 행정 의제의 완성#!"
 dhe_jungchuwon.18.d:0 "#n 황실파#!가 약속한 행정 정비는 실제 성과를 냈습니다. 칙령은 더 빠르게 각 부로 내려갔고, 관료제는 황실의 의지를 행정 명령으로 옮기는 데 익숙해졌습니다. 중추원은 황제의 권위와 관료제의 효율을 함께 보여주는 무대가 되었습니다."
 dhe_jungchuwon.18.f:0 "\"옥좌에서 내려온 한 줄의 말이 팔도 관아의 장부에 적혔다.\""
 dhe_jungchuwon.18.a:0 "황실 중심 행정의 성과를 선포한다."
 dhe_jungchuwon.19.t:0 "#n 궁정 행정 의제의 실패#!"
 dhe_jungchuwon.19.d:0 "황실은 중추원을 통해 행정 장악을 약속했지만, 관료제는 여전히 느리고 권위는 문서 밖으로 잘 나아가지 못했습니다. 개화파는 황실파가 말뿐인 질서만 외쳤다고 비판하고 있습니다."
 dhe_jungchuwon.19.f:0 "\"칙령이 많아도 움직이는 관아가 없으면 종이는 종이일 뿐이다.\""
 dhe_jungchuwon.19.a:0 "궁정 의제의 실패를 인정한다."
 dhe_jungchuwon.20.t:0 "#v 지방 조정 의제의 결실#!"
 dhe_jungchuwon.20.d:0 "#v 지방 대표#!들이 요구한 행정 조정은 도로와 철도, 관청의 확장으로 이어졌습니다. 이제 중추원은 한성의 회의장만이 아니라 각 도의 장부와 시장까지 이어지는 제도라고 주장할 수 있게 되었습니다."
 dhe_jungchuwon.20.f:0 "\"길이 놓이고 장부가 맞춰지자, 지방의 말도 중앙의 언어가 되었다.\""
 dhe_jungchuwon.20.a:0 "지방 조정의 성과를 인정한다."
 dhe_jungchuwon.21.t:0 "#n 지방 조정 의제의 난맥#!"
 dhe_jungchuwon.21.d:0 "중추원은 지방과 중앙을 잇겠다고 약속했지만, 철도와 관청, 세무망은 충분히 정비되지 못했습니다. 지방 대표들은 중앙이 다시 말만 앞세웠다고 불만을 토로하고 있습니다."
 dhe_jungchuwon.21.f:0 "\"한성에서 정한 길이 고개를 넘지 못하면, 지방은 여전히 멀다.\""
 dhe_jungchuwon.21.a:0 "지방 조정안을 다시 손본다."
 dhe_jungchuwon.22.t:0 "#n 비상 중추원#!"
 dhe_jungchuwon.22.d:0 "제국의 국정이 흔들리자 중추원은 정례 회의가 아니라 #n 비상 회의#!로 소집되었습니다. 대신들은 빠른 명령을 요구하고, 개화파와 지방 대표들은 위기를 핑계로 모든 절차가 궁정으로 빨려 들어가서는 안 된다고 맞섭니다."
 dhe_jungchuwon.22.f:0 "\"평온할 때 만든 제도는 위기 속에서 그 진짜 얼굴을 드러낸다.\""
 dhe_jungchuwon.22.a:0 "#n 비상 예산#!을 황실 직할로 승인한다."
 dhe_jungchuwon.22.b:0 "#p 민심 수습 조치#!를 우선한다."
 dhe_jungchuwon.22.c:0 "#gold 초당적 협의체#!를 꾸린다."
 dhe_jungchuwon.23.t:0 "#n 황실 재가 지연#!"
 dhe_jungchuwon.23.d:0 "[SCOPE.sLaw('current_law_scope').GetName] 법안을 둘러싼 중추원 심의가 황실 재가 문제에 걸렸습니다. 보수 대신들은 황제의 뜻을 더 기다려야 한다고 주장하고, 개화파는 공개 결의로 절차를 밀어붙이자고 요구합니다."
 dhe_jungchuwon.23.f:0 "\"법안은 회의장을 통과했으나, 아직 옥좌 앞에서 멈춰 서 있다.\""
 dhe_jungchuwon.23.a:0 "황실 재가를 기다린다."
 dhe_jungchuwon.23.b:0 "중추원 공개 결의로 압박한다."
 dhe_jungchuwon.24.t:0 "#v 지방 대표 보이콧#!"
 dhe_jungchuwon.24.d:0 "[SCOPE.sLaw('current_law_scope').GetName] 법안이 지방의 이해를 제대로 반영하지 않는다는 불만이 커졌습니다. 몇몇 지방 대표들은 심의 출석을 거부하며, 법안에 지역 조항을 넣으라고 요구합니다."
 dhe_jungchuwon.24.f:0 "\"한성의 법이 팔도의 장부에 닿으려면, 팔도의 말도 법문 속에 들어가야 한다.\""
 dhe_jungchuwon.24.a:0 "지방 조항을 넣어 타협한다."
 dhe_jungchuwon.24.b:0 "출석 거부를 무시하고 표결한다."
 dhe_jungchuwon.25.t:0 "#p 상소문 유출#!"
 dhe_jungchuwon.25.d:0 "[SCOPE.sLaw('current_law_scope').GetName] 법안에 대한 중추원 내부 상소문과 회의록 일부가 한성의 신문가에 흘러나왔습니다. 공론장은 달아오르고, 황실은 절차의 권위가 무너질까 우려하고 있습니다."
 dhe_jungchuwon.25.f:0 "\"닫힌 문 뒤의 말이 거리로 나오면, 그 말은 더 이상 문서가 아니라 여론이다.\""
 dhe_jungchuwon.25.a:0 "회의록 공개로 정면 돌파한다."
 dhe_jungchuwon.25.b:0 "상소문 유출을 단속한다."

