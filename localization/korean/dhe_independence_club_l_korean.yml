 dhe_mod_jungchuwon_royalist_dominance:0 "황실파의 중추원 장악"
 dhe_mod_jungchuwon_royalist_dominance_desc:0 "황실파가 중추원 의석 대부분을 장악했습니다. 황제의 명령은 안정적으로 관철되지만, 개화파 지식인의 정치 공간은 좁아지고 입법 절차는 느려집니다."
 dhe_mod_jungchuwon_reformist_dominance:0 "개화파의 중추원 주도"
 dhe_mod_jungchuwon_reformist_dominance_desc:0 "개화파가 중추원 의제를 주도하고 있습니다. 법안 추진과 사회 기술 수용은 빨라지지만, 황실의 권위 운용에는 부담이 생깁니다."
 dhe_mod_jungchuwon_provincial_dominance:0 "지방 대표의 중추원 우세"
 dhe_mod_jungchuwon_provincial_dominance_desc:0 "지방 대표들이 중추원의 큰 축으로 떠올랐습니다. 행정 조정과 기반시설 계획은 탄력을 받지만, 중앙의 법안 조율은 더 많은 타협을 요구합니다."
 dhe_mod_jungchuwon_public_trust_crisis:0 "중추원 신뢰 위기"
 dhe_mod_jungchuwon_public_trust_crisis_desc:0 "중추원이 백성과 관료에게 신뢰받지 못하고 있습니다. 국정의 정당성과 관료제 운용이 흔들립니다."
 dhe_mod_jungchuwon_public_confidence_high:0 "중추원 공신력 확립"
 dhe_mod_jungchuwon_public_confidence_high_desc:0 "중추원이 실제 국정 운영 기구로 인정받고 있습니다. 정부 정통성과 행정 신뢰가 높아집니다."
