l_korean:
 je_dhe_independence_club:0 "독립협회와 만민공동회"
 je_dhe_independence_club_desc:0 "광무 사회개혁이 진행되며 교육과 언론, 공론장의 폭이 넓어지자 신민들은 그 제국이 누구의 이름으로 다스려질 것인지를 묻기 시작했습니다. 독립협회와 만민공동회는 황권과 민권, 개혁과 질서 사이의 새로운 균열을 불러오고 있습니다."
 je_dhe_independence_club_goal:0 "독립협회가 왕당파보다 강한 영향력을 확보하면 헌정 개혁의 문이 열립니다. 반대로 왕당파가 우세해지면 황권 중심의 수습으로 끝납니다."
 je_dhe_independence_club_reason:0 "사회 개혁은 백성에게 글과 제도만 준 것이 아닙니다. 이제 조정은 스스로 말하기 시작한 공론장과, 이를 황권의 질서 안에 묶으려는 왕당파의 반격을 동시에 마주해야 합니다."

 dhe_progress_bar_constitutional_pressure:0 "왕당파와 독립협회"
 dhe_progress_bar_constitutional_pressure_desc:0 "오른쪽으로 갈수록 독립협회와 개화파가 우세하고, 왼쪽으로 갈수록 왕당파와 보수 대신들이 우세합니다."
 dhe_ic_independence_club_victory_tt:0 "독립협회의 영향력이 #v 40#!에 도달할 것"
 dhe_ic_royalist_victory_tt:0 "왕당파의 영향력이 #v -40#!에 도달할 것"
 dhe_ic_public_network:0 "만민공동회의 조직망"
 dhe_ic_constitutional_petition:0 "헌정 청원 운동"
 dhe_ic_intelligentsia_support:0 "지식인의 개혁 여론"
 dhe_ic_literate_public:0 "글을 읽는 백성의 증가"
 dhe_ic_free_speech:0 "보호받는 언론과 집회"
 dhe_ic_palace_guard:0 "궁궐과 경무청의 감시"
 dhe_ic_royalist_press:0 "왕당파 상소와 관보"
 dhe_ic_censorship:0 "검열의 통제"
 dhe_ic_low_legitimacy:0 "흔들리는 정부 정통성"
 dhe_ic_high_legitimacy:0 "안정된 황실 정부"
 dhe_ic_conservative_cabinet:0 "보수 대신들의 견제"

 dhe_button_ic_public_speech:0 "만민공동회 허가"
 dhe_button_ic_public_speech_desc:0 "한성의 공개 토론과 연설을 제한적으로 허가합니다.\n필요 조건: 지식인 영향력 #v 10%#! 이상\n효과: 독립협회 영향력 #p +6#!, 1년간 독립협회 월간 영향력 #p +1#!, 지식인 지지도 #p +1#!\n비용: 권위 #n 50#!"
 dhe_button_ic_police_supervision:0 "경무청 감시 강화"
 dhe_button_ic_police_supervision_desc:0 "집회 현장에 경무청과 관리를 배치해 급진화를 억제합니다.\n필요 조건: 정부 정통성 #v 40#! 이상\n효과: 왕당파 영향력 #p +6#!, 1년간 왕당파 월간 영향력 #p +1#!, 지주 지지도 #p +1#!, 지식인 지지도 #n -1#!\n비용: 권위 #n 50#!"
 dhe_button_ic_imperial_crackdown:0 "왕당파 상소 장려"
 dhe_button_ic_imperial_crackdown_desc:0 "보수 대신과 유림의 상소를 조직해 독립협회의 요구를 황권에 대한 도전으로 몰아갑니다.\n필요 조건: 정부 정통성 #v 50#! 이상\n효과: 왕당파 영향력 #p +12#!, 18개월간 왕당파 월간 영향력 #p +1.5#!, 지주 지지도 #p +2#!, 지식인 지지도 #n -2#!\n비용: 권위 #n 100#!"
 dhe_button_ic_constitutional_compromise:0 "중추원 개편 약속"
 dhe_button_ic_constitutional_compromise_desc:0 "독립협회의 요구 일부를 받아들여 중추원 개편과 헌정 논의의 길을 약속합니다.\n필요 조건: 지식인 영향력 #v 15%#! 이상, 식자율 #v 35%#! 이상\n효과: 독립협회 영향력 #p +12#!, 18개월간 독립협회 월간 영향력 #p +1.5#!, 지식인 지지도 #p +2#!, 지주 지지도 #n -1#!\n비용: 권위 #n 100#!"

 dhe_independence_club.1.t:0 "독립문 아래의 연설"
 dhe_independence_club.1.d:0 "광무 사회개혁으로 교육과 공론장의 폭이 넓어지자, 한성의 지식인과 개화 인사들은 독립문 아래 모여 새로운 제국의 정치를 논하기 시작했습니다."
 dhe_independence_club.1.f:0 "나라가 섰으면, 이제 나라의 뜻을 물어야 하지 않겠습니까?"
 dhe_independence_club.1.a:0 "그들의 목소리를 들어보라."

 dhe_independence_club.3.t:0 "왕당파의 승리"
 dhe_independence_club.3.d:0 "보수 대신과 왕당파의 상소가 조정을 뒤덮었습니다. 황제는 조정과 백성 앞에 칙령을 내려, 제국의 개혁은 오직 황권의 질서 아래 이루어질 것임을 선포했습니다."
 dhe_independence_club.3.a:0 "제국의 권위는 흔들리지 않는다."

 dhe_independence_club.4.t:0 "독립협회의 승리"
 dhe_independence_club.4.d:0 "만민공동회의 연설과 독립협회의 청원은 더 이상 무시할 수 없는 정치적 힘이 되었습니다. 조정은 중추원 개편과 헌정 논의를 받아들이며, 제한적이나마 신민의 여론을 국정에 반영할 길을 열었습니다."
 dhe_independence_club.4.a:0 "새로운 정치의 문이 열렸다."

 dhe_independence_club.5.t:0 "종로의 군중"
 dhe_independence_club.5.d:0 "독립협회와 만민공동회의 요구는 조정의 예상보다 빠르게 커졌습니다. 종로의 군중은 이제 개혁의 약속만으로는 물러서려 하지 않습니다."
 dhe_independence_club.5.a:0 "거센 물결이 궁궐 앞까지 밀려온다."

 dhe_mod_imperial_absolutism_reaffirmed:0 "재확인된 황권"
 dhe_mod_constitutional_experiment:0 "입헌 실험"
 dhe_mod_manhmin_unrest:0 "만민공동회의 격화"

 je_dhe_constitutional_reform:0 "만민공동회와 헌정 개혁"
 je_dhe_constitutional_reform_desc:0 "만민공동회의 요구를 완전히 외면할 수 없게 된 조정은 중추원 개편과 황제권의 경계를 두고 논의를 시작했습니다. 대한제국은 황권의 질서 안에서 헌정을 받아들일지, 제한된 입헌군주제의 길을 열지 결정해야 합니다."
 je_dhe_constitutional_reform_goal:0 "헌정 정착도를 높이거나, 황제 자문 중추원 또는 제한 의회 실험 중 하나를 선택하십시오."
 je_dhe_constitutional_reform_reason:0 "사회 개혁이 백성의 목소리를 제도 밖으로 불러냈다면, 헌정 개혁은 그 목소리를 제국의 정치 안에 어떻게 담을지 정하는 일입니다."

 dhe_progress_bar_constitutional_settlement:0 "헌정 정착도"
 dhe_progress_bar_constitutional_settlement_desc:0 "중추원 개편과 제한 헌정 논의가 조정과 여론 속에 뿌리내리는 정도입니다."
 dhe_constitution_appointed_bureaucrats:0 "임명직 관료제"
 dhe_constitution_legitimate_government:0 "안정된 정부 정통성"
 dhe_constitution_high_legitimacy:0 "높은 정통성"
 dhe_constitution_intelligentsia_support:0 "지식인의 헌정 지지"
 dhe_constitution_protected_speech:0 "보호받는 언론과 토론"
 dhe_constitution_manhmin_compromise:0 "만민공동회와의 타협"
 dhe_constitution_representative_law:0 "대표 정치 제도의 도입"
 dhe_constitution_censorship:0 "검열의 잔재"
 dhe_constitution_landowner_resistance:0 "보수 대신들의 저항"
 dhe_constitution_low_legitimacy:0 "흔들리는 정부 정통성"

 dhe_button_constitution_public_hearings:0 "공론 청취"
 dhe_button_constitution_public_hearings_desc:0 "중추원 개편 논의를 공개적으로 수렴하여 헌정 정착도를 높입니다."
 dhe_button_constitution_publish_draft:0 "헌정 초안 공표"
 dhe_button_constitution_publish_draft_desc:0 "중추원 개편과 국정 자문 절차를 담은 헌정 초안을 공표합니다.\n필요 조건: 정부 정통성 #v 50#! 이상\n효과: 헌정 정착도 #p +20#!, 지식인 지지도 #p +1#!, 지주 지지도 #n -1#!\n비용: 권위 #n 75#!"
 dhe_button_constitution_imperial_council:0 "황제 자문 중추원"
 dhe_button_constitution_imperial_council_desc:0 "중추원을 황제의 자문기구로 정비하여 황권 중심의 제한 헌정을 확립합니다."
 dhe_button_constitution_limited_assembly:0 "제한 의회 실험"
 dhe_button_constitution_limited_assembly_desc:0 "중추원에 제한적인 대표 기능을 부여하고, 금권 선거권을 제정하여 입헌군주제의 싹을 틔웁니다."

 dhe_constitutional_reform.1.t:0 "헌정 논의의 시작"
 dhe_constitutional_reform.1.d:0 "만민공동회의 외침은 조정의 문턱을 넘었습니다. 대신들은 황제권을 흔들지 않는 범위 안에서 중추원을 개편할 방안을 논의하기 시작했습니다."
 dhe_constitutional_reform.1.f:0 "말을 막으면 거리에 모이고, 말을 들으면 제도 안으로 들어온다."
 dhe_constitutional_reform.1.a:0 "논의를 시작하라."

 dhe_constitutional_reform.2.t:0 "황권 아래의 헌정"
 dhe_constitutional_reform.2.d:0 "조정은 중추원을 황제의 자문기구로 정비했습니다. 신민의 목소리는 제도 안에 들어왔으나, 최종 권위는 여전히 황제에게 남았습니다."
 dhe_constitutional_reform.2.a:0 "제국의 헌정은 황권 아래 선다."

 dhe_constitutional_reform.3.t:0 "제한 의회 실험"
 dhe_constitutional_reform.3.d:0 "중추원은 제한적이나마 대표성과 심의 기능을 갖춘 기구로 개편되었습니다. 조정은 재산과 신분을 갖춘 신민에게 제한적 선거권을 부여하는 금권 선거권을 제정했고, 대한제국은 황제권을 헌정 질서 안에 두는 입헌 정치의 문을 열었습니다."
 dhe_constitutional_reform.3.a:0 "금권 선거권을 반포하라."

 dhe_constitutional_reform.4.t:0 "헌정 조칙 반포"
 dhe_constitutional_reform.4.d:0 "오랜 논의 끝에 조정은 중추원 개편과 국정 자문 절차를 담은 헌정 조칙을 반포했습니다. 급진적 변화는 아니었지만, 제국 정치는 더 이상 예전과 같을 수 없게 되었습니다."
 dhe_constitutional_reform.4.a:0 "제국의 정치를 제도화하라."

 dhe_mod_imperial_constitution:0 "황권 아래의 헌정"
 dhe_mod_limited_constitutional_monarchy:0 "금권 입헌군주제"
 dhe_mod_constitutional_charter:0 "헌정 조칙"


 je_dhe_jiandao_arable_expansion:0 "간도 경작지 확장"
 je_dhe_jiandao_arable_expansion_reason:0 "간도 영유권을 확립한 뒤에도 이 땅은 아직 충분히 개간되지 않았습니다. 두만강 너머의 숲과 습지를 정리하고, 조선 농민이 익숙한 작물을 도입한다면 간도는 북방 경영의 든든한 곡창이 될 것입니다."
 dhe_progress_bar_jiandao_arable:0 "간도 개간 진척"
 dhe_progress_bar_jiandao_arable_desc:0 "간도에서 진행된 대규모 개간 사업의 횟수입니다."
 dhe_button_jiandao_arable_land:0 "간도 개간 사업"
 dhe_button_jiandao_arable_land_desc:0 "국고를 투입해 간도의 숲과 습지를 정리하고 새 농경지를 확보합니다.\n필요 조건: 금 보유고 #v 25,000#! 이상\n효과: 간도 경작지 #p +10#!\n현재 개간 사업: [ROOT.GetCountry.MakeScope.Var('dhe_jiandao_arable_counter_var').GetValue|v0]/3"
 dhe_button_jiandao_crop_potential:0 "간도 작물 시험장"
 dhe_button_jiandao_crop_potential_desc:0 "한반도 북부의 농법과 새 종자를 간도에 시험 도입합니다.\n필요 조건: 금 보유고 #v 15,000#! 이상\n효과: 선택한 작물의 농장 잠재력 추가\n현재 작물 도입: [ROOT.GetCountry.MakeScope.Var('dhe_jiandao_crop_counter_var').GetValue|v0]/4"
 dhe_jiandao_settlement_goal_tt:0 "간도 주의 인구가 #v 100,000#!명보다 많고 GDP가 #v 100,000#!보다 높을 것"
 dhe_jiandao_arable_land_goal_tt:0 "간도 개간 사업을 #v 3#!회 실시할 것"
 dhe_jiandao_crop_potential_goal_tt:0 "간도 작물 시험장을 #v 4#!회 설치할 것"
 dhe_jiandao.8.t:0 "간도 개발청의 설치"
 dhe_jiandao.8.d:0 "간도 영유권을 확립한 조정은 이제 국경선 너머의 땅을 실제 행정과 생산의 공간으로 바꾸려 합니다. 측량관, 농무 관리, 이주민 대표들이 모여 개간지 배정과 새 작물 시험 계획을 논의하기 시작했습니다."
 dhe_jiandao.8.f:0 "\"영토는 지도로 얻지만, 국토는 길과 밭으로 굳어진다.\""
 dhe_jiandao.8.a:0 "북방 경영을 시작하라."
 dhe_jiandao.5.t:0 "두만강 너머의 새 논밭"
 dhe_jiandao.5.d:0 "측량관과 개척민들이 간도 곳곳에 말뚝을 박고 물길을 냈습니다. 산림은 벌목되어 목책과 창고가 되었고, 습한 저지는 둑과 배수로를 따라 서서히 밭과 논으로 바뀌고 있습니다."
 dhe_jiandao.5.f:0 "\"북방의 흙은 차갑지만, 손을 대면 반드시 곡식을 낼 것이다.\""
 dhe_jiandao.5.a:0 "개간지를 백성들에게 나누어 주어라."
 dhe_jiandao.6.t:0 "간도 작물 시험장"
 dhe_jiandao.6.d:0 "농무 관리들은 간도의 기후와 토질을 살피며 새 작물을 시험할 후보지를 골랐습니다. 모든 작물이 북방의 추위를 견디지는 못하겠지만, 성공한 시험장은 간도의 농업 구성을 크게 넓힐 것입니다."
 dhe_jiandao.6.f:0 "\"씨앗 하나가 국경 마을의 장래를 바꿀 수도 있다.\""
 dhe_jiandao.6.a:0 "물길이 맞는 곳에 벼농사를 시험하라."
 dhe_jiandao.6.b:0 "염료 작물을 들여 새로운 환금작물을 만들라."
 dhe_jiandao.6.c:0 "담배 시험 재배지를 허가하라."
 dhe_jiandao.6.e:0 "산간 개간지에 인삼포를 조성하라."
 dhe_jiandao.7.t:0 "간도 곡창의 형성"
 dhe_jiandao.7.d:0 "간도의 새 촌락들은 더 이상 임시 정착지가 아닙니다. 경작지는 넓어졌고, 수확을 실어 나르는 길도 열렸으며, 조선 농민들의 생활은 북방 땅에 깊게 뿌리내리기 시작했습니다."
 dhe_jiandao.7.f:0 "\"땅을 가진 백성은 쉽게 떠나지 않는다.\""
 dhe_jiandao.7.a:0 "간도는 이제 제국의 북방 곡창이다."
