l_korean:
 je_dhe_independence_club:0 "#p 독립협회#!와 #v 만민공동회#!"
 je_dhe_independence_club_desc:0 "#gold 광무 사회개혁#!이 진행되며 교육과 언론, 공론장의 폭이 넓어지자 신민들은 그 제국이 누구의 이름으로 다스려질 것인지를 묻기 시작했습니다. #p 독립협회#!와 #v 만민공동회#!는 황권과 민권, 개혁과 질서 사이의 새로운 균열을 불러오고 있습니다."
 je_dhe_independence_club_goal:0 "#p 독립협회#!가 왕당파보다 강한 영향력을 확보하면 헌정 개혁의 문이 열립니다. 반대로 #n 왕당파#!가 우세해지면 황권 중심의 수습으로 끝납니다."
 je_dhe_independence_club_reason:0 "사회 개혁은 백성에게 글과 제도만 준 것이 아닙니다. 이제 조정은 스스로 말하기 시작한 #p 공론장#!과, 이를 황권의 질서 안에 묶으려는 #n 왕당파#!의 반격을 동시에 마주해야 합니다."

