 dhe_button_constitution_public_hearings:0 "공론 청취"
 dhe_button_constitution_public_hearings_desc:0 "중추원 개편 논의를 공개적으로 수렴하여 #p 헌정 정착도#!를 높입니다."
 dhe_button_constitution_publish_draft:0 "헌정 초안 공표"
 dhe_button_constitution_publish_draft_desc:0 "중추원 개편과 국정 자문 절차를 담은 헌정 초안을 공표합니다.\n필요 조건: 정부 정통성 #v 50#! 이상\n효과: 헌정 정착도 #p +20#!, 지식인 지지도 #p +1#!, 지주 지지도 #n -1#!\n비용: 권위 #n 75#!"
 dhe_button_constitution_imperial_council:0 "황제 자문 중추원"
 dhe_button_constitution_imperial_council_desc:0 "중추원을 #gold 황제의 자문기구#!로 정비하여 황권 중심의 제한 헌정을 확립합니다."
 dhe_button_constitution_limited_assembly:0 "제한 의회 실험"
 dhe_button_constitution_limited_assembly_desc:0 "중추원에 제한적인 대표 기능을 부여하고, #p 금권 선거권#!을 제정하여 입헌군주제의 싹을 틔웁니다."

 dhe_constitutional_reform.1.t:0 "헌정 논의의 시작"
 dhe_constitutional_reform.1.d:0 "만민공동회의 외침은 조정의 문턱을 넘었습니다. 대신들은 황제권을 흔들지 않는 범위 안에서 중추원을 개편할 방안을 논의하기 시작했습니다."
 dhe_constitutional_reform.1.f:0 "말을 막으면 거리에 모이고, 말을 들으면 제도 안으로 들어온다."
 dhe_constitutional_reform.1.a:0 "논의를 시작하라."

 dhe_constitutional_reform.2.t:0 "광무헌법 제정: 황권 아래의 헌정"
 dhe_constitutional_reform.2.d:0 "조정은 중추원을 황제의 자문기구로 정비하고, 황제권과 국정 자문 절차를 함께 규정한 광무헌법을 반포했습니다. 신민의 목소리는 제도 안에 들어왔으나, 최종 권위는 여전히 황제에게 남았습니다."
 dhe_constitutional_reform.2.a:0 "광무헌법은 황권 아래 선다."

 dhe_constitutional_reform.3.t:0 "광무헌법 제정: 제한 의회 실험"
 dhe_constitutional_reform.3.d:0 "중추원은 제한적이나마 대표성과 심의 기능을 갖춘 기구로 개편되었습니다. 조정은 재산과 신분을 갖춘 신민에게 제한적 선거권을 부여하는 금권 선거권을 제정했고, 광무헌법은 황제권을 헌정 질서 안에 두는 입헌 정치의 문을 열었습니다."
 dhe_constitutional_reform.3.a:0 "광무헌법과 금권 선거권을 반포하라."

 dhe_constitutional_reform.4.t:0 "광무헌법 제정"
 dhe_constitutional_reform.4.d:0 "오랜 논의 끝에 조정은 중추원 개편과 국정 자문 절차를 담은 광무헌법을 반포했습니다. 급진적 변화는 아니었지만, 제국 정치는 더 이상 예전과 같을 수 없게 되었습니다."
 dhe_constitutional_reform.4.a:0 "제국의 정치를 헌법으로 제도화하라."

