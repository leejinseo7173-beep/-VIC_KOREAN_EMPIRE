 je_dhe_jiandao_arable_expansion:0 "#gold 간도 경작지 확장#!"
 je_dhe_jiandao_arable_expansion_reason:0 "#gold 간도 영유권#!을 확립한 뒤에도 이 땅은 아직 충분히 개간되지 않았습니다. 두만강 너머의 숲과 습지를 정리하고, 조선 농민이 익숙한 작물을 도입한다면 간도는 북방 경영의 든든한 곡창이 될 것입니다."
 dhe_progress_bar_jiandao_arable:0 "간도 개간 진척"
 dhe_progress_bar_jiandao_arable_desc:0 "개간 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 3#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_button_jiandao_arable_land:0 "간도 개간 사업"
 dhe_button_jiandao_arable_land_desc:0 "국고를 투입해 간도의 숲과 습지를 정리하고 새 농경지를 확보합니다.\n필요 조건: 금 보유고 #v 25,000#! 이상\n효과: 간도 경작지 #p +10#!\n현재 개간 사업: #v [ROOT.GetCountry.MakeScope.Var('dhe_jiandao_arable_counter_var').GetValue|v0]#!/#v 3#!"
 dhe_button_jiandao_crop_potential:0 "간도 작물 시험장"
 dhe_button_jiandao_crop_potential_desc:0 "한반도 북부의 농법과 새 종자를 간도에 시험 도입합니다.\n필요 조건: 금 보유고 #v 15,000#! 이상\n효과: 선택한 작물의 농장 잠재력 추가\n현재 작물 도입: #v [ROOT.GetCountry.MakeScope.Var('dhe_jiandao_crop_counter_var').GetValue|v0]#!/#v 4#!"
 dhe_jiandao_settlement_goal_tt:0 "간도 주의 인구가 #v 100,000#!명보다 많고 GDP가 #v 100,000#!보다 높을 것"
 dhe_jiandao_arable_land_goal_tt:0 "간도 개간 사업을 #v 3#!회 실시할 것"
 dhe_jiandao_crop_potential_goal_tt:0 "간도 작물 시험장을 #v 4#!회 설치할 것"
 dhe_jiandao.8.t:0 "간도 개발청의 설치"
 dhe_jiandao.8.d:0 "간도 영유권을 확립한 조정은 이제 국경선 너머의 땅을 실제 행정과 생산의 공간으로 바꾸려 합니다. 측량관, 농무 관리, 이주민 대표들이 모여 개간지 배정과 새 작물 시험 계획을 논의하기 시작했습니다."
 dhe_jiandao.8.f:0 "\"영토는 지도로 얻지만, 국토는 길과 밭으로 굳어진다.\""
 dhe_jiandao.8.a:0 "북방 경영을 시작하라."
 dhe_jiandao.5.t:0 "두만강 너머의 새 논밭"
 dhe_jiandao.5.d:0 "측량관과 개척민들이 간도 곳곳에 말뚝을 박고 물길을 냈습니다. 산림은 벌목되어 목책과 창고가 되었고, 습한 저지는 둑과 배수로를 따라 서서히 밭과 논으로 바뀌고 있습니다."
 dhe_jiandao.5.f:0 "\"북방의 흙은 차갑지만, 손을 대면 반드시 곡식을 낼 것이다.\""
 dhe_jiandao.5.a:0 "개간지를 백성들에게 나누어 주어라."
 dhe_jiandao.6.t:0 "간도 작물 시험장"
 dhe_jiandao.6.d:0 "농무 관리들은 간도의 기후와 토질을 살피며 새 작물을 시험할 후보지를 골랐습니다. 모든 작물이 북방의 추위를 견디지는 못하겠지만, 성공한 시험장은 간도의 농업 구성을 크게 넓힐 것입니다."
 dhe_jiandao.6.f:0 "\"씨앗 하나가 국경 마을의 장래를 바꿀 수도 있다.\""
 dhe_jiandao.6.a:0 "물길이 맞는 곳에 벼농사를 시험하라."
 dhe_jiandao.6.b:0 "염료 작물을 들여 새로운 환금작물을 만들라."
 dhe_jiandao.6.c:0 "담배 시험 재배지를 허가하라."
 dhe_jiandao.6.e:0 "산간 개간지에 인삼포를 조성하라."
 dhe_jiandao.7.t:0 "간도 곡창의 형성"
 dhe_jiandao.7.d:0 "간도의 새 촌락들은 더 이상 임시 정착지가 아닙니다. 경작지는 넓어졌고, 수확을 실어 나르는 길도 열렸으며, 조선 농민들의 생활은 북방 땅에 깊게 뿌리내리기 시작했습니다."
 dhe_jiandao.7.f:0 "\"땅을 가진 백성은 쉽게 떠나지 않는다.\""
 dhe_jiandao.7.a:0 "간도는 이제 제국의 북방 곡창이다."




 je_dhe_jungchuwon_system:0 "#gold 중추원 운영#!"
 je_dhe_jungchuwon_system_desc:0 "헌정 개혁 이후 #gold 중추원#!은 단순한 황제 자문기구를 넘어, #n 황실#!과 #p 개화파#!, #v 지방 대표#!, 공론장의 이해관계가 충돌하는 정치 무대가 되었습니다.\n\n정례 회의: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_session_counter').GetValue|v0]회#!\n예산안 회기: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_budget_counter').GetValue|v0]회#!\n비상 회의: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_emergency_counter').GetValue|v0]회#!\n공개 청원: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_petition_counter').GetValue|v0]회#!\n지방 대표 확대: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_delegate_counter').GetValue|v0]회#!\n개혁안 통과: #v [GetPlayer.MakeScope.Var('dhe_jungchuwon_reform_bill_counter').GetValue|v0]회#!"
 je_dhe_jungchuwon_system_goal:0 "중추원의 #v 세력 구도#!와 #p 국정 신뢰#!를 관리하십시오. #p 개화파#!와 #p 국정 신뢰#!가 충분히 높으면 개혁안을 통과시킬 수 있습니다."
 je_dhe_jungchuwon_system_reason:0 "#gold 대한제국#!의 새 정치가 경운궁의 전각과 한성의 거리 사이에서 모습을 갖추고 있습니다. 황제의 칙령, #p 독립협회의 공론#!, #v 각 도 대표의 청원#!이 한 회의장에 모였으니, 중추원은 단순한 자문기구가 아니라 #gold 제국 국정의 심장#!이 될 수도, #n 황권과 민권이 충돌하는 균열#!이 될 수도 있습니다."
 je_dhe_jungchuwon_economic_growth_agenda:0 "#p 중추원 경제성장 의제#!"
 je_dhe_jungchuwon_economic_growth_agenda_desc:0 "#p 개화파#!가 정례 회의에서 산업 진흥과 시장 확대를 공식 국정 의제로 끌어올렸습니다. 중추원은 향후 #v 5년#! 동안 대한제국의 경제가 실제로 성장하는지 지켜볼 것입니다.\n\n목표: 현재 GDP 기준 #v 15%#! 성장"
 je_dhe_jungchuwon_economic_growth_agenda_goal:0 "5년 안에 GDP를 #v 15%#! 성장시키십시오."
 je_dhe_jungchuwon_economic_growth_agenda_reason:0 "회의장에서 나온 말이 국정 목표가 되려면, 공장과 항구와 장부 위에서도 결과가 나와야 합니다. 개화파는 중추원이 말뿐인 의회가 아니라 경제정책을 이끄는 기관임을 증명하려 합니다."
 je_dhe_jungchuwon_imperial_administration_agenda:0 "#n 궁정 행정 장악 의제#!"
 je_dhe_jungchuwon_imperial_administration_agenda_desc:0 "#n 황실파#!는 중추원이 국정을 흔드는 회의장이 아니라 황제의 칙령을 집행하는 행정 장치가 되어야 한다고 주장했습니다. 향후 #v 5년#! 동안 궁정은 관료제와 권위의 재정비를 요구할 것입니다.\n\n목표: 행정력 #v 250#! 이상, 권위 #v 100#! 이상, 정부 건물군 #v 12#!레벨 이상"
 je_dhe_jungchuwon_imperial_administration_agenda_goal:0 "5년 안에 황실 중심의 행정 역량을 입증하십시오."
 je_dhe_jungchuwon_imperial_administration_agenda_reason:0 "황실이 의제를 장악하려면 단순한 위엄이 아니라 명령을 실제 행정으로 바꾸는 능력을 보여주어야 합니다."
 je_dhe_jungchuwon_provincial_coordination_agenda:0 "#v 지방 행정 조정 의제#!"
 je_dhe_jungchuwon_provincial_coordination_agenda_desc:0 "#v 지방 대표#!들은 중앙의 명령만으로 제국을 운영할 수 없다고 주장했습니다. 중추원은 향후 #v 5년#! 동안 철도, 행정청, 세무 역량을 통해 중앙과 지방을 잇는 실질적 통로를 만들려 합니다.\n\n목표: 행정력 #v 100#! 이상, 기반시설 건물군 #v 10#!레벨 이상, 정부 행정청 #v 5#!레벨 이상, 철도 #v 5#!레벨 이상"
 je_dhe_jungchuwon_provincial_coordination_agenda_goal:0 "5년 안에 지방 행정과 기반시설 조정 능력을 입증하십시오."
 je_dhe_jungchuwon_provincial_coordination_agenda_reason:0 "중추원이 지방 대표를 받아들였다면, 이제 그 목소리를 도로와 철도, 행정망으로 바꾸어야 합니다."

 dhe_jungchuwon_widget_tt:0 "중추원 시스템은 #v 총 300석#! 안에서 #n 황실#!, #p 개화파#!, #v 지방 대표#!의 의석을 재분배하고, 별도로 #p 국정 신뢰#!를 관리하는 장기 정치 일지입니다. 한 파벌의 의석이 늘어나면 다른 파벌의 의석은 줄어듭니다.\n\n현재 운영 상태: [SCOPE.GetRootScope.GetCountry.GetCustom('DHE_JUNGCHUWON_SYSTEM_STATUS')]"
 dhe_jungchuwon_widget_royal:0 "#n 황실#!"
 dhe_jungchuwon_widget_royal_desc:0 "#n 황실 의석#!은 총 300석 중 황권과 보수 대신들이 장악한 몫입니다. 황실 의석이 커질수록 예산과 의제 설정은 안정되지만, #p 개화파#!와 #v 지방 대표#!의 공간은 줄어듭니다."
 dhe_jungchuwon_widget_reform:0 "#p 개화파#!"
 dhe_jungchuwon_widget_reform_desc:0 "#p 개화파 의석#!은 독립협회와 개화파 지식인이 확보한 개혁 세력입니다. 이 의석이 커질수록 개혁안 통과가 쉬워지지만, #n 황실파#!와의 충돌도 커질 수 있습니다."
 dhe_jungchuwon_widget_provincial:0 "#v 지방#!"
 dhe_jungchuwon_widget_provincial_desc:0 "#v 지방 대표 의석#!은 지방 관료, 유력자, 상공업 대표가 중앙 정치에 들어온 정도입니다. 지방 의석은 #p 개화파#!와 #n 황실파#! 사이의 완충 세력이 될 수 있습니다."
 dhe_jungchuwon_widget_trust:0 "#p 신뢰#!"
 dhe_jungchuwon_widget_trust_desc:0 "#p 국정 신뢰#!는 중추원이 백성과 관료에게 실제 국정 운영 기구로 받아들여지는 정도입니다. #n 예산 교착#!이나 지나친 황실 통제는 신뢰를 깎고, #p 공개 회의#!와 청원 처리는 신뢰를 올립니다."

