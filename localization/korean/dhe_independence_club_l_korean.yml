 dhe_ic_low_legitimacy:0 "흔들리는 정부 정통성"
 dhe_ic_high_legitimacy:0 "안정된 황실 정부"
 dhe_ic_conservative_cabinet:0 "보수 대신들의 견제"
 dhe_ic_widget_tt:0 "독립협회 일지는 #n 왕당파#!와 #p 개화파#!의 궁정 영향력 경쟁입니다. 진행도바가 왼쪽으로 밀리면 왕당파가, 오른쪽으로 밀리면 독립협회가 우세합니다.\n\n승리 기준: 독립협회 #p +40#! / 왕당파 #n -40#!"
 dhe_ic_widget_royalist:0 "왕당파"
 dhe_ic_widget_royalist_desc:0 "황권과 조정 질서를 앞세워 만민공동회와 독립협회의 요구를 제어하려는 세력입니다. 높은 정부 정통성, 검열, 지주 세력이 이들을 돕습니다."
 dhe_ic_widget_court:0 "궁정 정치"
 dhe_ic_widget_court_desc:0 "황제권, 중추원, 공론장이 충돌하는 정치 무대입니다. 버튼 선택과 국내 조건에 따라 어느 쪽의 영향력이 커질지 결정됩니다."
 dhe_ic_widget_independence_club:0 "독립협회"
 dhe_ic_widget_independence_club_desc:0 "만민공동회와 개화파 지식인을 중심으로 제한적 헌정과 여론 정치의 제도화를 요구하는 정치운동입니다. 지식인 영향력, 식자율, 언론 자유, 독립협회 운동 지지가 이들을 돕습니다."

 dhe_button_ic_public_speech:0 "만민공동회 허가"
 dhe_button_ic_public_speech_desc:0 "한성의 공개 토론과 연설을 제한적으로 허가합니다.\n필요 조건: 지식인 영향력 #v 10%#! 이상 또는 독립협회 운동 지지 #v 5%#! 이상\n효과: 독립협회 영향력 #p +6#!, 1년간 독립협회 월간 영향력 #p +1#!, 지식인 지지도 #p +1#!\n비용: 권위 #n 50#!"
 dhe_button_ic_police_supervision:0 "경무청 감시 강화"
 dhe_button_ic_police_supervision_desc:0 "집회 현장에 경무청과 관리를 배치해 급진화를 억제합니다.\n필요 조건: 정부 정통성 #v 40#! 이상\n효과: 왕당파 영향력 #p +6#!, 1년간 왕당파 월간 영향력 #p +1#!, 지주 지지도 #p +1#!, 지식인 지지도 #n -1#!\n비용: 권위 #n 50#!"
 dhe_button_ic_imperial_crackdown:0 "왕당파 상소 장려"
 dhe_button_ic_imperial_crackdown_desc:0 "보수 대신과 유림의 상소를 조직해 독립협회의 요구를 황권에 대한 도전으로 몰아갑니다.\n필요 조건: 정부 정통성 #v 50#! 이상\n효과: 왕당파 영향력 #p +12#!, 18개월간 왕당파 월간 영향력 #p +1.5#!, 지주 지지도 #p +2#!, 지식인 지지도 #n -2#!\n비용: 권위 #n 100#!"
 dhe_button_ic_constitutional_compromise:0 "중추원 개편 약속"
 dhe_button_ic_constitutional_compromise_desc:0 "독립협회의 요구 일부를 받아들여 중추원 개편과 헌정 논의의 길을 약속합니다.\n필요 조건: 지식인 영향력 #v 15%#! 이상, 독립협회 운동 지지 #v 10%#! 이상, 식자율 #v 35%#! 이상\n효과: 독립협회 영향력 #p +12#!, 18개월간 독립협회 월간 영향력 #p +1.5#!, 지식인 지지도 #p +2#!, 지주 지지도 #n -1#!\n비용: 권위 #n 100#!"

 dhe_independence_club.1.t:0 "독립문 아래의 연설"
 dhe_independence_club.1.d:0 "광무 사회개혁으로 교육과 공론장의 폭이 넓어지자, 한성의 지식인과 개화 인사들은 독립문 아래 모여 새로운 제국의 정치를 논하기 시작했습니다."
 dhe_independence_club.1.f:0 "나라가 섰으면, 이제 나라의 뜻을 물어야 하지 않겠습니까?"
 dhe_independence_club.1.a:0 "그들의 목소리를 들어보라."

 dhe_independence_club.3.t:0 "왕당파의 승리"
 dhe_independence_club.3.d:0 "보수 대신과 왕당파의 상소가 조정을 뒤덮었습니다. 황제는 조정과 백성 앞에 칙령을 내려, 제국의 개혁은 오직 황권의 질서 아래 이루어질 것임을 선포했습니다."
 dhe_independence_club.3.a:0 "제국의 권위는 흔들리지 않는다."

 dhe_independence_club.4.t:0 "독립협회의 승리"
 dhe_independence_club.4.d:0 "만민공동회의 연설과 독립협회의 청원은 더 이상 무시할 수 없는 정치적 힘이 되었습니다. 조정은 중추원 개편과 헌정 논의를 받아들이며, 제한적이나마 신민의 여론을 국정에 반영할 길을 열었습니다."
 dhe_independence_club.4.a:0 "새로운 정치의 문이 열렸다."

 dhe_independence_club.5.t:0 "종로의 군중"
 dhe_independence_club.5.d:0 "독립협회와 만민공동회의 요구는 조정의 예상보다 빠르게 커졌습니다. 종로의 군중은 이제 개혁의 약속만으로는 물러서려 하지 않습니다."
 dhe_independence_club.5.a:0 "거센 물결이 궁궐 앞까지 밀려온다."

