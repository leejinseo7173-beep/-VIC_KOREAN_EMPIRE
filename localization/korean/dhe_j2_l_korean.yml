 dhe_button_japan_control_pro_korean_cabinet:0 "친한 관료 후원"
 dhe_button_japan_control_pro_korean_cabinet_desc:0 "일본 조정과 지방 관료층 안의 친한 인사를 후원합니다.\n\n효과: 일본 장악도 #p +12#!, 일본 저항도 #n +4#!"
 dhe_button_japan_control_military_advisers:0 "군사고문단 파견"
 dhe_button_japan_control_military_advisers_desc:0 "대한제국 장교와 해군 고문단을 일본 군제와 항만 방위 체계에 침투시킵니다.\n\n효과: 일본 장악도 #p +15#!, 일본 저항도 #n +10#!"
 dhe_button_japan_control_investment_network:0 "철도·항만 투자"
 dhe_button_japan_control_investment_network_desc:0 "일본 주요 항만과 철도망에 대한 투자를 확대해 경제적 의존을 강화합니다.\n\n효과: 일본 장악도 #p +10#!, 일본 저항도 #p -5#!"
 dhe_button_japan_control_police_network:0 "헌병·경찰망 정비"
 dhe_button_japan_control_police_network_desc:0 "조약항과 친한 관료를 중심으로 일본 내 치안망을 정비합니다.\n\n효과: 일본 장악도 #p +6#!, 일본 저항도 #p -12#!"
 dhe_mod_japanese_governor_general_preparation:0 "동경총독부 설치 준비"
 dhe_mod_japanese_governor_general_preparation_desc:0 "대한제국은 일본 정치와 항만, 군사조직에 깊숙이 침투했습니다. 아직 총독부가 공식 선포된 것은 아니지만, 제국은 이미 일본을 움직일 행정적 손잡이를 쥐었습니다."
 dhe_mod_japan_control_crisis:0 "일본 장악 위기"
 dhe_mod_japan_control_crisis_desc:0 "일본 내 반한 여론과 군부 반발이 폭발하면서 대한제국의 장악 시도는 외교적 손상을 입었습니다."
 dhe_japan_control.1.t:0 "동경총독부 설치 준비"
 dhe_japan_control.1.d:0 "친한 관료와 항만 투자망, 군사고문단, 치안망은 이제 하나의 체계로 묶였습니다. 일본 정부는 여전히 자신의 이름으로 명령을 내리고 있지만, 그 명령문이 통과하는 길목마다 대한제국의 인장과 자금, 장교들이 자리 잡고 있습니다.\n\n조정은 일본 정부를 대한제국의 속국으로 재편하고, 그 위에 동경총독부를 세워 제국의 명령 체계에 편입하기로 결정했습니다."
 dhe_japan_control.1.f:0 "도쿄의 회의장에는 일본어 문서가 놓여 있었지만, 그 문서의 여백에는 한성에서 온 붉은 도장이 찍혀 있었다."
 dhe_japan_control.1.a:0 "일본을 제국의 괴뢰국으로 편입하라"
 dyn_c_dhe_japanese_governor_general:0 "동경총독부"
 dyn_c_dhe_japanese_governor_general_adj:0 "동경총독부"
 law_dhe_japanese_governor_general:0 "동경총독부 체제"
 law_dhe_japanese_governor_general_desc:0 "일본의 기존 막부와 천황 중심 통치 권위를 해체하고, 대한제국이 임명한 한국인 총독과 총독부 관료망이 행정·치안·재정을 장악하는 통치원리입니다."
 gov_dhe_japanese_governor_general:0 "동경총독부"
 gov_dhe_japanese_governor_general_desc:0 "대한제국 황제가 임명한 한국인 총독이 동경총독부를 통해 일본의 행정과 치안을 통제하는 [concept_government]입니다."
 RULER_TITLE_DHE_GOVERNOR_GENERAL:0 "총독"
 dhe_hong_jip:0 "홍집"
 dhe_kim:0 "김"
 dhe_japan_control.2.t:0 "친한 관료 명단"
 dhe_japan_control.2.d:0 "외무아문은 일본 조정과 지방 행정조직 내부에서 대한제국과 협력할 수 있는 인사 명단을 작성했습니다. 그들은 조약 특혜와 항만 투자를 지키기 위해 대한제국의 영향력을 필요로 합니다."
 dhe_japan_control.2.f:0 "그들은 충성을 말하지 않았다. 대신 예산과 승진, 철도 지분을 말했다."
 dhe_japan_control.2.a:0 "명단을 후원하라"
 dhe_japan_control.3.t:0 "군사고문단 파견"
 dhe_japan_control.3.d:0 "대한제국 장교단이 일본 항만과 병영에 파견되었습니다. 표면적으로는 군제 개혁 지원이지만, 실제 목적은 일본군의 명령 체계와 항만 방어 체계를 제국의 손이 닿는 곳으로 끌어오는 것입니다."
 dhe_japan_control.3.f:0 "군복의 단추는 달랐지만, 훈련장의 구령은 점점 같은 박자로 울렸다."
 dhe_japan_control.3.a:0 "군영에 제국의 그림자를 드리워라"
 dhe_japan_control.4.t:0 "철도와 항만의 문"
 dhe_japan_control.4.d:0 "대한 자본과 기술자가 일본 항만과 철도 사업에 대거 투입되었습니다. 일본 상인들은 이를 기회로 보지만, 항만 장부와 철도 운행표는 점점 한성의 계산에 맞춰 움직이기 시작했습니다."
 dhe_japan_control.4.f:0 "포문이 닫힌 뒤에도, 철도와 은행은 더 오래가는 점령군이었다."
 dhe_japan_control.4.a:0 "돈으로 길을 열어라"
 dhe_japan_control.5.t:0 "헌병과 순사"
 dhe_japan_control.5.d:0 "조약항의 치안 문제를 명분으로 대한제국은 일본 내 친한 관료와 협조하는 헌병·경찰망을 확장했습니다. 반한 단체는 잠시 숨을 죽였지만, 너무 강한 압박은 새로운 저항을 낳을 수도 있습니다."
 dhe_japan_control.5.f:0 "거리에 붙은 포고문 아래, 사람들은 누가 누구의 명령을 받는지 낮은 목소리로 물었다."
 dhe_japan_control.5.a:0 "질서가 먼저다"
 dhe_japan_control.6.t:0 "일본 장악 위기"
 dhe_japan_control.6.d:0 "일본 내 반한 여론과 군부의 반발이 폭발했습니다. 친한 관료들은 몸을 숨겼고, 항만 노동자와 군영 일부는 대한제국의 개입을 공개적으로 거부하고 있습니다.\n\n일본 장악 계획은 잠시 후퇴할 수밖에 없습니다."
 dhe_japan_control.6.f:0 "조약문은 찢기지 않았다. 그러나 거리의 불길은 그 종이를 비웃고 있었다."
 dhe_japan_control.6.a:0 "다시 준비해야 한다"
 je_dhe_japanese_governor_general:0 "#gold 동경총독부 운영#!"
 je_dhe_japanese_governor_general_reason:0 "대일수호조규와 경제 침투, 친한 관료망, 군사고문단은 마침내 하나의 통치기구로 묶였습니다. 일본 정부는 대한제국의 괴뢰국으로 재편되었고, 동경총독부는 그 위에서 행정과 군사, 재정을 감시합니다.\n\n대한제국은 일본 행정을 장악하면서도, 협력 엘리트를 키우고 지나친 압박이 일본 내 저항으로 폭발하지 않도록 조율해야 합니다.\n\n총독 회의: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_council_counter').GetValue|v0]회#!\n예산안: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_budget_counter').GetValue|v0]회#!\n치안령: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_security_counter').GetValue|v0]회#!\n경제 계획: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_economic_counter').GetValue|v0]회#!\n교육·관료 정책: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_education_counter').GetValue|v0]회#!"
 je_dhe_japanese_governor_general_goal:0 "동경총독부의 통제력과 협력 엘리트를 키우고 일본 저항도를 억제하십시오. 관료제 여유, 정부 정통성, 일본 경제 침투, 괴뢰국 행정 체계가 안정도를 높이고 저항을 낮춥니다. 저항도가 #n 100#!에 도달하면 총독부 운영은 위기에 빠집니다."
