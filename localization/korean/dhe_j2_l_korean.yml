 treaty_name_dhe_korea_japan_amity_trade:0 "대일수호조규"
 dhe_mod_korea_japan_treaty_rights:0 "대일수호조규의 권익"
 dhe_mod_korea_japan_treaty_rights_desc:0 "대한제국은 일본 시장에서 통상 특혜와 투자권, 항만 접근권을 인정받았고, 규슈 조약항 및 류큐제도 양도를 조규문에 새겼습니다. 이 조규는 제국의 해양 외교와 조약상 영향력을 크게 끌어올립니다."
 dhe_mod_japan_unequal_treaty_pressure:0 "대일수호조규의 압박"
 dhe_mod_japan_unequal_treaty_pressure_desc:0 "대한제국의 함포외교 앞에서 체결된 조규는 일본 조정의 권위와 외교적 저항력을 갉아먹고 있습니다."
 dhe_headline_notification_group:0 "#gold 제국 신보#! | 중대 외교"
 notification_dhe_headline_korea_japan_trade_treaty_name:0 "#bold 대일수호조규 체결#!"
 notification_dhe_headline_korea_japan_trade_treaty_desc:0 "광무호 사건은 대한제국의 승리로 마무리되었습니다. 일본은 대한제국에 통상 특혜, 투자권, 군사 접근권을 인정했고, 규슈 조약항 및 류큐제도 양도를 받아들였습니다. 제국의 함대와 외교는 처음으로 바다 너머 질서를 움직였습니다."
 notification_dhe_headline_korea_japan_trade_treaty_tooltip:0 "#header $notification_dhe_headline_korea_japan_trade_treaty_name$#!\n$notification_dhe_headline_korea_japan_trade_treaty_desc$"

 dhe_expansion.5.t:0 "제국 전략회의"
 dhe_expansion.5.d:0 "독립의 기쁨이 채 가시기도 전에, 조정의 시선은 국경 밖을 향하고 있습니다. 북쪽에는 청의 낡은 질서가 흔들리고, 남쪽에는 일본과 류큐를 둘러싼 해양 질서가 요동치고 있습니다.\n\n대한제국은 이제 두 노선 중 하나를 첫 대외전략으로 선택해야 합니다."
 dhe_expansion.5.f:0 "지도 위에 붉은 비단실이 놓였다. 하나는 만주를 향했고, 하나는 대한해협 너머 일본을 향했다."
 dhe_expansion.5.a:0 "#gold 북진론#!: 만주의 질서를 다시 그린다"
 dhe_expansion.5.b:0 "#v 남진론#!: 바다로 제국의 길을 연다"

 dhe_expansion.10.t:0 "제2차 제국 전략회의"
 dhe_expansion.10.d:0 "북방에서의 성과는 조정의 자신감을 키웠지만, 그것만으로 제국의 앞날을 모두 설명할 수는 없습니다. 대신들은 이제 바다 건너 일본을 압박하고 대한해협의 해상 질서를 제국의 손으로 다시 써야 한다고 주장하고 있습니다."
 dhe_expansion.10.f:0 "\"만주는 시작이었을 뿐입니다. 제국의 다음 길은 바다 위에 놓여 있습니다.\""
 dhe_expansion.10.a:0 "#v 남진론#!: 일본과 해양 질서를 압박한다"

 dhe_expansion.6.t:0 "광무호, 일본 연안으로"
 dhe_expansion.6.d:0 "남진론을 채택한 조정은 신예함 광무호를 일본 연안으로 파견하기로 결정했습니다. 공식 명목은 해도 측량과 재외민 보호였으나, 외무아문이 준비한 조약 초안에는 훨씬 노골적인 문장이 적혀 있었습니다.\n\n대한제국은 일본에 통상 특혜, 투자권, 군사 접근권, 규슈 조약항, 류큐제도 양도를 요구하는 대일수호조규를 제안할 것입니다. 일본이 거부한다면 광무호의 함포가 다음 문장이 될 것입니다."
 dhe_expansion.6.f:0 "검은 연기를 토하는 굴뚝 아래, 광무호의 함수가 남쪽 바다를 갈랐다."
 dhe_expansion.6.a:0 "조약 화면에서 일본에 직접 요구를 제안한다"

 dhe_expansion.7.t:0 "대한제국의 배상 요구"
 dhe_expansion.7.d:0 "대한제국의 광무호가 일본 연안에 나타난 뒤, 서울에서 배상 요구서가 도착했습니다. 그들은 일본의 연안 포대와 지방 관리들이 광무호를 위협했다며 공식 사과와 통상상 특혜를 요구하고 있습니다.\n\n수용한다면 굴욕적인 조약이 체결될 것입니다. 거부한다면 대한제국 함대가 실제로 움직일지도 모릅니다."
 dhe_expansion.7.f:0 "항구의 안개 너머로 낯선 군함의 검은 윤곽이 보였다. 외교문서는 이미 포연 냄새를 풍기고 있었다."
 dhe_expansion.7.a:0 "요구를 수용한다. 조약을 체결하라."
 dhe_expansion.7.b:0 "저항한다. 저들의 함포에 굴복할 수 없다!"

 dhe_expansion.8.t:0 "대일수호조규"
 dhe_expansion.8.d:0 "일본 정부는 결국 대한제국의 압박을 견디지 못했습니다. 광무호 사건은 조약문 위의 잉크로 마무리되었고, 대한제국은 일본 시장에서 통상 특혜, 투자권, 군사 접근권을 인정받았습니다. 규슈에는 제국의 조약항이 열리고, 류큐제도는 대한제국의 손으로 넘어왔습니다.\n\n이제 대한제국은 방어만 하던 나라가 아닙니다. 우리의 함대는 조약을 강요할 수 있고, 우리의 외교관은 함포의 그림자 아래 협상할 수 있습니다."
 dhe_expansion.8.f:0 "조약문 마지막 줄에 인장이 찍히자, 바깥 항구의 군함들이 일제히 기적을 울렸다."
 dhe_expansion.8.a:0 "바다가 제국의 문을 열었다"

 dhe_expansion.9.t:0 "일본의 거부"
 dhe_expansion.9.d:0 "일본 정부는 대한제국의 배상 요구를 단호히 거부했습니다. 외무아문은 이를 제국의 위신에 대한 공개적 도전으로 규정했고, 해군은 즉시 실력행사를 준비하고 있습니다.\n\n이제 광무호 사건은 외교문서가 아니라 함포 사격으로 해결해야 합니다."
 dhe_expansion.9.f:0 "답신은 짧았다. 그러나 그 짧은 문장 하나가 대한해협의 바람을 바꾸었다."
 dhe_expansion.9.a:0 "함대를 규슈 앞바다로 보내라"

