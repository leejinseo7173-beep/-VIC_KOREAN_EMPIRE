 dhe_samjeong.10.t:0 "전정도감의 첫 명령"
 dhe_samjeong.10.d:0 "전정 개혁을 맡을 관원들이 대전 앞에 엎드렸습니다. 문제는 분명합니다. 은결은 장부 밖에 숨어 있고, 전세는 백성의 논에만 무겁게 내려앉으며, 향촌 양반은 측량줄이 자기 문 앞에 닿는 순간 개혁을 역모라 부를 것입니다.\n\n이제 삼정이정청은 첫 토지 감찰의 방식을 정해야 합니다."
 dhe_samjeong.10.f:0 "\"땅을 재는 일은 흙을 재는 일이 아니옵니다. 누가 나라의 눈을 가렸는지 재는 일이옵니다.\""
 dhe_samjeong.10.a:0 "암행어사를 보내 은결을 들춰내라."
 dhe_samjeong.10.b:0 "호조와 향촌 양반의 장부를 맞춰라."
 dhe_samjeong.10.c:0 "양전청에 개화 관료를 붙여 실측하라."
 dhe_samjeong_10_a_tt:0 "#N 민심 불안 +45#!\n#N 권위 -50, 지주 지지도 -3#!\n#P 2년 동안 조세 역량을 일부 회복하지만 관료 부담이 증가합니다.#!\n#v 전정 개혁은 행정청 8레벨, 관료제 150 이상, 관료제 법 조건으로 완료됩니다.#!"
 dhe_samjeong_10_b_tt:0 "#P 민심 불안 -20#!\n#N 국고 -15,000#!\n#P 지주 지지도 +1, 2년 동안 온건한 조세 정비 효과#!\n#v 전정 개혁은 행정청 8레벨, 관료제 150 이상, 관료제 법 조건으로 완료됩니다.#!"
 dhe_samjeong_10_c_tt:0 "#N 민심 불안 +15#!\n#N 권위 -30, 국고 -10,000#!\n#P 지식인 지지도 +2, 2년 동안 기술 전파 소폭 증가#!\n#v 전정 개혁은 행정청 8레벨, 관료제 150 이상, 관료제 법 조건으로 완료됩니다.#!"
 dhe_samjeong.20.t:0 "군정쇄신사의 임명"
 dhe_samjeong.20.d:0 "군포 장부는 죽은 자의 이름으로 세금을 걷고, 군영의 급료는 관아 어딘가에서 사라졌으며, 백성은 군역을 피하려 다시 빚을 집니다. 병조는 질서를 말하고, 군영은 돈을 말하며, 백성은 억울함을 말합니다.\n\n군정 개혁은 칼보다 장부가 먼저 움직이는 전쟁입니다."
 dhe_samjeong.20.f:0 "\"총 한 자루보다 무서운 것이 빈 급료 장부입니다. 병사가 나라를 믿지 않으면 군문은 이미 반쯤 무너진 것입니다.\""
 dhe_samjeong.20.a:0 "군영 장부를 봉인하고 감사를 시작하라."
 dhe_samjeong.20.b:0 "밀린 급료부터 지급해 군심을 붙잡아라."
 dhe_samjeong.20.c:0 "호포 논의를 열어 군역 부담을 넓혀라."
 dhe_samjeong_20_a_tt:0 "#N 민심 불안 +20#!\n#N 권위 -50#!\n#P 군부 지지도 +1, 2년 동안 병영 처리율 소폭 증가#!\n#v 군정 개혁은 병영 25레벨, 무기공장 2레벨, 농민 징집제 폐지로 완료됩니다.#!"
 dhe_samjeong_20_b_tt:0 "#P 민심 불안 -60#!\n#N 국고 -30,000, 군사 임금 부담 증가#!\n#P 군인 충성파 증가#!\n#v 군정 개혁은 병영 25레벨, 무기공장 2레벨, 농민 징집제 폐지로 완료됩니다.#!"
 dhe_samjeong_20_c_tt:0 "#N 민심 불안 +25#!\n#N 권위 -30, 지주 지지도 -2#!\n#P 농촌민 지지도 +1#!\n#v 군정 개혁은 병영 25레벨, 무기공장 2레벨, 농민 징집제 폐지로 완료됩니다.#!"
 dhe_samjeong.30.t:0 "환곡감사관의 파견"
 dhe_samjeong.30.d:0 "환곡창의 문은 닫혀 있지만 장부 위의 곡식은 매년 불어납니다. 빌린 쌀은 갚아도 빚으로 남고, 구휼은 은혜가 아니라 고리대가 되었습니다. 지방 수령은 풍년을 말하고, 백성은 빈 창고를 가리킵니다.\n\n환곡 개혁은 창고 문을 여는 순간부터 정치가 됩니다."
 dhe_samjeong.30.f:0 "\"쌀 한 섬의 행방을 묻는 일은 백성의 겨울을 묻는 일입니다.\""
 dhe_samjeong.30.a:0 "환곡창을 열고 장부를 압수하라."
 dhe_samjeong.30.b:0 "고리 환곡을 탕감해 민심을 먼저 구하라."
 dhe_samjeong.30.c:0 "사창 시범을 허가해 향촌이 맡게 하라."
 dhe_samjeong_30_a_tt:0 "#P 민심 불안 -35#!\n#N 국고 -15,000, 지주 지지도 -2#!\n#P 농촌민 지지도 +2#!\n#v 환곡 개혁은 문란한 환곡제 폐지와 구빈법 이상의 구휼 제도로 완료됩니다.#!"
 dhe_samjeong_30_b_tt:0 "#P 민심 불안 -75#!\n#N 국고 -30,000#!\n#P 하류층 충성파 증가, 2년 동안 사망률 완화#!\n#v 환곡 개혁은 문란한 환곡제 폐지와 구빈법 이상의 구휼 제도로 완료됩니다.#!"
 dhe_samjeong_30_c_tt:0 "#P 민심 불안 -20#!\n#N 국고 -10,000#!\n#P 농촌민 지지도 +1, 지주 지지도 +1#!\n#v 환곡 개혁은 문란한 환곡제 폐지와 구빈법 이상의 구휼 제도로 완료됩니다.#!"
 dhe_samjeong.1.t:0 "삼정 감찰회의"
 dhe_samjeong.1.d:0 "호조의 장부, 병조의 군포 대장, 지방 창고의 환곡 장부가 한 자리에 펼쳐졌습니다. 어느 장부도 깨끗하지 않습니다. 토지를 숨긴 자는 군포를 피했고, 군포를 빼돌린 자는 환곡을 고리대로 만들었습니다.\n\n올해 조정의 힘을 어디에 집중하느냐에 따라 개혁의 속도와 민심의 방향이 달라질 것입니다."
 dhe_samjeong.1.f:0 "\"한 칼로 세 폐단을 모두 끊을 수는 없사옵니다. 먼저 어디를 베어야 할지 정하셔야 합니다.\""
 dhe_samjeong.1.a:0 "토지대장부터 다시 물려라."
 dhe_samjeong.1.b:0 "군영의 밀린 급료를 바로잡아라."
 dhe_samjeong.1.c:0 "환곡창을 열고 장부를 갈아엎어라."
 dhe_samjeong.1.e:0 "향촌과 타협하며 조금씩 밀어붙인다."
 dhe_samjeong_1_a_tt:0 "#N 즉시 민심 불안 +35#!\n#N 권위 -50, 지주 지지도 -2#!\n#v 1년 동안 전정 집중 방침이 유지됩니다. 전정은 직접 진행되지 않으며 행정청·관료제가 필요합니다.#!"
 dhe_samjeong_1_b_tt:0 "#P 즉시 민심 불안 -40#!\n#N 국고 -30,000#!\n#P 군부 지지도 +2#!\n#v 1년 동안 군정 집중 방침이 유지됩니다. 군정은 직접 진행되지 않으며 병영·무기공장·군제 개혁이 필요합니다.#!"
 dhe_samjeong_1_c_tt:0 "#P 즉시 민심 불안 -55#!\n#N 국고 -20,000#!\n#P 충성파 증가#!\n#v 1년 동안 환곡 집중 방침이 유지됩니다. 환곡은 직접 진행되지 않으며 환곡제 폐지와 구휼법이 필요합니다.#!"
 dhe_samjeong_1_e_tt:0 "#P 즉시 민심 불안 -25#!\n#P 지주 지지도 +1#!\n#v 1년 동안 향촌 타협 방침이 유지됩니다. 속도는 느리지만 민심 불안을 낮춥니다.#!"

 dhe_samjeong.2.t:0 "삼정이정청의 완수"
 dhe_samjeong.2.d:0 "마침내 토지대장과 군포 장부, 환곡 창고가 하나의 질서 아래 다시 묶였습니다. 완벽한 개혁은 아닐지라도, 더 이상 백성의 피눈물이 지방 수령과 토호의 장부 속에서 사라지지는 않을 것입니다.\n\n조선은 가장 낡고 고통스러운 폐단 하나를 넘었습니다."
 dhe_samjeong.2.f:0 "\"장부가 바로 서니 백성이 숨을 쉬고, 백성이 숨을 쉬니 나라가 다시 선다.\""
 dhe_samjeong.2.a:0 "이제 다음 개혁으로 나아간다."
 dhe_samjeong.3.t:0 "삼정이정청의 붕괴"
 dhe_samjeong.3.d:0 "감찰회의의 문서가 산처럼 쌓이는 동안, 지방의 분노는 이미 조정의 계산을 앞질렀습니다. 군영은 급료를 요구하고, 농민은 환곡 장부를 불태우며, 토호들은 개혁을 비웃고 있습니다.\n\n삼정이정청은 민심을 붙잡는 데 실패했습니다."
 dhe_samjeong.3.f:0 "\"장부가 아니라 거리에서 답이 나오기 시작했습니다.\""
 dhe_samjeong.3.a:0 "상황이 위험해졌다."

 dhe_samjeong_widget_title:0 "#gold 삼정이정청#!"
 dhe_samjeong_widget_subtitle:0 "세율, 법, 건물, 민심을 함께 관리하십시오."
 dhe_samjeong_widget_tt:0 "#gold 삼정이정청#!은 무너진 세 제도를 국가 운영으로 해결하는 개혁 기구입니다.\n\n#v 전정#!은 행정청과 관료제, #v 군정#!은 병영·무기공장·군제, #v 환곡#!은 환곡제 폐지와 구휼 제도로 해결됩니다. 민심 불안이 #n 1000#!에 닿으면 개혁이 붕괴합니다."
 dhe_samjeong_widget_ruler:0 "어전 개혁"
 dhe_samjeong_widget_ruler_tt:0 "삼정이정청은 국왕의 명으로 설치된 임시 개혁 관청입니다. 전정·군정·환곡을 정비하되, 민심 불안을 폭발시키지 않아야 합니다."
 dhe_samjeong_widget_land:0 "전정"
 dhe_samjeong_widget_land_status:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_LAND_STATUS')]"
 dhe_samjeong_widget_land_line:0 "#gold 전정#!: [SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_LAND_STATUS')]"
 dhe_samjeong_widget_land_desc:0 "#gold 전정 개혁#!\n토지대장, 은결, 전세 징수 구조를 바로잡습니다.\n\n현재 상태: [SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_LAND_STATUS')]"
 dhe_samjeong_widget_military:0 "군정"
 dhe_samjeong_widget_military_status:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_MILITARY_STATUS')]"
 dhe_samjeong_widget_military_line:0 "#gold 군정#!: [SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_MILITARY_STATUS')]"
 dhe_samjeong_widget_military_desc:0 "#gold 군정 개혁#!\n군포 장부, 구식 군영, 밀린 급료 문제를 수습합니다.\n\n현재 상태: [SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_MILITARY_STATUS')]"
 dhe_samjeong_widget_granary:0 "환곡"
 dhe_samjeong_widget_granary_status:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_GRANARY_STATUS')]"
 dhe_samjeong_widget_granary_line:0 "#gold 환곡#!: [SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_GRANARY_STATUS')]"
 dhe_samjeong_widget_granary_desc:0 "#gold 환곡 개혁#!\n환곡창, 고리 환곡, 구휼 장부를 다시 정비합니다.\n\n현재 상태: [SCOPE.GetRootScope.GetCountry.GetCustom('DHE_SAMJEONG_GRANARY_STATUS')]"
 dhe_samjeong_widget_footer:0 "#n 민심 불안#! 1000 도달 시 붕괴. 세 개혁은 아래 버튼으로 착수하십시오."
 dhe_samjeong_widget_unrest:0 "#n 민심 불안#!은 세율·생활수준·주 혼란도·관료제·법에 따라 매달 변합니다."
 dhe_samjeong_widget_unrest_desc:0 "민심 불안이 #n 1000#!에 닿으면 삼정이정청이 붕괴합니다.\n\n#P 낮은 세율, 높은 정통성, 안정된 생활수준, 군정·환곡 집중 방침#!은 불안을 낮춥니다.\n#N 높은 세율, 문란한 환곡제, 농민 징집제, 관료제 적자, 주 혼란도, 강한 지주층#!은 불안을 올립니다."
