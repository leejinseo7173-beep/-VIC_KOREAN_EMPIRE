 dhe_japanese_governor_general_resistance_economic_integration:0 "경제 회유"
 dhe_button_japanese_governor_general_admin_reform:0 "총독부 행정 개편"
 dhe_button_japanese_governor_general_admin_reform_desc:0 "친한 관료와 대한제국 고문관을 중심으로 일본 행정망을 재편합니다.\n\n효과: 총독부 안정도 #p +10#!, 일본 저항도 #n +1#!"
 dhe_button_japanese_governor_general_economic_integration:0 "경제 통합 확대"
 dhe_button_japanese_governor_general_economic_integration_desc:0 "철도·항만·금융망을 대한제국 시장과 더 깊게 묶습니다.\n\n효과: 총독부 안정도 #p +8#!, 일본 저항도 #p -8#!, 대한제국에 일시적 수입 보너스"
 dhe_button_japanese_governor_general_garrison_rotation:0 "주둔군 교대"
 dhe_button_japanese_governor_general_garrison_rotation_desc:0 "조약항과 주요 거점의 대한제국 주둔군을 교대 배치해 저항 조직을 압박합니다.\n\n효과: 총독부 안정도 #p +6#!, 일본 저항도 #p -12#!, 대일 관계 #n -5#!"
 dhe_mod_japanese_governor_general_active:0 "동경총독부"
 dhe_mod_japanese_governor_general_active_desc:0 "대한제국은 대일수호조규와 경제 침투를 바탕으로 일본을 괴뢰국으로 편입하고, 동경총독부를 통해 정치와 행정에 직접적인 통제력을 행사하고 있습니다."
 dhe_mod_japanese_governor_general_revenue:0 "일본 경제 통합 수익"
 dhe_mod_japanese_governor_general_revenue_desc:0 "일본 항만, 철도, 금융망이 대한제국 시장과 연결되며 제국 재정에 추가 수익을 제공합니다."
 dhe_mod_japanese_governor_general_under_korea:0 "대한제국 총독부 압력"
 dhe_mod_japanese_governor_general_under_korea_desc:0 "일본 정부의 주요 명령과 재정, 항만 정책은 이제 대한제국 총독부의 감시 아래 놓였습니다."
 dhe_mod_korean_governor_installed:0 "한국인 총독 파견"
 dhe_mod_korean_governor_installed_desc:0 "대한제국이 임명한 한국인 총독이 일본 정부의 최고 통치자로 부임했습니다. 총독부 행정은 더 단단해졌지만, 일본 사회의 반발도 잠시 커지고 있습니다."
 dhe_mod_japanese_governor_general_administration:0 "총독부 행정 재편"
 dhe_mod_japanese_governor_general_administration_desc:0 "일본 행정조직은 대한제국 고문관과 친한 관료를 중심으로 재편되고 있습니다."
 dhe_mod_japanese_governor_general_backlash:0 "총독부 반발"
 dhe_mod_japanese_governor_general_backlash_desc:0 "총독부 운영에 대한 반발이 일본 사회 곳곳에서 격화되고 있습니다."
 dhe_japan_control.10.t:0 "총독부 운영 위기"
 dhe_japan_control.10.d:0 "일본 내 저항은 더 이상 보고서의 숫자가 아니었습니다. 항만 노동자 파업, 지방 관료의 지연 명령, 군영의 침묵이 하나로 이어지며 총독부의 명령망이 흔들리고 있습니다.\n\n대한제국은 일본 장악을 포기하지 않았지만, 총독부 운영은 한동안 위기 속에서 다시 정비되어야 합니다."
 dhe_japan_control.10.f:0 "도장은 찍혔으나, 명령은 거리에서 멈춰 섰다."
 dhe_japan_control.10.a:0 "동경총독부를 재정비하라"

 dhe_tokyo_governor_widget_tt:0 "#gold 동경총독부 운영#!\n총독부는 통제력, 협력 엘리트, 일본 저항도 사이에서 균형을 잡아야 합니다."
 dhe_tokyo_governor_widget_control:0 "통제력"
 dhe_tokyo_governor_widget_control_desc:0 "#v 총독부 통제력#!은 대한제국이 일본의 행정·군사·재정을 얼마나 장악했는지를 뜻합니다."
 dhe_tokyo_governor_widget_collaboration:0 "협력파"
 dhe_tokyo_governor_widget_collaboration_desc:0 "#p 협력 엘리트#!는 동경총독부와 협조하는 일본 관료, 화족, 자본가 세력입니다."
 dhe_tokyo_governor_widget_resistance:0 "저항"
 dhe_tokyo_governor_widget_resistance_desc:0 "#n 일본 저항도#!가 높아지면 총독부 운영이 위기에 빠집니다. #n 100#!에 도달하면 실패합니다."
 dhe_tokyo_governor_widget_policy:0 "정책"
 dhe_tokyo_governor_widget_policy_desc:0 "버튼은 즉시 성공 버튼이 아니라 정책 회의 이벤트를 엽니다. 선택지에 따라 장기 정책 변수와 게이지가 달라집니다."

 dhe_tokyo_governor_stability_admin_focus:0 "총독 회의의 행정 우선 노선"
 dhe_tokyo_governor_stability_generous_budget:0 "넉넉한 총독부 예산"
 dhe_tokyo_governor_stability_security_patrols:0 "치안 순찰망"
 dhe_tokyo_governor_stability_economic_plan:0 "경제 통합 계획"
 dhe_tokyo_governor_collaboration_investment:0 "대한 자본의 일본 투자"
 dhe_tokyo_governor_collaboration_policy:0 "협력파 우선 정책"
 dhe_tokyo_governor_collaboration_generous_budget:0 "협력 관료 지원금"
 dhe_tokyo_governor_collaboration_economic_plan:0 "경제 통합의 이익"
 dhe_tokyo_governor_collaboration_education:0 "일본 관료 양성"
 dhe_tokyo_governor_collaboration_relations:0 "완만한 대일 관계"
 dhe_tokyo_governor_collaboration_harsh_security:0 "강경 치안령의 반발"
 dhe_tokyo_governor_collaboration_bad_relations:0 "악화된 대일 관계"
 dhe_tokyo_governor_resistance_security_patrols:0 "순찰망과 주둔군 압박"
 dhe_tokyo_governor_resistance_harsh_security:0 "강경 치안령의 역풍"
 dhe_tokyo_governor_resistance_collaboration_policy:0 "협력파 회유"
 dhe_tokyo_governor_resistance_economic_plan:0 "경제 통합의 회유 효과"
 dhe_tokyo_governor_resistance_austerity:0 "긴축 예산의 불만"

 dhe_button_tokyo_governor_general_council:0 "총독 회의 소집"
 dhe_button_tokyo_governor_general_council_desc:0 "동경총독부의 월례 회의를 열어 행정, 협력파, 치안 중 어느 축을 우선할지 정합니다.\n필요 조건: 관료제 #v 100#! 이상, 권위 #v 50#! 이상\n효과: 총독 회의 이벤트 발생\n비용: 권위 #n 50#!\n현재 소집 횟수: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_council_counter').GetValue|v0]회#!"
 dhe_button_tokyo_governor_general_budget:0 "총독부 예산안"
 dhe_button_tokyo_governor_general_budget_desc:0 "향후 몇 년 동안 동경총독부에 투입할 예산 규모를 결정합니다.\n필요 조건: 관료제 #v 150#! 이상\n효과: 예산안 이벤트 발생\n현재 편성 횟수: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_budget_counter').GetValue|v0]회#!"
 dhe_button_tokyo_governor_general_security:0 "치안령 검토"
 dhe_button_tokyo_governor_general_security_desc:0 "일본 각지의 저항을 어떻게 다룰지 결정합니다. 강경책은 즉효가 크지만 장기 반발도 큽니다.\n필요 조건: 육군 #v 40#! 이상, 해군 #v 10#! 이상\n효과: 치안령 이벤트 발생\n현재 검토 횟수: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_security_counter').GetValue|v0]회#!"
 dhe_button_tokyo_governor_general_economic_plan:0 "경제 통합 계획"
 dhe_button_tokyo_governor_general_economic_plan_desc:0 "철도, 항만, 금융망을 통해 일본 경제를 대한제국 질서 안으로 묶습니다.\n필요 조건: 관료제 #v 100#! 이상, 금 보유고 #v 25,000#! 이상\n효과: 경제 계획 이벤트 발생\n현재 계획 횟수: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_economic_counter').GetValue|v0]회#!"
 dhe_button_tokyo_governor_general_education:0 "교육·관료 정책"
 dhe_button_tokyo_governor_general_education_desc:0 "일본 협력 관료를 양성할지, 대한식 행정 언어를 강제할지, 현지 제도를 보존할지 결정합니다.\n필요 조건: 관료제 #v 100#! 이상, 식자율 #v 35%#! 이상\n효과: 교육·관료 정책 이벤트 발생\n비용: 금 #n 20,000#!\n현재 시행 횟수: #v [GetPlayer.MakeScope.Var('dhe_tokyo_governor_education_counter').GetValue|v0]회#!"

 dhe_japan_control.11.t:0 "동경총독부 회의"
 dhe_japan_control.11.d:0 "총독부 회의실에는 대한제국 고문관, 일본 협력 관료, 주둔군 장교가 함께 앉았습니다. 모두가 동경총독부의 이름으로 명령을 내리지만, 그 명령이 무엇을 우선해야 하는지에 대해서는 의견이 갈립니다."
 dhe_japan_control.11.f:0 "동경의 탁자 위에는 일본 지도와 대한제국의 붉은 인장이 나란히 놓였다."
 dhe_japan_control.11.a:0 "행정망을 먼저 장악한다"
 dhe_japan_control.11.b:0 "일본 협력파를 키운다"
 dhe_japan_control.11.c:0 "주둔군과 치안을 우선한다"
 dhe_tokyo_governor_11a_tt:0 "효과: 통제력 #p +8#!, 협력 엘리트 #p +3#!, 일본 저항도 #n +2#!\n2년 동안 행정 우선 노선"
 dhe_tokyo_governor_11b_tt:0 "효과: 통제력 #p +4#!, 협력 엘리트 #p +10#!, 일본 저항도 #p -3#!\n2년 동안 협력파 우선 노선"
 dhe_tokyo_governor_11c_tt:0 "효과: 통제력 #p +5#!, 협력 엘리트 #n -3#!, 일본 저항도 #p -6#!\n2년 동안 치안 순찰망 강화"

 dhe_japan_control.12.t:0 "동경총독부 예산안"
 dhe_japan_control.12.d:0 "총독부 예산안이 한성으로 올라왔습니다. 일본 행정망을 안정시키려면 돈이 필요하지만, 제국 본토의 재정 관료들은 끝없는 지출을 경계합니다."
 dhe_japan_control.12.f:0 "숫자는 냉정했지만, 그 숫자가 가리키는 것은 거리와 항만과 관료의 충성심이었다."
 dhe_japan_control.12.a:0 "넉넉한 예산을 승인한다"
 dhe_japan_control.12.b:0 "균형 예산으로 묶는다"
 dhe_japan_control.12.c:0 "총독부도 긴축을 견뎌야 한다"
 dhe_tokyo_governor_12a_tt:0 "비용: 금 #n 75,000#!\n효과: 통제력 #p +8#!, 협력 엘리트 #p +8#!, 일본 저항도 #p -5#!"
 dhe_tokyo_governor_12b_tt:0 "비용: 금 #n 30,000#!\n효과: 통제력 #p +4#!, 협력 엘리트 #p +4#!, 일본 저항도 #p -2#!"
 dhe_tokyo_governor_12c_tt:0 "효과: 금 #p +25,000#!, 통제력 #n -4#!, 협력 엘리트 #n -4#!, 일본 저항도 #n +8#!"

 dhe_japan_control.13.t:0 "치안령 검토"
 dhe_japan_control.13.d:0 "일본 각지의 소요와 비밀 결사가 보고되었습니다. 총독부는 질서를 보여주어야 하지만, 너무 강한 압박은 새로운 저항의 명분이 될 수 있습니다."
 dhe_japan_control.13.f:0 "거리의 포고문은 조용했지만, 그 앞을 지나는 사람들의 눈은 조용하지 않았다."
 dhe_japan_control.13.a:0 "순찰과 검문을 강화한다"
 dhe_japan_control.13.b:0 "강경 치안령을 선포한다"
 dhe_japan_control.13.c:0 "사면과 회유를 병행한다"
 dhe_tokyo_governor_13a_tt:0 "효과: 통제력 #p +4#!, 협력 엘리트 #n -2#!, 일본 저항도 #p -10#!"
 dhe_tokyo_governor_13b_tt:0 "효과: 통제력 #p +2#!, 협력 엘리트 #n -10#!, 일본 저항도 #p -18#!\n부작용: 일본 급진파 증가, 장기 저항 상승 요인"
 dhe_tokyo_governor_13c_tt:0 "효과: 통제력 #n -2#!, 협력 엘리트 #p +8#!, 일본 저항도 #p -4#!"

 dhe_japan_control.14.t:0 "경제 통합 계획"
 dhe_japan_control.14.d:0 "철도, 항만, 금융망을 통해 일본 경제를 대한제국 시장에 묶는 계획이 제출되었습니다. 수익은 분명하지만, 누가 이익을 가져가는지가 통치의 성패를 가를 것입니다."
 dhe_japan_control.14.f:0 "포성이 멎은 뒤에도 장부와 철도 시간표는 오래 남았다."
 dhe_japan_control.14.a:0 "철도와 항만을 제국망에 편입한다"
 dhe_japan_control.14.b:0 "대한 자본의 수익을 우선한다"
 dhe_japan_control.14.c:0 "일본 현지 협력 상인을 끌어들인다"
 dhe_tokyo_governor_14a_tt:0 "비용: 금 #n 50,000#!\n효과: 통제력 #p +6#!, 협력 엘리트 #p +6#!, 일본 저항도 #p -4#!"
 dhe_tokyo_governor_14b_tt:0 "효과: 수입 보너스, 통제력 #p +4#!, 협력 엘리트 #n -4#!, 일본 저항도 #n +8#!"
 dhe_tokyo_governor_14c_tt:0 "효과: 통제력 #p +2#!, 협력 엘리트 #p +10#!, 일본 저항도 #p -6#!"

 dhe_japan_control.15.t:0 "교육·관료 정책"
 dhe_japan_control.15.d:0 "동경총독부는 일본 행정을 안정적으로 굴릴 관료를 필요로 합니다. 문제는 그들을 대한제국의 방식으로 길들일 것인지, 일본 현지 제도를 남겨둘 것인지입니다."
 dhe_japan_control.15.f:0 "교실의 칠판에는 두 언어가 적혔다. 어느 쪽이 미래가 될지는 아직 정해지지 않았다."
 dhe_japan_control.15.a:0 "협력 관료학교를 세운다"
 dhe_japan_control.15.b:0 "대한식 행정 언어를 강제한다"
 dhe_japan_control.15.c:0 "현지 제도를 일부 보존한다"
 dhe_tokyo_governor_15a_tt:0 "효과: 통제력 #p +4#!, 협력 엘리트 #p +8#!, 일본 저항도 #n +2#!, 혁신 보너스"
 dhe_tokyo_governor_15b_tt:0 "효과: 통제력 #p +8#!, 협력 엘리트 #p +4#!, 일본 저항도 #n +8#!"
 dhe_tokyo_governor_15c_tt:0 "효과: 통제력 #n -2#!, 협력 엘리트 #p +8#!, 일본 저항도 #p -4#!"

 dhe_japan_control.16.t:0 "동경 학생 시위"
 dhe_japan_control.16.d:0 "동경의 학생과 신문인들이 총독부의 통치를 비판하며 거리로 나섰습니다. 이들은 아직 무장하지 않았지만, 방치하면 더 넓은 저항의 상징이 될 수 있습니다."
 dhe_japan_control.16.f:0 "젊은 목소리는 작았지만, 돌벽에 부딪히자 의외로 멀리 울렸다."
 dhe_japan_control.16.a:0 "시위를 해산시킨다"
 dhe_japan_control.16.b:0 "대표단을 만나 회유한다"
 dhe_tokyo_governor_16a_tt:0 "효과: 일본 저항도 #p -8#!, 협력 엘리트 #n -5#!, 일본 급진파 증가"
 dhe_tokyo_governor_16b_tt:0 "효과: 일본 저항도 #p -3#!, 협력 엘리트 #p +6#!, 통제력 #n -2#!"

 dhe_japan_control.17.t:0 "협력 관료의 청원"
 dhe_japan_control.17.d:0 "일본 협력 관료들이 더 넓은 권한과 예산을 요구했습니다. 그들은 총독부가 일본 사회를 설득하려면 현지 얼굴이 필요하다고 주장합니다."
 dhe_japan_control.17.f:0 "그들은 굴복을 말하지 않았다. 대신 질서와 승진, 그리고 살아남는 법을 말했다."
 dhe_japan_control.17.a:0 "협력 관료를 전면에 세운다"
 dhe_japan_control.17.b:0 "총독부의 권위를 낮출 수 없다"
 dhe_tokyo_governor_17a_tt:0 "비용: 금 #n 20,000#!\n효과: 통제력 #p +4#!, 협력 엘리트 #p +8#!, 일본 저항도 #p -4#!"
 dhe_tokyo_governor_17b_tt:0 "효과: 통제력 #p +2#!, 협력 엘리트 #n -4#!, 일본 저항도 #n +3#!"

 dhe_japan_control.18.t:0 "총독부 부패 사건"
 dhe_japan_control.18.d:0 "총독부 산하 관리들이 일본 항만 사업 예산을 빼돌렸다는 보고가 올라왔습니다. 사건을 덮으면 당장의 체면은 지킬 수 있지만, 통치의 신뢰는 흔들릴 것입니다."
 dhe_japan_control.18.f:0 "장부의 숫자는 지워졌지만, 지워진 자리는 더 검게 남았다."
 dhe_japan_control.18.a:0 "감찰관을 파견한다"
 dhe_japan_control.18.b:0 "소란이 커지기 전에 덮는다"
 dhe_tokyo_governor_18a_tt:0 "비용: 금 #n 15,000#!\n효과: 통제력 #p +5#!, 협력 엘리트 #p +3#!, 일본 저항도 #p -2#!"
 dhe_tokyo_governor_18b_tt:0 "효과: 금 #p +10,000#!, 통제력 #n -5#!, 협력 엘리트 #n -3#!, 일본 저항도 #n +5#!"

 dhe_japan_control.19.t:0 "조약항 노동쟁의"
 dhe_japan_control.19.d:0 "조약항 노동자들이 임금과 치안 검문에 항의하며 작업을 멈췄습니다. 경제 통합은 총독부의 힘이지만, 그 현장에서는 충돌도 함께 자라고 있습니다."
 dhe_japan_control.19.f:0 "멈춰 선 부두에는 파도 소리만이 제 시간에 맞춰 움직였다."
 dhe_japan_control.19.a:0 "양보안을 제시한다"
 dhe_japan_control.19.b:0 "헌병대를 투입한다"
 dhe_tokyo_governor_19a_tt:0 "비용: 금 #n 25,000#!\n효과: 통제력 #p +3#!, 협력 엘리트 #p +4#!, 일본 저항도 #p -6#!"
 dhe_tokyo_governor_19b_tt:0 "효과: 통제력 #p +2#!, 협력 엘리트 #n -5#!, 일본 저항도 #p -4#!, 일본 급진파 증가"

 dhe_mod_tokyo_governor_general_orderly_rule:0 "정돈된 동경총독부 운영"
