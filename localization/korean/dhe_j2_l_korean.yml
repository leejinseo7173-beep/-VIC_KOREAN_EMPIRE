 dhe_progress_bar_gwangmu_desc:0 "광무 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_gwangmu_base_manual:0 "분야별 개혁과 황실의 결단"

 dhe_button_gwangmu_fund:0 "황실 비자금(내탕금) 투입"
 dhe_button_gwangmu_fund_desc:0 "하위 개혁을 달성하기 어렵다면, 황실의 비자금을 대거 방출하여 억지로라도 개혁에 속도를 붙일 수 있습니다. #n 국고가 텅 비겠지만#! 진척도가 오릅니다.\n\n효과: 진척도 #p +10#!\n비용: 국고 #n 50,000#!"
 dhe_button_gwangmu_mission:0 "구미(歐美) 시찰단 파견"
 dhe_button_gwangmu_mission_desc:0 "서양 열강의 선진 문물을 배우기 위해 대규모 특명전권대사들을 파견합니다. 국가의 행정력과 통제력이 소모되지만 개혁에 큰 보탬이 됩니다.\n\n효과: 진척도 #p +10#!\n비용: 권위 #n 100#!"
 dhe_button_gwangmu_start_mission:0 "#gold 수신사와 보빙사 파견 준비#!"
 dhe_button_gwangmu_start_mission_desc:0 "광무개혁 메인 일지에서 외국 시찰 사절단 일지를 시작합니다. 일본, 청국, 서구 열강을 직접 살피는 별도 일지가 열립니다.\n\n효과: #v 수신사와 보빙사#! 일지 시작\n비용: 국고 #n 10,000#!"

 dhe_tokyo_governor_naisen_ittai_goal_tt:0 "#gold 내선일체#!를 선포할 만큼 장기 안정 통치를 달성"
 dhe_tokyo_governor_naisen_ittai_goal_desc_tt:0 "동경총독부 안정도 #v 80#! 이상, 협력 엘리트 #v 70#! 이상, 일본 저항도 #v 40#! 미만 상태를 #v 20년#! 동안 연속 유지해야 합니다. 조건이 무너지면 누적 기간은 다시 #n 0개월#!로 돌아갑니다."
 dhe_tokyo_governor_integration_months:0 "내선일체 준비 기간"
 dhe_japan_control.20.t:0 "내선일체"
 dhe_japan_control.20.d:0 "20년에 걸친 안정 통치와 협력 관료망, 항만과 학교와 관청의 연결은 마침내 하나의 제국 질서로 굳어졌습니다. 일본의 명령문은 더 이상 외부에서 내려온 지시처럼 읽히지 않습니다. 동경총독부는 대한제국의 외곽 통치기관을 넘어, 제국 내부의 제도와 이해관계를 묶는 축이 되었습니다.\n\n한성은 이를 #gold 내선일체#!의 성립으로 선포했습니다."
 dhe_japan_control.20.f:0 "두 개의 바다는 여전히 따로 출렁였지만, 장부와 철도와 관청의 언어는 하나의 제국을 가리키고 있었다."
 dhe_japan_control.20.a:0 "제국의 질서가 열도에 뿌리내렸다"
 dhe_japan_control.21.t:0 "한국인 총독 파견"
 dhe_japan_control.21.d:0 "일본 정복의 조약문이 마르는 즉시, 한성은 다음 조치를 단행했습니다. 일본의 기존 막부와 천황 중심 통치 권위는 총독부 포고령 아래 물러났고, 대한제국이 임명한 한국인 총독이 동경으로 향했습니다.\n\n이제 일본 정부는 더 이상 옛 조정의 이름으로 움직이지 않습니다. 법률상 통치원리는 #gold 동경총독부 체제#!로 바뀌었고, 행정과 치안은 제국의 총독 아래 재편될 것입니다."
 dhe_japan_control.21.f:0 "총독의 임명장은 붉은 비단에 싸여 있었다. 동경에 도착한 순간, 그것은 한 나라의 헌정 질서를 접어 넣는 문서가 되었다."
 dhe_japan_control.21.a:0 "동경에 한국인 총독을 부임시켜라"
 dhe_mod_naisen_ittai_overlord:0 "내선일체"
 dhe_mod_naisen_ittai_overlord_desc:0 "동경총독부의 장기 안정화와 협력 엘리트 체계가 대한제국의 대일 통치 질서를 제국 내부의 제도처럼 굳혔습니다."
 dhe_mod_naisen_ittai_subject:0 "내선일체 체제"
 dhe_mod_naisen_ittai_subject_desc:0 "일본의 행정과 경제 엘리트는 동경총독부와 대한제국의 제도 안에서 자신의 지위를 찾기 시작했습니다."

 je_dhe_samjeong_reform_headquarters:0 "#gold 삼정이정청#!"
 je_dhe_samjeong_reform_headquarters_reason:0 "전정, 군정, 환곡은 따로 무너진 제도가 아닙니다. 토지를 숨긴 자가 군포를 빼돌리고, 환곡을 장부 놀이로 만든 자가 다시 백성의 분노를 키우고 있습니다.\n\n#gold 삼정이정청#!은 세 폐단을 한꺼번에 눌러 담는 상위 개혁 일지입니다. #v 전정 개혁 착수#!, #v 군정 개혁 착수#!, #v 환곡 개혁 착수#! 버튼으로 각 하위 일지를 열고, #v 삼정 감찰회의#!로 그해의 방침을 정하십시오. 민심 불안이 치솟으면 #v 비상 수습령#!으로 시간을 벌 수 있지만, 국고와 권위를 소모합니다.\n\n세율, 생활수준, 지주 권력, 주 혼란도, 관료제 적자, 개혁 방침이 매달 #n 민심 불안#!을 움직입니다. 세 개혁을 모두 끝내고 민심 불안을 #v 800#! 미만으로 낮추면 삼정이정청이 완수됩니다."
 je_dhe_samjeong_land_reform:0 "#gold 전정 개혁#!"
 je_dhe_samjeong_land_reform_reason:0 "토지대장과 실제 경작지는 이미 서로 다른 나라의 문서처럼 어긋나 있습니다. 은결을 숨긴 향촌 토호와 부패한 수령을 누르지 못하면, 조정의 조세 기반은 계속 말라붙을 것입니다."
 je_dhe_samjeong_military_reform:0 "#gold 군정 개혁#!"
 je_dhe_samjeong_military_reform_reason:0 "군포와 군영 급료 문제는 병졸과 백성 모두의 불만을 키우고 있습니다. 군정의 장부를 바로잡지 못하면, 조정의 칼은 안에서 먼저 녹슬 것입니다."
 je_dhe_samjeong_granary_reform:0 "#gold 환곡 개혁#!"
 je_dhe_samjeong_granary_reform_reason:0 "굶주린 백성을 구휼해야 할 환곡은 어느새 지방 수령과 토호의 고리대 장부가 되었습니다. 환곡창을 바로잡지 못하면, 구휼은 다시 수탈의 이름이 될 것입니다."
 je_dhe_samjeong_status_idle:0 "감찰 방침이 비어 있습니다. 방침 부재가 길어질수록 민심 불안이 매달 오릅니다."
 je_dhe_samjeong_status_focused:0 "삼정이정청이 올해의 감찰 방침에 따라 움직이고 있습니다. 방침은 개혁을 직접 완료하지 않지만 민심의 방향을 크게 바꿉니다."
 je_dhe_samjeong_status_danger:0 "#n 민심 불안이 위험 수위입니다.#! 불안이 #v 1000#!에 도달하면 삼정이정청이 붕괴합니다."

 dhe_button_samjeong_start_land:0 "전정 개혁 착수"
 dhe_button_samjeong_start_land_desc:0 "전정 개혁 회의를 열어 양전과 토지대장 대조 방식을 정하고, 전정 개혁 일지를 시작합니다."
 dhe_button_samjeong_start_land_tt:0 "#P 전정 개혁 착수 회의가 열립니다.#!\n#v 암행 감찰, 향촌 대조, 양전청 실측 중 하나를 선택합니다.#!"
 dhe_button_samjeong_start_military:0 "군정 개혁 착수"
 dhe_button_samjeong_start_military_desc:0 "군정 개혁 회의를 열어 군포 장부와 군영 급료 문제의 처리 방식을 정하고, 군정 개혁 일지를 시작합니다."
 dhe_button_samjeong_start_military_tt:0 "#P 군정 개혁 착수 회의가 열립니다.#!\n#v 군영 감사, 급료 수습, 호포 공론 중 하나를 선택합니다.#!"
 dhe_button_samjeong_start_granary:0 "환곡 개혁 착수"
 dhe_button_samjeong_start_granary_desc:0 "환곡 개혁 회의를 열어 환곡창과 지방 장부의 처리 방식을 정하고, 환곡 개혁 일지를 시작합니다."
 dhe_button_samjeong_start_granary_tt:0 "#P 환곡 개혁 착수 회의가 열립니다.#!\n#v 창고 압수, 환곡 탕감, 사창 시범 중 하나를 선택합니다.#!"
 dhe_button_samjeong_council:0 "삼정 감찰회의 소집"
 dhe_button_samjeong_council_desc:0 "호조, 병조, 사헌부의 보고를 모아 올해의 삼정개혁 방침을 정합니다. 회의는 #v 1년에 한 번#! 열 수 있으며, 진행도를 직접 올리지는 않습니다. 대신 민심 불안의 월간 방향과 정치적 비용을 바꿉니다."
 dhe_button_samjeong_emergency_relief:0 "비상 수습령"
 dhe_button_samjeong_emergency_relief_desc:0 "민심 불안이 위험 수위에 올랐을 때, 국고와 권위를 태워 급한 불을 끕니다. 개혁을 완성하지는 못하지만 임오의 폭발을 늦출 수 있습니다."
 dhe_button_samjeong_emergency_relief_tt:0 "#P 민심 불안 -200#!\n#N 권위 -50, 국고 -25,000#!\n#P 급진파 감소#!"

