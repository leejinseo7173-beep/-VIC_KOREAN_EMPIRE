 dhe_japanese_governor_general_status_secure:0 "#p 총독부가 안정적으로 작동하고 있습니다.#! 일본 행정망과 경제망은 대한제국의 지시에 따라 움직입니다."
 dhe_japanese_governor_general_status_unrest:0 "#n 일본 내 저항이 위험 수준입니다.#! 치안과 경제 회유를 병행하지 않으면 총독부 운영이 흔들릴 수 있습니다."
 dhe_japanese_governor_general_status_operating:0 "#v 동경총독부 운영 중#!입니다. 총독 회의, 예산안, 치안령, 경제 통합, 교육·관료 정책을 조합해 통제력과 협력 엘리트를 유지하십시오."
