l_korean:
 # ====================================================================
 # [0] 폭풍 전야 일지 및 디버프 모디파이어
 # ====================================================================
 je_dhe_hermit_kingdom:0 "#v 조용한 은자의 나라#!"
 je_dhe_hermit_kingdom_reason:0 "조선은 수백 년간 외부의 거친 파도를 피하며 평화로운 고립을 유지해왔습니다. 겉보기엔 그 어느 때보다 고요하지만, 무언가 불길한 폭풍이 다가오고 있습니다..."
 dhe_hermit_timer_tt:0 "#v 1836년 2월 1일#!이 되면 기나긴 평화가 깨집니다."

 modifier_sedo_politics:0 "세도정치 (勢道政治)"
 modifier_sedo_politics_desc:0 "소수의 외척 가문이 국가의 모든 권력을 독점하고 있습니다. 왕권은 허수아비로 전락했고, 매관매직이 판을 치며, 썩어빠진 조정은 세상이 바뀌는 것도 모른 채 권력 투쟁에만 몰두하고 있습니다."
 
 modifier_samjeong_corruption:0 "삼정의 문란 (三政紊亂)"
 modifier_samjeong_corruption_desc:0 "전정, 군정, 환곡이라는 국가의 세 가지 근본 제도가 탐관오리와 향촌 토호의 수탈로 완전히 붕괴되었습니다. 조세 장부는 거짓말이 되었고, 군포는 백성의 목을 조이며, 환곡은 구휼이 아니라 고리대가 되었습니다. 국가는 세금을 걷지 못하고 행정은 마비되며, 민심은 굶주림과 분노 속에서 무너지고 있습니다."
 dhe_mod_samjeong_unrest_low:0 "삼정 불안: 낮은 동요"
 dhe_mod_samjeong_unrest_low_desc:0 "삼정의 폐단이 아직은 소요로 번지지 않았지만, 향촌의 원망이 조정의 명분을 조금씩 갉아먹고 있습니다."
 dhe_mod_samjeong_unrest_high:0 "삼정 불안: 확산되는 원망"
 dhe_mod_samjeong_unrest_high_desc:0 "세율, 환곡, 군역 문제가 서로 얽히며 지방 행정과 민심을 흔들고 있습니다."
 dhe_mod_samjeong_unrest_severe:0 "삼정 불안: 민란 직전"
 dhe_mod_samjeong_unrest_severe_desc:0 "민심이 폭발 직전입니다. 세금과 환곡, 군역의 부담을 낮추지 못하면 개혁 관청은 거리의 분노에 압도될 것입니다."
 dhe_mod_samjeong_land_disorder:0 "전정 문란"
 dhe_mod_samjeong_land_disorder_desc:0 "은결, 허결, 부실 장부가 조세 징수와 행정력을 갉아먹고 있습니다."
 dhe_mod_samjeong_military_disorder:0 "군정 문란"
 dhe_mod_samjeong_military_disorder_desc:0 "군포 장부와 군영 급료 문제가 군사 행정과 군부의 신뢰를 해치고 있습니다."
 dhe_mod_samjeong_granary_disorder:0 "환곡 문란"
 dhe_mod_samjeong_granary_disorder_desc:0 "환곡창은 구휼보다 고리대의 장부로 보이고 있으며, 농촌 민심이 빠르게 식고 있습니다."
 dhe_mod_samjeong_land_hardline:0 "강행 양전"
 dhe_mod_samjeong_land_hardline_desc:0 "토지를 다시 재고 숨은 결수를 찾아 조세 기반을 회복하려 하지만, 향촌 양반의 반발과 행정 부담이 커졌습니다."
 dhe_mod_samjeong_land_compromise:0 "향촌 장부 대조"
 dhe_mod_samjeong_land_compromise_desc:0 "지방 사족과 타협하며 장부를 맞추는 온건한 전정 개혁입니다."
 dhe_mod_samjeong_land_modern_audit:0 "개화 관료 실측"
 dhe_mod_samjeong_land_modern_audit_desc:0 "새로운 행정 지식과 실측 방식을 끌어들였지만, 당장의 관료 부담이 커졌습니다."
 dhe_mod_samjeong_military_audit:0 "군영 장부 감사"
 dhe_mod_samjeong_military_audit_desc:0 "군영 장부를 봉인하고 급료와 군포의 흐름을 추적하고 있습니다."
 dhe_mod_samjeong_military_salary:0 "군영 급료 수습"
 dhe_mod_samjeong_military_salary_desc:0 "밀린 급료를 지급해 군심을 붙잡고 있지만, 군비 부담은 더 커졌습니다."
 dhe_mod_samjeong_military_hopo:0 "호포 공론"
 dhe_mod_samjeong_military_hopo_desc:0 "군역 부담을 넓히려는 논의가 시작되어 양반층의 반발이 커졌습니다."
 dhe_mod_samjeong_granary_seizure:0 "환곡창 장부 압수"
 dhe_mod_samjeong_granary_seizure_desc:0 "부패한 환곡 장부를 압수하고 창고 실태를 조사하고 있습니다."
 dhe_mod_samjeong_granary_debt_relief:0 "환곡 탕감"
 dhe_mod_samjeong_granary_debt_relief_desc:0 "백성의 고리 환곡을 덜어 민심을 달래고 있지만, 국고 부담이 뒤따릅니다."
 dhe_mod_samjeong_granary_sachang:0 "사창 시범"
 dhe_mod_samjeong_granary_sachang_desc:0 "향촌 단위의 구휼 창고를 시범 운영해 중앙과 지방 사이의 완충 장치를 만들고 있습니다."

 # ====================================================================
 # [1] 프롤로그 이벤트 텍스트
 # ====================================================================
 dhe_event.100.t:0 "망국의 전조: 세도와 문란"
 dhe_event.100.d:0 "전하, 조선의 산천이 피눈물을 흘리고 있습니다! 안동 김씨를 비롯한 외척 가문들이 조정을 장악하여 왕권을 철저히 능멸하고 있으며, 지방의 탐관오리들은 삼정의 문란을 빌미로 백성들의 마지막 고혈까지 쥐어짜고 있습니다. 이대로라면 이 나라는 안에서부터 썩어문드러져 머지않아 무너지고 말 것입니다!"
 dhe_event.100.f:0 "민심은 극도로 흉흉하며, 도처에서 농민들이 횃불을 들고 일어날 것이라는 소문이 돌고 있다."
 dhe_event.100.a:0 "과인이 직접 이 썩어빠진 적폐들을 도려내겠노라!"

 dhe_event.101.t:0 "여명의 아침"
 dhe_event.101.d:0 "기나긴 어둠이 걷히고 마침내 새로운 아침이 밝았습니다! 국정을 농단하던 외척 세력은 권좌에서 쫓겨나 처벌받았고, 백성들의 피를 빨아먹던 악법들은 모두 혁파되었습니다. 비로소 국가의 기틀이 바로잡혔으니, 이제 조선은 낡은 허물을 벗고 스스로의 운명을 웅대하게 개척할 준비가 되었습니다."
 dhe_event.101.f:0 "새로운 시대의 거센 바람이 반도에 불어오고 있다."
 dhe_event.101.a:0 "이제, 우리는 제국(帝國)으로 나아갈 것이다."

 dhe_event.102.t:0 "개혁 교서의 초안"
 dhe_event.102.d:0 "세도 가문과 지방 수령들이 조정을 갉아먹는 동안, 조정 내부의 일부 관료들은 더 이상 침묵만으로 나라를 보전할 수 없다고 판단했습니다.\n\n비변사와 호조, 사헌부의 개혁 성향 관원들은 각 도의 조세 장부를 다시 대조하고, 군포와 환곡의 폐단을 조사할 비밀 감찰망을 꾸리기 시작했습니다. 아직 공개적으로 세도 가문과 맞설 힘은 부족하지만, 개혁의 첫 문서는 이미 붓끝에서 완성되고 있습니다.\n\n이제 조선의 개혁은 한 사람의 기지나 예언이 아니라, 무너진 국가 기구를 다시 움직이려는 조정 전체의 위험한 결단에서 시작됩니다."
 dhe_event.102.f:0 "\"장부를 바로잡지 못하면 백성을 얻을 수 없고, 백성을 얻지 못하면 나라 또한 없다.\""
 dhe_event.102.a:0 "감찰망을 정비하고 개혁 교서를 준비하라."
 
 modifier_dhe_hidden_claws:0 "개혁 교서의 준비"
 modifier_dhe_hidden_claws_desc:0 "조정 내부의 개혁 관료들이 비밀 감찰망과 조세 장부 정비안을 준비하고 있습니다. 아직 공개적인 개혁은 위험하지만, 국가 기강을 바로세울 초석은 마련되고 있습니다."

 # ====================================================================
 # [2] 일지 이름 및 기본 UI 텍스트
 # ====================================================================
 je_dhe_save_joseon:0 "#n 도탄에 빠진 왕조#!"
 je_dhe_save_joseon_reason:0 "조선을 갉아먹는 #n 세도정치#!와 #n 삼정의 문란#!을 모두 타파해야만 새로운 시대로 나아갈 수 있습니다."
 
 je_dhe_sedo_politics_reform:0 "#gold 세도정치 타파#!"
 je_dhe_sedo_politics_reform_reason:0 "부패한 세도 가문들에게서 #gold 왕권#!을 되찾고 국가 기강을 바로잡아야 합니다."
 je_dhe_sedo_politics_reform_progress:0 "현재 #gold 왕권의 위엄#!을 회복하고 있습니다."

 
 

 # ====================================================================
 # [3] 전정의 문란 / 군정 / 환곡 상세 텍스트
 # ====================================================================

 

 dhe_progress_bar_royal_authority:0 "왕권(王權)의 위엄"
 dhe_progress_bar_royal_authority_desc:0 "왕권 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_royal_auth_base:0 "기본 왕권 약화"
 dhe_royal_auth_landowners_high:0 "강력한 양반 세력의 횡포"
 dhe_royal_auth_landowners_low:0 "지주 세력 약화로 인한 왕권 회복"
 dhe_royal_auth_bureaucracy_good:0 "국가 행정망 정상화"



 dhe_button_purge_corrupt_officials:0 "탐관오리 숙청"
 dhe_button_purge_corrupt_officials_desc:0 "매관매직을 일삼고 백성의 고혈을 짜내는 탐관오리들을 엄벌에 처합니다. 비록 부패한 기득권 관료들의 거센 반발이 뒤따르겠지만, 땅에 떨어진 왕실의 위엄을 바로세우기 위해서는 반드시 필요한 결단입니다."
 
 dhe_button_abolish_seowon:0 "서원 철폐"
 dhe_button_abolish_seowon_desc:0 "면세 특권을 누리며 국가 재정을 좀먹고 붕당의 온상이 된 서원들을 대대적으로 헐어버립니다. 양반 유생들의 극렬한 저항과 상소가 빗발치겠으나, 이는 세도정치의 뿌리를 뽑고 왕권을 강화할 가장 강력한 초석이 될 것입니다."
 dhe_button_1_year_cooldown_tt:0 "#bold 이 결단은 실행 후 1년(365일)이 지나야 다시 사용할 수 있습니다. #!"

 
 

 
 

 concept_dhe_sedo_reform_done:0 "왕권의 위엄 확립"
 concept_dhe_sedo_reform_done_desc:0 "일지 창에 있는 #Y '왕권의 위엄'#! 진행도를 100까지 채워야 합니다."
 concept_dhe_save_joseon_done:0 "도탄에 빠진 왕조 구원"
 concept_dhe_save_joseon_done_desc:0 "세도정치 타파 및 삼정의 문란(전정, 군정, 환곡) 일지를 모두 해결해야 합니다."
 concept_dhe_jeonjeong_done:0 "전정(田政)의 문란 타파"
 concept_dhe_jeonjeong_done_desc:0 "#Y 전통주의#!와 #Y 토지 기반 조세#! 법률을 모두 폐지해야 합니다."
 concept_dhe_gunjeong_done:0 "군정(軍政)의 문란 타파"
 concept_dhe_gunjeong_done_desc:0 "#Y 농민 징집병#! 법률을 폐지해야 합니다."
 concept_dhe_hwangok_done:0 "환곡(還穀)의 문란 타파"
 concept_dhe_hwangok_done_desc:0 "#Y 전통주의#! 법률을 폐지하고, #Y 경찰 기관#!과 #Y 학교 기관#!을 각각 2단계 이상 투자해야 합니다."

 dhe_royal_authority_max_tt:0 "[concept_dhe_sedo_reform_done] 달성"
 dhe_royal_authority_max_desc_tt:0 "부패한 세도 가문들을 몰아내고 진정한 개혁을 시작하기 위해서는, 탐관오리 숙청과 서원 철폐 등을 통해 왕실의 권위를 100까지 완벽하게 회복해야 합니다."

 je_dhe_save_joseon_done_tt:0 "[concept_dhe_save_joseon_done] 달성"
 je_dhe_save_joseon_done_desc_tt:0 "조선을 병들게 했던 4가지 근본적인 악폐습을 모두 끊어내고 국가의 기틀을 다시 세워야 합니다."
 je_dhe_jeonjeong_done_tt:0 "[concept_dhe_jeonjeong_done] 달성"
 je_dhe_jeonjeong_done_desc_tt:0 "토지 제도를 근대화하여 양반 지주들의 탈세를 막고, 백성들의 세금 부담을 공정하게 개편해야 합니다."
 je_dhe_gunjeong_done_tt:0 "[concept_dhe_gunjeong_done] 달성"
 je_dhe_gunjeong_done_desc_tt:0 "죽은 자와 어린아이에게까지 군포를 징수하는 끔찍한 제도를 철폐하고 근대적인 군사 제도를 도입해야 합니다."
 je_dhe_hwangok_done_tt:0 "[concept_dhe_hwangok_done] 달성"
 je_dhe_hwangok_done_desc_tt:0 "고리대금업으로 전락한 빈민 구제 제도를 혁파하고, 국가의 치안과 교육망을 확충하여 무너진 행정력을 정상화해야 합니다."

 je_dhe_req_sedo_tt:0 "#Y [concept_dhe_sedo_reform_done]#! 일지 완료"
 je_dhe_req_sedo_desc_tt:0 "세도정치 타파 일지를 성공적으로 완수하여 부패한 가문들을 몰아내야 합니다."
 je_dhe_req_jeonjeong_tt:0 "#Y [concept_dhe_jeonjeong_done]#! 일지 완료"
 je_dhe_req_jeonjeong_desc_tt:0 "전정의 문란 일지를 완수하여 토지 제도를 개혁해야 합니다."
 je_dhe_req_gunjeong_tt:0 "#Y [concept_dhe_gunjeong_done]#! 일지 완료"
 je_dhe_req_gunjeong_desc_tt:0 "군정의 문란 일지를 완수하여 군포 제도를 철폐해야 합니다."
 je_dhe_req_hwangok_tt:0 "#Y [concept_dhe_hwangok_done]#! 일지 완료"
 je_dhe_req_hwangok_desc_tt:0 "환곡의 문란 일지를 완수하여 빈민 구제 제도를 정상화해야 합니다."

 dhe_trait_visionary:0 "개혁 감각"
 dhe_trait_visionary_desc:0 "낡은 제도 속에서도 국가가 나아가야 할 방향을 읽어내는 감각을 지녔습니다."
 dhe_trait_precocious_mastermind:0 "정무 조율가"
 dhe_trait_precocious_mastermind_desc:0 "복잡한 조정 정치 속에서 각 파벌의 이해관계를 조율하고 개혁안을 통과시키는 데 능합니다."
 dhe_trait_cold_blooded_monarch:0 "엄정한 통치자"
 dhe_trait_cold_blooded_monarch_desc:0 "국가 기강을 바로세우기 위해 필요하다면 부패한 기득권에도 엄정하게 맞섭니다."
 dhe_trait_master_of_deception:0 "정국 관리의 달인"
 dhe_trait_master_of_deception_desc:0 "외척, 관료, 지방 세력 사이의 미묘한 균형을 읽고 정국을 안정적으로 관리할 줄 압니다."





 lawgroup_dhe_social_order:0 "사회질서"
 law_hwangok_system:0 "환곡"
 law_hwangok_system_desc:0 "춘궁기에 곡식을 빌려주고 추수 뒤 거두어들이는 조선식 구휼 제도입니다. 원래는 빈민을 구제하기 위한 장치였지만, 지방 행정이 무너지면 쉽게 고리대와 수탈의 도구로 변질됩니다."
 law_dhe_confucian_absolutism:0 "유교적 전제정"
 law_dhe_confucian_absolutism_desc:0 "군왕이 천명과 유교적 명분을 바탕으로 국정을 직접 장악하는 통치 체제입니다. 강한 왕권과 국가 권위는 유지되지만, 신분 질서와 경전 중심의 정치가 새로운 지식과 대외 변화를 받아들이는 속도를 늦춥니다."
 amendment_dhe_sedo_politics:0 "세도정치"
 amendment_dhe_sedo_politics_desc:0 "외척과 유력 가문이 조정 인사와 재정을 장악하고, 국왕의 권위를 사사로운 청탁과 매관매직의 껍데기로 만드는 증보입니다."
 law_dhe_loose_social_order:0 "느슨한 사회질서"
 law_dhe_loose_social_order_desc:0 "법전상의 신분 질서는 남아 있으나, 현실의 향촌 사회에서는 돈과 연줄이 신분의 경계를 흐리게 만들고 있습니다. 이 느슨함은 일부 이동성을 만들지만, 국가 장부와 관료 질서를 혼탁하게 합니다."
 amendment_dhe_gongmyeongcheop:0 "공명첩"
 amendment_dhe_gongmyeongcheop_desc:0 "공명첩과 관직 매매가 사실상 제도화되어 돈으로 명예와 면책을 사는 길이 넓어졌습니다. 국가 재정에는 당장의 숨통이 트일지 몰라도, 교육과 관료제, 조세 장부의 신뢰는 빠르게 무너집니다."
 amendment_dhe_anti_christian_persecution:0 "가혹한 반기독교법"
 amendment_dhe_anti_christian_persecution_desc:0 "서학과 기독교를 국가 질서를 위협하는 사학으로 규정하고 엄격히 탄압하는 증보입니다. 국교와 유생 세력의 권위는 강화되지만, 비국교 신앙을 가진 백성은 임금과 안전에서 가혹한 불이익을 받습니다."
 law_dhe_peasant_corvee_service:0 "소작농 부역"
 law_dhe_peasant_corvee_service_desc:0 "소작농과 하층민에게 군역과 부역 부담을 집중시키는 전근대적 군제입니다. 국가는 적은 비용으로 병역을 동원할 수 있지만, 군사 훈련은 빈약하고 농촌의 삶은 더욱 무거워집니다."
 amendment_dhe_military_service_disorder:0 "군역의 문란"
 amendment_dhe_military_service_disorder_desc:0 "군포와 군역 장부가 무너져 죽은 자와 어린아이에게까지 부담이 전가되는 증보입니다. 징집 명목은 남았지만 실제 군사력은 약화되고, 하층민의 삶은 병역 부담으로 짓눌립니다."
 law_dhe_righteous_army:0 "의병"
 law_dhe_righteous_army_desc:0 "중앙의 상비군보다 향촌과 의리, 지역 방위를 중심으로 병력을 모으는 체제입니다. 본토 방어에는 강한 결속력을 보이지만, 장기 원정과 근대적 군제 운용에는 한계가 있습니다."
 law_dhe_seclusion_policy:0 "쇄국"
 law_dhe_seclusion_policy_desc:0 "외국 상인과 사절의 출입을 엄격히 막고, 국가가 허락한 제한적 통로만 남기는 폐쇄적 대외 질서입니다. 외압 저항과 내부 통제에는 유리하지만, 교역과 기술 유입, 적극적 대외 정책은 크게 제약됩니다."
 law_dhe_tenant_farming_order:0 "소작인"
 law_dhe_tenant_farming_order_desc:0 "토지는 양반 지주와 향촌 토호에게 집중되고, 농민 다수는 소작료와 각종 부담을 지는 소작인으로 남아 있습니다. 향촌 질서는 안정되어 보이지만, 하층민의 생활 기반은 취약합니다."
 amendment_dhe_jeonjeong_disorder:0 "전정의 문란"
 amendment_dhe_jeonjeong_disorder_desc:0 "은결과 허결, 부실 장부가 뒤섞여 토지세가 제대로 걷히지 않는 증보입니다. 국고는 비고 행정은 흔들리지만, 부담은 결국 힘없는 소작농과 하층민에게 전가됩니다."
 amendment_dhe_hwangok_disorder:0 "환곡의 문란"
 amendment_dhe_hwangok_disorder_desc:0 "구휼 제도가 지방 토호와 향리의 고리대 장부로 변질된 증보입니다. 복지라는 이름은 남았지만, 실제로는 구제받는 백성의 삶마저 갉아먹습니다."
 law_dhe_forbidden_appeals:0 "이의엄금"
 law_dhe_forbidden_appeals_desc:0 "상소와 청원, 비판을 질서 문란으로 간주해 엄격히 통제하는 언론 질서입니다. 조정은 불온한 목소리를 쉽게 누를 수 있지만, 새로운 사상과 민심의 경고 또한 함께 차단됩니다."
 law_dhe_gwageo_bureaucracy:0 "과거 관료제"
 law_dhe_gwageo_bureaucracy_desc:0 "문벌과 혈통이 여전히 큰 힘을 갖지만, 국가가 주관하는 과거 시험을 통해 유학적 소양을 갖춘 인재를 등용하는 조선식 관료제입니다. 성균관과 향교를 거친 유생 관료들은 행정과 조세 장부를 떠받치지만, 경전 중심의 선발 체계는 새로운 학문과 기술의 수용을 더디게 만듭니다."
 law_dhe_seowon_education:0 "성균관·서원 교육"
 law_dhe_seowon_education_desc:0 "성균관과 지방 서원을 중심으로 유교 경전과 관료 교육을 제공하는 전통 교육 체계입니다. 지식인층의 정치적 기반을 키우지만, 교육 기회는 여전히 양반과 향촌 유생에게 크게 치우쳐 있습니다."
 law_dhe_hyangyak_policing:0 "향약 치안"
 law_dhe_hyangyak_policing_desc:0 "향약과 향촌 자치 질서를 통해 마을 단위의 치안을 유지하는 제도입니다. 지방 소요를 누그러뜨리는 데에는 도움이 되지만, 토호와 유생의 사적 권위가 공권력 위에 군림하기 쉽습니다."
 law_dhe_sadae_gyorin_trade:0 "사대교린 무역질서"
 law_dhe_sadae_gyorin_trade_desc:0 "중화 질서와 제한적 교린 관계를 바탕으로 외교와 무역을 엄격히 통제하는 전통적 대외 질서입니다. 국가 권위와 외압 저항에는 유리하지만, 기술 유입과 교역 규모는 크게 제한됩니다."
 law_dhe_hullyeondogam_army:0 "훈련도감 군제"
 law_dhe_hullyeondogam_army_desc:0 "임진왜란 이후 편성된 훈련도감의 전통을 바탕으로, 중앙의 상비군과 지방 군역을 병행하는 과도기적 군제입니다. 순수 농민 징집병보다는 정예화되었으나, 아직 근대적 국민군에는 미치지 못합니다."
 law_dhe_imperial_ikmunsa:0 "제국익문사"
 law_dhe_imperial_ikmunsa_desc:0 "황제 직속의 비밀 정보기관인 제국익문사는 궁궐과 군부, 관료망, 해외 공관의 보고를 하나로 묶어 반역과 불온 사상을 사전에 색출합니다. 이 은밀한 감시망은 제국의 권위와 정권 안정을 크게 강화하지만, 지식인과 개혁파에게는 숨 막히는 공포로 다가옵니다."
 dhe_ikmunsa_requires_empire_tt:0 "#bold 대한제국#!이 선포되어야 합니다."
 dhe_ikmunsa_requires_central_archives_tt:0 "#bold 중앙 기록 보관소#! 기술을 연구해야 합니다."

 



 # ====================================================================
 # [4] 초기 북방 영토 수복 (간도, 연해주 13거점, 마스터 일지)
 # ====================================================================
 dhe_ambition.1.t:0 "북벌(北伐)의 서막"
 dhe_ambition.1.d:0 "수백 년 전, 철령 이북의 땅을 눈앞에 두고 회군해야 했던 역사의 한이 마침내 풀릴 때가 왔습니다.\n\n황제 폐하께서는 옥좌에서 일어나 북방을 가리키며 잃어버린 고구려와 발해의 옛 영토를 수복할 것을 천명하셨습니다. 대청제국은 늙고 병들어 더 이상 북방의 국경을 통제하지 못하고 있습니다. 지금이야말로 무장 개척단과 제국군을 파견하여 압록강과 두만강 너머로 우리의 국경을 밀어 올릴 완벽한 기회입니다!"
 dhe_ambition.1.f:0 "\"저 굽이치는 압록과 두만의 푸른 물결 너머, 잃어버린 옛 땅이 우리를 부르고 있다.\""
 dhe_ambition.1.a:0 "제국의 진군은 결코 멈추지 않을 것이다!"

 je_dhe_manchuria_rivalry:0 "#gold 만주 영향력 경쟁#!"
 je_dhe_manchuria_rivalry_reason:0 "독립을 쟁취했지만 #gold 북방#!의 길은 아직 열리지 않았습니다. 만주는 여전히 #n 대청제국#!의 행정망과 군사적 위신 아래 놓여 있으며, 섣부른 북진은 외교적 고립과 국경 충돌을 부를 것입니다.\n\n국경 정찰망, 이주 기반, 변방 관리와의 비공식 접촉을 차근차근 넓혀 청나라의 만주 장악력을 흔들어야 합니다. 영향력 경쟁에서 #p 우위#!를 확보하면 황실은 마침내 북방 경영을 선포할 수 있습니다."
 dhe_progress_bar_manchuria_rivalry:0 "만주 경쟁"
 dhe_progress_bar_manchuria_rivalry_desc:0 "영향력 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_manchuria_widget_tt:0 "만주 영향력 경쟁은 한 줄의 점수바로 표시됩니다. 왼쪽은 대한의 북방 진출, 오른쪽은 청나라의 기존 질서를 뜻합니다."
 dhe_manchuria_widget_korea:0 "대한제국"
 dhe_manchuria_widget_korea_desc:0 "정탐망, 이주망, 변방 관리를 통해 주도권을 넓힙니다."
 dhe_manchuria_widget_frontier:0 "압록강과 두만강"
 dhe_manchuria_widget_frontier_desc:0 "두 제국의 시선이 만주 변경에서 맞부딪힙니다."
 dhe_manchuria_widget_qing:0 "대청제국"
 dhe_manchuria_widget_qing_desc:0 "관헌, 변경군, 조정의 위신으로 북방 질서를 붙잡습니다."
 dhe_manchuria_influence_korea_victory_tt:0 "만주 영향력 경쟁에서 조선이 우위를 확보해야 합니다."
 dhe_manchuria_inf_qing_pressure:0 "청나라의 국경 통제와 외교 압박"
 dhe_manchuria_inf_qing_garrisons:0 "청나라 변경군의 국경 단속"
 dhe_manchuria_inf_qing_court:0 "청 조정의 안정된 북방 정책"
 dhe_manchuria_inf_qing_bureaucrats:0 "청나라 관헌의 행정 장악"
 dhe_manchuria_inf_qing_hostility:0 "청나라의 적대적 단속 강화"
 dhe_manchuria_inf_qing_alarm:0 "청나라의 변경 경계 태세"
 dhe_manchuria_inf_scout_network:0 "조선 국경 정탐망"
 dhe_manchuria_inf_settlement_network:0 "조선계 변경 이주망"
 dhe_manchuria_inf_official_network:0 "회유된 변방 관리"
 dhe_manchuria_inf_border_army:0 "국경 주둔군의 존재감"
 dhe_manchuria_inf_army_dominance:0 "근대화된 군사력의 위압"
 dhe_manchuria_inf_administration:0 "확장된 행정망"
 dhe_manchuria_inf_qing_civil_war:0 "대청제국의 내전"
 dhe_manchuria_inf_qing_at_war:0 "대청제국의 대외 전쟁"
 dhe_button_manchuria_scouts:0 "국경 정탐대 파견"
 dhe_button_manchuria_scouts_desc:0 "압록강과 두만강 너머로 정탐대를 보내 청나라 초소, 관문, 이주로를 조사합니다. 실행하면 정탐 작전의 강도를 선택하는 사건이 발생합니다."
 dhe_button_manchuria_settlers:0 "변경 이주망 구축"
 dhe_button_manchuria_settlers_desc:0 "상인, 포수, 개척민을 연결하는 비공식 이주망을 지원해 만주 변경에 조선계 촌락과 보급 거점을 늘립니다. 실행하면 이주 지원 방식을 선택하는 사건이 발생합니다."
 dhe_button_manchuria_officials:0 "변방 관리 회유"
 dhe_button_manchuria_officials_desc:0 "청나라의 변방 관리와 토착 유력자를 은밀히 회유해 국경 단속을 느슨하게 만들고, 만주 내부의 정보망을 확보합니다. 실행하면 회유 방식을 선택하는 사건이 발생합니다."
 dhe_manchuria_influence_resolved_tt:0 "만주 영향력 경쟁 일지를 완료해야 합니다."

 dhe_manchuria_rivalry.1.t:0 "두 강 너머의 그림자"
 dhe_manchuria_rivalry.1.d:0 "압록강과 두만강 건너편에서 청나라 초소의 교대 시간, 산길의 통행량, 조선계 촌락의 위치를 적은 보고서가 올라왔습니다. 정탐망은 아직 가늘지만, 제대로 엮어낸다면 만주 국경 전체를 꿰뚫어 볼 수 있을 것입니다."
 dhe_manchuria_rivalry.1.f:0 "\"강 건너 불빛은 멀어 보였으나, 그곳의 말소리는 밤바람을 타고 우리 귀에 닿았다.\""
 dhe_manchuria_rivalry.1.a:0 "조심스럽게 길을 열어라."
 dhe_manchuria_rivalry.1.b:0 "더 깊이 침투시켜라."
 dhe_manchuria_rivalry.2.t:0 "변경으로 향하는 행렬"
 dhe_manchuria_rivalry.2.d:0 "상인, 포수, 농민, 몰락 양반의 차남들이 북쪽 길목에 모이고 있습니다. 그들에게 필요한 것은 깃발이 아니라 씨앗, 소금, 약간의 은화, 그리고 돌아오지 않아도 된다는 조정의 침묵입니다."
 dhe_manchuria_rivalry.2.f:0 "\"새 땅은 국경선으로 얻는 것이 아니라, 먼저 밥 짓는 연기로 얻는다.\""
 dhe_manchuria_rivalry.2.a:0 "상단과 개척민을 지원하라."
 dhe_manchuria_rivalry.2.b:0 "무장 개척단까지 섞어 보내라."
 dhe_manchuria_rivalry.3.t:0 "은화와 봉인의 밤"
 dhe_manchuria_rivalry.3.d:0 "청나라 변방 관헌 일부가 우리 사신과 비밀리에 접촉했습니다. 어떤 자는 돈을 원하고, 어떤 자는 보호를 원하며, 어떤 자는 다가올 혼란에서 살아남을 뒷문을 원합니다."
 dhe_manchuria_rivalry.3.f:0 "\"관문은 쇠로 잠그지만, 열쇠는 대개 사람의 품속에 있다.\""
 dhe_manchuria_rivalry.3.a:0 "돈으로 문을 열어라."
 dhe_manchuria_rivalry.3.b:0 "약점까지 쥐고 흔들어라."
 dhe_manchuria_rivalry.4.t:0 "만주의 균형이 기울다"
 dhe_manchuria_rivalry.4.d:0 "만주 변경의 길목마다 조선 상단이 오가고, 촌락마다 조선말이 들리며, 청나라 관헌들은 더 이상 예전처럼 국경을 단속하지 못하고 있습니다. 아직 국경선은 지도 위에 남아 있지만, 현실의 힘은 이미 우리 쪽으로 기울었습니다."
 dhe_manchuria_rivalry.4.f:0 "\"왕조의 경계는 먹으로 그을 수 있으나, 사람의 발자국은 지울 수 없다.\""
 dhe_manchuria_rivalry.4.a:0 "이제 북방 경영을 말할 때다."
 dhe_manchuria_rivalry.5.t:0 "국경 정탐망의 흔적"
 dhe_manchuria_rivalry.5.d:0 "두만강 너머의 산길에서 우리 정탐망이 남긴 표식이 청나라 초병에게 발견되었습니다. 아직 꼬리는 잡히지 않았지만, 현지 연락책들은 며칠 안에 움직이지 않으면 길목 전체가 봉쇄될 것이라 보고했습니다."
 dhe_manchuria_rivalry.5.f:0 "\"눈 위의 발자국은 말보다 정직하다.\""
 dhe_manchuria_rivalry.5.a:0 "조용히 흔적을 지워라."
 dhe_manchuria_rivalry.5.b:0 "돈을 풀어 더 깊은 길을 사라."
 dhe_manchuria_rivalry.5.c:0 "일단 물러나 의심을 피하라."
 dhe_manchuria_rivalry.6.t:0 "변경 촌락의 충돌"
 dhe_manchuria_rivalry.6.d:0 "만주 변경의 한 조선계 촌락에서 청나라 순검과 이주민 사이에 충돌이 벌어졌습니다. 부상자가 생기자 양쪽 모두 각자의 깃발을 찾고 있으며, 사건을 어떻게 처리하느냐에 따라 변경의 민심이 크게 흔들릴 것입니다."
 dhe_manchuria_rivalry.6.f:0 "\"먼저 밭을 간 사람은 땅을 기억하지만, 관문을 지키는 자는 문서만 기억한다.\""
 dhe_manchuria_rivalry.6.a:0 "은밀히 보상금을 보내라."
 dhe_manchuria_rivalry.6.b:0 "개척민을 무장시켜 밀고 나가라."
 dhe_manchuria_rivalry.6.c:0 "소란을 가라앉히고 한발 물러서라."
 dhe_manchuria_rivalry.7.t:0 "매수 장부"
 dhe_manchuria_rivalry.7.d:0 "회유된 청나라 변방 관리의 장부가 우리 손에 들어왔습니다. 장부에는 관문 통행료, 병력 배치, 상단 보호 명목의 뇌물이 적혀 있습니다. 이것은 무기가 될 수도, 불씨가 될 수도 있습니다."
 dhe_manchuria_rivalry.7.f:0 "\"종이는 얇지만, 그 위에 적힌 이름은 쇠사슬보다 무겁다.\""
 dhe_manchuria_rivalry.7.a:0 "장부를 숨기고 연락망을 유지하라."
 dhe_manchuria_rivalry.7.b:0 "부패를 흘려 청의 권위를 흔들어라."
 dhe_manchuria_rivalry.7.c:0 "꼬리를 자르고 관계자를 철수시켜라."
 dhe_manchuria_rivalry.8.t:0 "대청의 항의문"
 dhe_manchuria_rivalry.8.d:0 "청나라 예부가 엄중한 항의문을 보내왔습니다. 그들은 조선 상단과 정탐꾼이 변경 질서를 어지럽히고 있다고 주장하며, 즉각적인 단속과 해명을 요구했습니다."
 dhe_manchuria_rivalry.8.f:0 "\"붉은 인장이 찍힌 문서는 조용히 도착했으나, 그 안의 말은 칼집을 울렸다.\""
 dhe_manchuria_rivalry.8.a:0 "형식적인 유감 표명으로 시간을 벌어라."
 dhe_manchuria_rivalry.8.b:0 "내정 간섭이라며 일축하라."
 dhe_manchuria_rivalry.8.c:0 "국경 주둔군을 전진 배치하라."

 je_dhe_jiandao_expansion:0 "#gold 북방 영토 수복#!"
 je_dhe_jiandao_expansion_reason:0 "두만강 너머의 #gold 간도#!는 예로부터 조선 백성들의 삶의 터전이었습니다. 청나라의 영향력이 미치지 않는 틈을 타, 비밀리에 개척민들을 보내 실질적인 지배력을 확립해야 합니다."
 dhe_progress_bar_jiandao:0 "간도 점유율"
 dhe_progress_bar_jiandao_desc:0 "간도 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 9#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_jiandao_max_tt:0 "간도 전역 장악"
 dhe_jiandao_max_desc_tt:0 "진행도를 9까지 채워 간도의 모든 프로빈스를 장악해야 합니다."
 
 dhe_button_expand_jiandao:0 "간도 개척단 파견"
 dhe_button_expand_jiandao_desc:0 "국경 수비대의 묵인 하에 조선의 백성들이 두만강을 건너 새로운 마을을 개척하도록 은밀하게 지원합니다."
 dhe_button_jiandao_immigration:0 "간도 이민 장려금 지급"
 dhe_button_jiandao_immigration_desc:0 "국고를 풀어 두만강 이북으로 이주하는 백성들에게 정착 자금과 농기구를 지원합니다. 일시적으로 간도 지역의 이주 매력도가 폭발적으로 상승합니다.\n(쿨다운: 1년 / 간도에 조선 영토가 1개 이상 있어야 활성화)"

 dhe_jiandao.1.t:0 "두만강을 건너는 자들"
 dhe_jiandao.1.d:0 "어둠이 깔린 강가, 봇짐을 멘 조선의 백성들이 조용히 뗏목에 오릅니다. 척박한 땅에서 희망을 찾으려는 이들의 발걸음이 마침내 강 너머 간도 땅에 닿았습니다.\n\n새로운 정착촌이 건설되면서, 청나라의 형식적인 국경선은 서서히 무의미해지고 있습니다."
 dhe_jiandao.1.f:0 "우리의 괭이가 닿는 곳이 곧 조선의 영토가 될 것이다."
 dhe_jiandao.1.a:0 "개척은 계속되어야 한다!"
 dhe_jiandao.2.t:0 "간도 영유권 확립"
 dhe_jiandao.2.d:0 "마침내 간도 전역에 조선 백성들의 촌락이 빼곡하게 들어섰고, 태극기가 당당하게 휘날리고 있습니다. 청나라의 항의에도 불구하고, 이제 이 땅은 명백하고 실효적인 조선의 고유 영토임을 전 세계에 선포합니다."
 dhe_jiandao.2.f:0 "북방의 옛 영광을 되찾기 위한 위대한 첫걸음이다."
 dhe_jiandao.2.a:0 "이곳은 영원한 조선의 땅이다!"
 dhe_jiandao.4.t:0 "북간도를 향한 행렬"
 dhe_jiandao.4.d:0 "방이 나붙었습니다. '강을 건너 북쪽의 새 땅을 일구는 자에게는 3년간의 면세와 정착용 소 한 마리를 내어주겠다.'\n\n조선 팔도의 가난한 소작농들과 새로운 기회를 찾는 백성들이 앞다투어 짐을 싸기 시작했습니다. 두만강의 나루터는 매일같이 북쪽으로 향하는 뗏목들로 북새통을 이루고 있으며, 새롭게 편입된 간도 땅에는 하루가 다르게 새로운 촌락이 솟아나고 있습니다."
 dhe_jiandao.4.a:0 "이 땅에 조선 백성의 뿌리를 깊게 내리리라!"
 dhe_modifier_jiandao_settlement:0 "간도 개척 지원 사업"

 je_dhe_outer_manchuria:0 "#gold 고토 수복#!: 연해주 개척"
 je_dhe_outer_manchuria_reason:0 "과거 발해의 영토였던 #gold 연해주#!의 주요 거점들을 수복할 기회가 왔습니다. #n 대청제국의 혼란#!을 틈타 개척단과 군대를 파견하여 국경을 점진적으로 북상시켜야 합니다."
 dhe_progress_bar_outer_manchuria:0 "연해주 편입 진척도"
 dhe_progress_bar_outer_manchuria_desc:0 "연해주 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 13#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 
 dhe_button_outer_manchuria_expansion:0 "무장 개척단 파견"
 dhe_button_outer_manchuria_expansion_desc:0 "연해주의 핵심 거점으로 무장 개척단과 군대를 파견합니다.\n\n#flavor (주의: 대청제국과의 관계도가 악화되며 약간의 악명이 발생합니다. 파견 후 180일의 재정비 기간이 필요합니다.)#!"
 dhe_button_outer_manchuria_immigration:0 "연해주 이주 장려"
 dhe_button_outer_manchuria_immigration_desc:0 "국고를 투입하여 한반도의 굶주린 백성들과 개척민들을 연해주로 이주시킵니다.\n\n#flavor (쿨다운 1년. 즉시 1만 명의 인구가 생성되며 1년간 이주 매력도가 폭발합니다.)#!"

 dhe_expansion.1.t:0 "연해주 거점 확보"
 dhe_expansion.1.d:0 "북방으로 파견된 무장 개척단과 제국군이 청나라의 헐거운 경계망을 뚫고 연해주(외만주)의 새로운 핵심 거점을 장악했다는 낭보가 당도했습니다.\n\n개척민들은 서둘러 촌락을 세우고 대한제국의 깃발을 꽂았으며, 우리 군은 즉각 방어선을 구축하여 실효 지배를 굳건히 하고 있습니다. 과거 발해의 영광이 서린 이 땅이 다시금 우리 제국의 품으로 돌아오고 있습니다!"
 dhe_expansion.1.a:0 "위대한 제국의 북진은 멈추지 않는다!"
 dhe_expansion.2.t:0 "해동성국(海東盛國)의 부활"
 dhe_expansion.2.d:0 "마침내 연해주의 핵심 13개 거점이 모두 우리의 손에 들어왔습니다!\n\n과거 고구려와 발해를 일컬어 '바다 동쪽의 융성한 나라'라 불렀던 영광이 이제 제국의 깃발 아래 다시 피어오르고 있습니다. 대청제국은 우리의 무력시위 앞에 침묵했고, 서구 열강들 역시 극동에 우뚝 선 우리의 새로운 국경을 인정하지 않을 수 없을 것입니다."
 dhe_expansion.2.a:0 "북벌(北伐)의 대업을 이루었도다!"
 dhe_expansion.3.t:0 "북간도를 넘어 연해주로"
 dhe_expansion.3.d:0 "조정에서 개척 자금을 지원하고 토지를 무상으로 분배한다는 방이 나붙자, 삼남 지방의 굶주린 백성들과 봇짐장수들이 다투어 두만강을 건너 연해주로 향하고 있습니다.\n\n이들이 황무지를 일구고 마을을 세울수록, 이 땅이 대청제국이나 러시아의 것이 아닌 확고한 '대한제국의 영토'임을 만방에 증명하게 될 것입니다."
 dhe_expansion.3.a:0 "가서 밭을 일구고 국경을 지키라!"
 
 dhe_modifier_northern_expansion:0 "북방 고토 수복"
 dhe_modifier_northern_expansion_desc:0 "북방의 옛 영토를 수복한 제국의 위상이 드높아졌으며, 군대와 백성들의 사기가 하늘을 찌르고 있습니다."
 dhe_modifier_state_sponsored_migration:0 "국가 주도 이주 사업"
 dhe_modifier_state_sponsored_migration_desc:0 "정부의 막대한 정착 지원금과 토지 분배 약속 덕분에 수많은 개척민들이 이 지역으로 몰려들고 있습니다."

 dhe_expansion.4.t:0 "압록강을 넘어, 두만강을 건너"
 dhe_expansion.4.d:0 "간도와 연해주의 척박한 땅이 마침내 우리의 굳건한 영토로 완전히 편입되었습니다!\n\n수백 년 전, 철령 이북의 땅을 두고 눈물을 머금고 회군해야 했던 역사는 이제 끝났습니다. 우리의 군대와 개척민들이 일궈낸 이 거대한 북방 영토는 대한제국이 아시아의 진정한 패권국으로 거듭나는 튼튼한 요새이자 끝없는 식량 창고가 될 것입니다.\n\n이제 북방의 국경을 튼튼히 다졌으니, 진정한 대제국의 영광을 되찾기 위해 만주 전역과 열도를 향해 시선을 돌릴 때입니다!"
 dhe_expansion.4.a:0 "대동아의 패권은 우리의 것이다!"

 je_dhe_road_to_independence:0 "#gold 자주독립의 길#!"
 je_dhe_road_to_independence_reason:0 "조선은 수백 년간 #n 대청제국#!의 조공국으로 살아왔습니다. 진정한 제국으로 거듭나기 위해서는 이 굴욕적인 사대(事大)의 사슬을 끊어내야 합니다. 독립 준비도를 #v 100#!까지 채워 전군을 무장시키고, 청나라를 상대로 #gold 독립 외교전#!을 선포하여 승리하십시오!"
 
 dhe_progress_bar_independence:0 "독립 준비도"
 dhe_progress_bar_independence_desc:0 "독립 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_ind_base_decay:0 "청나라의 지속적인 외교적 압박"
 dhe_ind_army_strong:0 "든든한 제국군의 위용"
 dhe_ind_qing_civil_war:0 "대청제국의 내전과 혼란"

 dhe_button_refuse_tribute:0 "조공 삭감 거부"
 dhe_button_refuse_tribute_desc:0 "연례적으로 보내던 조공 사절단을 취소하고 청나라 사신을 문전박대합니다. 청나라와의 관계도는 #n 크게 악화#!되지만, #p 독립 준비도#!와 #p 종속국 독립 열망#!이 함께 상승합니다.\n\n#v 쿨다운: 360일#!"
 
 dhe_button_independence_parade:0 "신식 군대 무력시위"
 dhe_button_independence_parade_desc:0 "압록강 국경 지대에서 우리 군대의 화력을 과시하는 대규모 훈련을 벌여 청나라를 도발합니다. #n 막대한 국고#!가 소모되지만, #p 독립 준비도#!와 #p 종속국 독립 열망#!이 크게 상승합니다.\n\n#v 쿨다운: 360일#!"
 
 dhe_button_trigger_independence_war:0 "독립군 결사대 출정 (버프 획득)"
 dhe_button_trigger_independence_war_desc:0 "마침내 때가 왔습니다! 전군에 비상계엄을 선포하고 청나라와의 결전을 준비합니다.\n\n@warning_icon! #R 이 버튼을 누르면 #v 2년#!간 압도적인 군사 버프(#p 공/방 +25%#!)를 얻으며, 청나라와의 관계가 최악으로 치달아 즉시 [외교전: 독립]을 선포할 수 있게 됩니다!#!"

 dhe_independence.1.t:0 "결전의 시간"
 dhe_independence.1.d:0 "전국 방방곡곡에서 의병과 신식 군대가 태극기를 휘날리며 집결하고 있습니다. 수백 년의 굴욕을 씻어낼 시간이 왔습니다. 이제 북경을 향해 우리의 독립을 당당히 요구하고, 그들이 거부한다면 총칼로 쟁취할 것입니다!"
 dhe_independence.1.a:0 "전군, 압록강을 향해 진격하라!"
 
 dhe_independence.2.t:0 "마침내 끊어낸 사대의 굴레"
 dhe_independence.2.d:0 "승리했습니다! 거만했던 대청제국은 우리 군대의 매서운 화력 앞에 무릎을 꿇었고, 마침내 조선에 대한 모든 종주권을 포기하는 조약에 서명했습니다.\n\n조선을 굴복시키지 못한 청나라의 위신은 땅에 떨어졌고, 황제의 통치력이 닿지 않게 된 만주 일대는 군벌과 도적 떼가 들끓는 무법지대로 전락하고 있습니다. 늙은 제국이 무너져내리는 지금, 한반도의 운명은 오직 우리의 손에 달렸습니다. 만국 공법 아래 우뚝 선 완전한 자주독립국, 그것이 바로 우리의 새로운 이름입니다!"
 dhe_independence.2.a:0 "이로써 칭제건원(稱帝建元)의 길이 열렸도다!"

 dhe_mod_independence_war_buff:0 "독립군의 투혼"
 dhe_mod_independence_war_buff_desc:0 "조국의 독립을 쟁취하기 위해 전 장병이 목숨을 걸고 싸우고 있습니다."
 dhe_mod_true_independence:0 "사대의 굴레를 끊다"
 dhe_mod_true_independence_desc:0 "완전한 자주독립을 이룩한 국가의 위상이 만방에 떨치고 있습니다."
 dhe_mod_unmanaged_manchuria:0 "통제 잃은 변방"
 dhe_mod_unmanaged_manchuria_desc:0 "대청제국의 권위가 실추되면서 변방인 만주 일대의 행정력이 완전히 붕괴되었습니다. 치안이 마비되고 조세 장부가 불태워지는 무법지대로 전락했습니다."

 je_dhe_imperial_foreign_strategy:0 "#gold 대한제국 대외전략#!"
 je_dhe_imperial_foreign_strategy_reason:0 "독립 이후 대한제국은 방어만으로 살아남을 수 없습니다. 조정은 이제 북방의 만주 질서를 흔들 것인지, 남방의 일본 해상 질서를 압박할 것인지 결단해야 합니다."
 je_dhe_imperial_foreign_strategy_goal:0 "#v 대외전략 진척도 100#! 달성. 선택한 북진론 또는 남진론 하위 일지의 성과가 진척도를 올립니다."
 dhe_progress_bar_imperial_foreign_strategy:0 "대외전략 진척도"
 dhe_progress_bar_imperial_foreign_strategy_desc:0 "대외전략 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_imperial_foreign_strategy_progress_max_tt:0 "대외전략 진척도 #v 100#! 달성"
 dhe_imperial_foreign_strategy_progress_max_desc_tt:0 "선택한 대외전략 하위 일지와 개발 성과를 모아 대한제국의 독립 이후 대외전략을 확립해야 합니다."
 dhe_imperial_foreign_strategy_second_route_tt:0 "후속 대외 노선 완성"
 dhe_imperial_foreign_strategy_second_route_desc_tt:0 "북진론만으로는 대외전략을 완성할 수 없습니다. 남진론을 통해 제국의 두 번째 대외 축을 확립해야 합니다."
 dhe_imperial_foreign_strategy_status_northern_done:0 "#p 북진론의 핵심 과제가 완성되었습니다.#! 후속 전략으로 제국의 외교 폭을 넓힐 수 있습니다."
 dhe_imperial_foreign_strategy_status_northern_active:0 "#v 북진론#!이 진행 중입니다. 만주 영향력, 간도, 연해주 성과가 대외전략 진척도에 반영됩니다."
 dhe_imperial_foreign_strategy_status_southern_active:0 "#v 남진론#!이 진행 중입니다. 일본과의 해상 압박, 대일수호조규 체결, 일본 장악 성과가 대외전략 진척도에 반영됩니다."
 dhe_imperial_foreign_strategy_status_waiting:0 "독립 이후 대한제국의 대외 노선을 정리하고 있습니다. 먼저 북방에서 청의 영향력을 흔드는 것이 자연스러운 출발점입니다."
 dhe_foreign_strategy_widget_tt:0 "#gold 대한제국 대외전략#!\n\n이 상위 일지는 제국의 대외 확장 방향을 정리합니다.\n\n#gold 북진론#!: 만주·간도·연해주 방향\n#v 남진론#!: 일본·류큐·해상 함포외교 방향"
 dhe_foreign_strategy_widget_title:0 "#gold 제국 대외전략 회의#!"
 dhe_foreign_strategy_widget_northern:0 "북진론"
 dhe_foreign_strategy_widget_northern_status:0 "선택 노선"
 dhe_foreign_strategy_widget_northern_desc:0 "#gold 북진론#!은 만주와 북방 국경을 향한 확장 노선입니다.\n\n#p +20#! 만주 영향력 경쟁 승리\n#p +25#! 간도 전역 장악\n#p +15#! 간도 경작지 확장\n#p +40#! 연해주 13거점 확보"
 dhe_foreign_strategy_widget_southern:0 "남진론"
 dhe_foreign_strategy_widget_southern_status:0 "선택 노선"
 dhe_foreign_strategy_widget_southern_desc:0 "#v 남진론#!은 일본과 해양 질서를 향한 확장 노선입니다.\n\n#p +30#! 대일수호조규 체결\n#p +40#! 일본 장악과 동경총독부 설치 준비\n#p +30#! 후속 남양 영향력 장악"
 je_dhe_northern_campaign_doctrine:0 "#gold 북진론#!"
 je_dhe_northern_campaign_doctrine_reason:0 "독립을 이룬 대한제국의 첫 대외 과제는 북방입니다. 청의 만주 장악력이 흔들리는 틈을 타 영향력 경쟁에서 우위를 잡고, 이어 간도에 실효 지배를 확립해야 합니다.\n\n이 일지는 #v 대한제국 대외전략#!의 하위 노선이며, 먼저 #v 만주 영향력 경쟁#!을 열고 그 성공 뒤 #v 간도 확장#!으로 이어집니다."
 je_dhe_northern_campaign_doctrine_goal:0 "#v 만주 영향력 경쟁#!을 승리로 이끌고, #v 간도#!와 #v 연해주#!를 확보하십시오."
 dhe_northern_campaign_status_grand_done:0 "#p 북진론이 완성되었습니다.#! 간도와 연해주 확보는 이제 대외전략의 핵심 성과가 되었습니다."
 dhe_northern_campaign_status_jiandao:0 "#v 간도 확장#! 단계입니다. 두만강 너머의 실효 지배를 굳혀 북방 진출의 교두보를 확보하십시오."
 dhe_northern_campaign_status_manchuria:0 "#v 만주 영향력 경쟁#! 단계입니다. 정찰망, 정착 기반, 변방 관리 접촉으로 청의 장악력을 흔드십시오."
 dhe_northern_campaign_status_waiting:0 "북방 전략을 정리하고 있습니다. 먼저 만주에서 청의 영향력을 약화시켜야 합니다."

 je_dhe_southern_campaign_doctrine:0 "#v 남진론#!"
 je_dhe_southern_campaign_doctrine_reason:0 "독립을 이룬 대한제국은 더 이상 반도에만 갇힌 나라가 아닙니다. 일본 열도와 류큐, 대마도, 대한해협을 둘러싼 해양 질서를 우리 손으로 다시 써야 합니다.\n\n이 일지는 #gold 대한제국 대외전략#!의 하위 노선이며, 먼저 #v 광무호 사건#!을 통해 일본에 배상과 통상 특혜를 요구합니다."
 je_dhe_southern_campaign_doctrine_goal:0 "#v 광무호 사건#!을 수습하고, 일본과 #p 대일수호조규#!를 체결하십시오."
 dhe_southern_campaign_status_treaty_done:0 "#p 대일수호조규가 체결되었습니다.#! 대한제국은 함포외교로 일본의 문을 두드린 첫 승리를 거두었습니다."
 dhe_southern_campaign_status_gwangmuho_active:0 "#v 광무호 사건#!이 진행 중입니다. 일본 연안에 함대를 보내 항구 포격 임무로 압박을 누적하십시오."
 dhe_southern_campaign_status_direct_treaty:0 "#v 직접 조약 제안 단계#! 일본에 대일수호조규를 직접 제안하십시오. #p 통상 특혜#!, #p 투자권#!, #p 군사 접근권#!, #p 규슈 조약항#!, #p 류큐제도 양도#!를 요구하면 됩니다. 일본이 거부하면 바닐라 함포외교가 열립니다."
 dhe_southern_campaign_status_waiting:0 "남진론이 채택되었습니다. 조정은 광무호를 일본 연안으로 파견할 준비를 하고 있습니다."

 je_dhe_gwangmuho_incident:0 "#v 광무호 사건#!"
 je_dhe_gwangmuho_incident_reason:0 "광무호 사건은 이제 바닐라 조약 시스템을 통해 처리됩니다.\n\n일본에 대일수호조규를 직접 제안하고, #v 해군 적대 위협#!을 걸어 거절을 받아내야 합니다. 조규의 핵심은 #p 통상 특혜#!, #p 투자권#!, #p 군사 접근권#!, #p 규슈 조약항#!, #p 류큐제도 양도#!입니다. 그 뒤 열린 함포외교 상태에서 일본의 규슈, 주고쿠, 시코쿠, 간사이, 류큐 연안 주가 #v 항구 포격#! 상태가 되면 압박이 누적됩니다."
 je_dhe_gwangmuho_incident_goal:0 "일본에 대일수호조규를 직접 제안해 거절을 받아 함포외교를 열고, 일본 연안에서 #v 항구 포격#! 임무를 일정 기간 유지하십시오."
 dhe_progress_bar_gwangmuho_bombardment:0 "함포외교 압박"
 dhe_progress_bar_gwangmuho_bombardment_desc:0 "함포외교 압박 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#v 8#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_gwangmuho_bombardment_progress_max_tt:0 "일본 연안 함포외교 압박 #v 8#! 달성"
 dhe_gwangmuho_bombardment_progress_max_desc_tt:0 "일본의 규슈·주고쿠·시코쿠·간사이·류큐 연안 주가 항구 포격 상태일 때 매주 압박이 증가합니다."
 dhe_gwangmuho_incident_status_bombarding:0 "#p 일본 연안이 포격받고 있습니다.#! 외무성은 일본 정부가 오래 버티지 못할 것이라 보고합니다."
 dhe_gwangmuho_incident_status_hostilities_open:0 "#p 함포외교가 열렸습니다.#! 함대를 일본 연안 해역으로 보내 #v 항구 포격#! 임무를 수행하십시오."
 dhe_gwangmuho_incident_status_navy_too_small:0 "#n 해군 규모가 부족합니다.#! 바닐라 함포외교 위협은 해군 규모 #v 10#! 이상이어야 합니다. 먼저 함선을 최소 10척까지 확보해야 일본에 해군 적대 위협을 걸 수 있습니다."
 dhe_gwangmuho_incident_status_need_treaty_threat:0 "#n 아직 함포외교가 열리지 않았습니다.#! 일본에 조약을 직접 제안하고, #v 해군 적대 위협#!을 사용해 거절을 받아내야 항구 포격 임무를 수행할 수 있습니다. 조약에는 #p 통상 특혜#!, #p 투자권#!, #p 군사 접근권#!, #p 규슈 조약항#!, #p 류큐제도 양도#!를 넣으십시오.\n\n바닐라 조건: 해군 규모 #v 10#! 이상, 일본보다 높은 해군 전투력, 일본이 해안 주 보유, 관계가 우호적 미만, 동맹·방위조약·독립보장 관계가 아님."

 je_dhe_japan_control:0 "#v 일본 장악#!"
 je_dhe_japan_control_reason:0 "#p 대일수호조규#!는 일본을 완전히 무너뜨린 것이 아니라, 대한제국이 일본 정치와 항만, 군사조직 안으로 들어갈 문을 연 사건입니다.\n\n이 일지는 일본을 단순히 병합하는 대신, 친한 관료·군사고문·투자망·치안망을 통해 #gold 동경총독부#! 설치 기반을 만드는 남진론 후속 단계입니다."
 je_dhe_japan_control_goal:0 "#v 일본 장악도#!를 #p 100#!까지 올리고, #n 일본 저항도#!를 #v 80#! 미만으로 유지하십시오. 또한 #gold 대한제국#!이 선포되어야 하며, 대한제국은 일본보다 높은 육군·해군 전력투사와 위신을 갖추고 일본 GDP의 #v 10%#! 이상을 소유해야 합니다."
 dhe_progress_bar_japan_control:0 "일본 장악도"
 dhe_progress_bar_japan_control_desc:0 "장악도 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#p 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_progress_bar_japan_resistance:0 "일본 저항도"
 dhe_progress_bar_japan_resistance_desc:0 "저항도 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/#n 100#! (#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!)"
 dhe_japan_control_goal_tt:0 "동경총독부 설치 기반 확보"
 dhe_japan_control_goal_desc_tt:0 "#v 일본 장악도#!가 #p 100#! 이상이고, #n 일본 저항도#!가 #v 80#! 미만이어야 합니다. 저항도가 #n 100#!에 도달하면 장악 시도가 위기에 빠집니다."
 dhe_japan_control_korean_empire_tt:0 "#gold 대한제국#! 선포"
 dhe_japan_control_korean_empire_desc_tt:0 "동경총독부 설치는 조선 왕국의 임시 조치가 아니라, #gold 대한제국#!의 대외 통치 체계로 선포되어야 합니다."
 dhe_japan_control_gdp_ownership_10_tt:0 "대한제국이 일본 GDP의 #v 10%#! 이상 소유"
 dhe_japan_control_gdp_ownership_10_desc_tt:0 "대일수호조규로 얻은 #p 투자권#!을 활용해 일본 산업과 기반시설에 투자하십시오. 일본 GDP 중 대한제국이 소유한 비율이 #v 10%#! 이상이어야 총독부 설치 준비를 완료할 수 있습니다."
 dhe_japan_control_military_superiority_tt:0 "대한제국의 육군·해군 전력투사가 일본보다 높음"
 dhe_japan_control_military_superiority_desc_tt:0 "일본 정부를 총독부 체제로 재편하려면 대한제국의 #v 육군 전력투사#!와 #v 해군 전력투사#!가 모두 일본보다 높아야 합니다."
 dhe_japan_control_prestige_superiority_tt:0 "대한제국의 위신이 일본보다 높음"
 dhe_japan_control_prestige_superiority_desc_tt:0 "국제사회와 일본 내부 관료층이 총독부 체제를 현실로 받아들이려면 대한제국의 #v 위신#!이 일본보다 높아야 합니다."
 dhe_japan_control_status_ready:0 "#p 총독부 설치 준비가 끝났습니다.#! 이제 일본 내 친한 관료망과 군사·경제 기반은 대한제국의 명령을 기다리고 있습니다."
 dhe_japan_control_status_resistance_high:0 "#n 일본 저항도가 위험합니다.#! 치안망 정비나 투자 회유를 통해 저항을 낮추지 않으면 장악 시도가 붕괴할 수 있습니다."
 dhe_japan_control_status_building:0 "#v 일본 장악#! 단계입니다. 친한 내각, 군사고문, 항만 투자, 치안망을 조합해 장악도를 올리십시오."
 dhe_japan_control_treaty_base:0 "대일수호조규의 조약 기반"
 dhe_japan_control_naval_presence:0 "대한제국 해군의 주둔 압박"
 dhe_japan_control_bureaucracy:0 "충분한 행정력"
