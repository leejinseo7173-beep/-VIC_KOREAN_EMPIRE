l_korean:
 DHE_Gwangmu_Test_Fleet:0 "광무호 시험함대"
 dhe_korean_warship_design_1:0 "대한식 초노급 설계 I"
 dhe_korean_warship_design_1_desc:0 "제국 군항 운용 경험과 초노급함 기술을 결합해 대한제국 해군의 첫 원양 보급 표준을 세웁니다."
 dhe_korean_warship_design_2:0 "대한식 초노급 설계 II"
 dhe_korean_warship_design_2_desc:0 "대한제국 해군 설계국의 장갑 배치 실험을 근대 주력함 표준으로 정리하여 초노급함의 생존성과 연안 결전 능력을 끌어올립니다."
 dhe_korean_warship_design_3:0 "대한식 초노급 설계 III"
 dhe_korean_warship_design_3_desc:0 "초노급함을 중심으로 순양함 정찰과 연합함대 운용 교리를 하나의 체계로 묶습니다."
 dhe_korean_carrier_design:0 "이순신급 항공모함 설계"
 dhe_korean_carrier_design_desc:0 "비행갑판 운용과 함재기 정비 체계를 결합해 대한제국식 항공모함 표준을 완성합니다."
 dhe_korean_carrier_module_deck:0 "주작식 비행갑판 모듈"
 dhe_korean_carrier_module_deck_desc:0 "붉은 봉황의 날개처럼 함재기를 띄우는 비행갑판과 갑판 통제 체계를 표준화합니다."
 dhe_korean_carrier_module_airgroup:0 "천익 함재기단 모듈"
 dhe_korean_carrier_module_airgroup_desc:0 "하늘을 찢고 나아가는 제국 함재기단의 정비, 출격, 착함 절차를 표준화합니다."
 dhe_korean_carrier_module_engine:0 "풍백식 고속기관 모듈"
 dhe_korean_carrier_module_engine_desc:0 "바람의 신을 본뜬 고속기관 체계로 항공작전에 필요한 기동력과 기관 신뢰성을 높입니다."
 dhe_korean_carrier_module_hangar:0 "운룡 격납고 모듈"
 dhe_korean_carrier_module_hangar_desc:0 "구름 속 용의 둥지처럼 함재기, 연료, 탄약을 장거리 작전에 맞춰 보관하는 체계입니다."
 dhe_korean_submarine_design:0 "장보고급 잠수함 설계"
 dhe_korean_submarine_design_desc:0 "연안 잠항과 통상파괴 작전을 결합한 대한제국식 잠수함 표준을 완성합니다."
 dhe_korean_submarine_module_hull:0 "흑룡 압력선체 모듈"
 dhe_korean_submarine_module_hull_desc:0 "검은 용처럼 깊은 바다 아래 숨어드는 강화 압력선체 표준입니다."
 dhe_korean_submarine_module_torpedo:0 "비궁 어뢰관 모듈"
 dhe_korean_submarine_module_torpedo_desc:0 "보이지 않는 활처럼 주력함과 수송선을 찌르는 장거리 어뢰관 배치입니다."
 dhe_korean_submarine_module_engine:0 "은류 정숙기관 모듈"
 dhe_korean_submarine_module_engine_desc:0 "물밑의 은빛 흐름처럼 소음을 줄이고 기동성을 높이는 기관 체계입니다."
 dhe_korean_submarine_module_stores:0 "심해 초계고 모듈"
 dhe_korean_submarine_module_stores_desc:0 "장기 초계와 통상파괴 작전을 지원하는 심해 작전용 보급 체계입니다."
 dhe_korean_warship_module_armor:0 "현무갑 장갑 모듈"
 dhe_korean_warship_module_armor_desc:0 "현무의 등껍질처럼 두꺼운 장갑대와 통합 손상통제반을 초노급함에 적용할 수 있게 합니다."
 dhe_korean_warship_module_battery:0 "황룡 주포 모듈"
 dhe_korean_warship_module_battery_desc:0 "황룡의 포효처럼 대구경 일제사격을 쏟아붓는 주포 배치를 초노급함에 적용할 수 있게 합니다."
 dhe_korean_warship_module_propulsion:0 "백호 고압기관 모듈"
 dhe_korean_warship_module_propulsion_desc:0 "백호의 돌진처럼 거대한 선체를 밀어붙이는 고압기관 체계를 초노급함에 적용할 수 있게 합니다."
 dhe_korean_warship_module_stores:0 "청룡 원양보급 모듈"
 dhe_korean_warship_module_stores_desc:0 "청룡이 바다를 감싸듯 장거리 작전을 떠받치는 원양 보급 체계를 초노급함에 적용할 수 있게 합니다."
 ship_type_dhe_gwangmu_super_dreadnought:0 "광무급 초노급함"
 ship_type_dhe_gwangmu_super_dreadnought_desc:0 "대한제국 해군 설계국이 초노급함을 바탕으로 강화 장갑대와 장거리 원양 보급 체계를 결합한 주력함입니다."
 ship_type_dhe_haedong_aircraft_carrier:0 "이순신급 항공모함"
 ship_type_dhe_haedong_aircraft_carrier_desc:0 "대한제국 해군 설계국이 원양 작전과 함재기 운용을 엮어 만든 고유 항공모함입니다."
 ship_type_dhe_jangbogo_submarine:0 "장보고급 잠수함"
 ship_type_dhe_jangbogo_submarine_desc:0 "좁은 해협과 장거리 통상로를 모두 노리는 대한제국식 잠수함입니다."
 ship_mod_dhe_turtle_armor:0 "현무갑 장갑대"
 ship_mod_dhe_turtle_armor_desc:0 "현무의 등껍질을 근대 철갑함 설계로 재해석한 두꺼운 장갑 배치입니다."
 ship_mod_dhe_gwangmu_heavy_battery:0 "황룡 중주포대"
 ship_mod_dhe_gwangmu_heavy_battery_desc:0 "황룡의 포효처럼 대구경 일제사격을 쏟아붓도록 재정리한 중주포 배치입니다."
 ship_mod_dhe_hangang_propulsion:0 "백호 고압기관"
 ship_mod_dhe_hangang_propulsion_desc:0 "백호의 돌진처럼 거대한 초노급함을 밀어붙이는 강화 기관 배치입니다."
 ship_mod_dhe_jemulpo_coastal_stores:0 "청룡 원양보급고"
 ship_mod_dhe_jemulpo_coastal_stores_desc:0 "청룡이 바다를 감싸듯 장거리 항해와 결전을 떠받치는 탄약, 연료, 보급품 배치입니다."
 utility_mod_dhe_integrated_damage_control:0 "통합 손상통제반"
 utility_mod_dhe_integrated_damage_control_desc:0 "화재, 침수, 기관 고장을 한 지휘망 아래에서 처리하도록 훈련된 함내 손상통제 체계입니다."
 ship_mod_dhe_haedong_flight_deck:0 "주작 비행갑판"
 ship_mod_dhe_haedong_flight_deck_desc:0 "주작의 날개처럼 함재기를 띄우는 강화 비행갑판과 갑판 통제 체계입니다."
 ship_mod_dhe_haedong_air_group:0 "천익 함재기단"
 ship_mod_dhe_haedong_air_group_desc:0 "정찰과 타격을 동시에 수행하도록 편성된 제국 항공모함의 주력 함재기단입니다."
 ship_mod_dhe_haedong_turbines:0 "풍백 고속기관"
 ship_mod_dhe_haedong_turbines_desc:0 "바람을 다스리는 듯한 속도로 함대를 따라붙기 위한 고출력 기관입니다."
 ship_mod_dhe_haedong_hangar_stores:0 "운룡 격납고"
 ship_mod_dhe_haedong_hangar_stores_desc:0 "구름 속 용의 둥지처럼 함재기, 부품, 연료를 품는 원양 작전용 격납고입니다."
 ship_mod_dhe_jangbogo_pressure_hull:0 "흑룡 압력선체"
 ship_mod_dhe_jangbogo_pressure_hull_desc:0 "검은 용처럼 깊은 물속을 파고드는 강화 잠수함 선체입니다."
 ship_mod_dhe_jangbogo_torpedo_tubes:0 "비궁 어뢰관"
 ship_mod_dhe_jangbogo_torpedo_tubes_desc:0 "보이지 않는 활처럼 적 주력함의 흘수선을 노리는 강화 어뢰관 배치입니다."
 ship_mod_dhe_jangbogo_silent_engine:0 "은류 정숙기관"
 ship_mod_dhe_jangbogo_silent_engine_desc:0 "물밑 은빛 흐름처럼 조용히 움직여 탐지 위험을 낮추는 기관 체계입니다."
 ship_mod_dhe_jangbogo_patrol_stores:0 "심해 초계고"
 ship_mod_dhe_jangbogo_patrol_stores_desc:0 "깊은 바다 아래에서 긴 초계와 통상파괴 작전을 버티게 하는 압축 보급 공간입니다."
