l_korean:
 dhe_korean_warship_design_1:0 "대한식 초노급 설계 I"
 dhe_korean_warship_design_1_desc:0 "제물포 군항 운용 경험과 초노급함 기술을 결합해 대한제국 해군의 첫 원양 보급 표준을 세웁니다."
 dhe_korean_warship_design_2:0 "대한식 초노급 설계 II"
 dhe_korean_warship_design_2_desc:0 "대한제국 해군 설계국의 장갑 배치 실험을 근대 주력함 표준으로 정리하여 초노급함의 생존성과 연안 결전 능력을 끌어올립니다."
 dhe_korean_warship_design_3:0 "대한식 초노급 설계 III"
 dhe_korean_warship_design_3_desc:0 "초노급함을 중심으로 순양함 정찰과 연합함대 운용 교리를 하나의 체계로 묶습니다."
 dhe_korean_warship_module_armor:0 "광무식 장갑 모듈"
 dhe_korean_warship_module_armor_desc:0 "귀갑식 장갑대와 통합 손상통제반을 초노급함에 적용할 수 있게 합니다."
 dhe_korean_warship_module_battery:0 "광무식 주포 모듈"
 dhe_korean_warship_module_battery_desc:0 "광무식 중주포대를 초노급함에 적용할 수 있게 합니다."
 dhe_korean_warship_module_propulsion:0 "광무식 기관 모듈"
 dhe_korean_warship_module_propulsion_desc:0 "한강식 고압 기관을 초노급함에 적용할 수 있게 합니다."
 dhe_korean_warship_module_stores:0 "광무식 보급 모듈"
 dhe_korean_warship_module_stores_desc:0 "제물포식 연안 보급창을 초노급함에 적용할 수 있게 합니다."
 ship_type_dhe_gwangmu_super_dreadnought:0 "광무급 초노급함"
 ship_type_dhe_gwangmu_super_dreadnought_desc:0 "대한제국 해군 설계국이 초노급함을 바탕으로 강화 장갑대와 장거리 원양 보급 체계를 결합한 주력함입니다."
 ship_mod_dhe_turtle_armor:0 "귀갑식 장갑대"
 ship_mod_dhe_turtle_armor_desc:0 "거북선의 상징을 근대 철갑함 설계로 재해석한 두꺼운 장갑 배치입니다."
 ship_mod_dhe_gwangmu_heavy_battery:0 "광무식 중주포대"
 ship_mod_dhe_gwangmu_heavy_battery_desc:0 "초노급함의 대구경 일제사격을 대한제국 연안과 원양 작전에 맞춰 재정리한 중주포 배치입니다."
 ship_mod_dhe_hangang_propulsion:0 "한강식 고압 기관"
 ship_mod_dhe_hangang_propulsion_desc:0 "좁은 해협과 긴 연안 항로에서 빠르게 기동하기 위한 강화 기관 배치입니다."
 ship_mod_dhe_jemulpo_coastal_stores:0 "제물포식 연안 보급창"
 ship_mod_dhe_jemulpo_coastal_stores_desc:0 "항구와 가까운 해역에서 오래 작전하기 위한 탄약, 석탄, 보급품 배치입니다."
 utility_mod_dhe_integrated_damage_control:0 "통합 손상통제반"
 utility_mod_dhe_integrated_damage_control_desc:0 "화재, 침수, 기관 고장을 한 지휘망 아래에서 처리하도록 훈련된 함내 손상통제 체계입니다."
